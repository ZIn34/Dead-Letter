<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Letter</title>
<meta name="theme-color" content="#1b2320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dead Letter">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=Caveat:wght@400;600&family=Homemade+Apple&family=Dancing+Script:wght@500&family=Rock+Salt&family=Shadows+Into+Light&display=swap">
<style>
:root{
  --ground:#1b2320; --desk:#243129; --desk-edge:#2f4035; --brass:#b8925a; --brass-dim:#7d6640;
  --paper:#efe6d2; --paper-deep:#e3d7bc; --paper-shadow:#c9bb9c; --ink:#232f3b; --ink-soft:#4a5561;
  --pencil:#6f675a; --red:#b0392e; --red-soft:rgba(176,57,46,.16); --lamp:#e8c15a; --lamp-soft:rgba(232,193,90,.22);
  --wood:#3a2a1e; --wood-edge:#5a4331;
  --sans: "Crimson Pro", Georgia, "Times New Roman", serif;
  --fell: "IM Fell English", "Crimson Pro", Georgia, serif;
  --typed: "Special Elite", "Courier New", Courier, monospace;
  --hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --nbfont: var(--hand); --nbsize:21px; --nbline:28px;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip;background:
  radial-gradient(120% 60% at 50% -10%, rgba(232,193,90,.20), transparent 60%), var(--desk);
  box-shadow:0 0 0 1px var(--desk-edge)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px 10px;border-bottom:1px solid var(--brass-dim)}
header h1{font:400 22px/1 var(--fell);margin:0;letter-spacing:.02em;color:var(--brass)}
header h1 small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-dim);margin-top:5px;font-family:var(--sans)}
.ledger{display:flex;gap:12px;flex:none;font-variant-numeric:tabular-nums;font-size:14px;color:var(--brass)}
.ledger b{display:block;font:400 20px/1 var(--fell);color:var(--paper)}
.ledger span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim)}
.music{width:34px;height:34px;border-radius:50%;border:1px solid var(--brass-dim);color:var(--brass-dim);font:400 18px/32px var(--fell);text-align:center;align-self:center}
.music.on{color:#1b1b17;background:var(--brass);border-color:#d8b478}
main{flex:1;min-height:0;position:relative}
.panel{display:none;padding:16px 16px 110px;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:.6}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){header h1{font-size:20px} .ledger{gap:9px} .ledger b{font-size:18px} .music{width:30px;height:30px;line-height:28px;font-size:16px} .panel{padding-left:12px;padding-right:12px} .paper{padding:22px 16px 20px}}

/* Coach */
.coach{background:rgba(232,193,90,.10);border:1px solid var(--brass);border-left:4px solid var(--lamp);padding:12px 14px;margin:0 0 14px;color:var(--paper)}
.coach p{margin:0 0 8px;font-size:16px}
.coach .row{gap:14px;align-items:center}
.coach .row button{font:400 13px var(--fell);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.coach .row button.ok{color:#1b1b17;background:var(--brass);padding:6px 12px}
.coach small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}

/* Shelf */
.shelf{position:relative;height:74px;margin:0 -4px 18px;background:linear-gradient(180deg,#4a3627,var(--wood) 60%,#2a1d14);border-top:2px solid var(--wood-edge);border-bottom:6px solid #1c130d;box-shadow:0 8px 16px rgba(0,0,0,.4) inset,0 2px 0 #5a4331}
.shelf .items{position:absolute;left:14px;right:14px;bottom:4px;display:flex;align-items:flex-end;justify-content:space-around;height:64px}
.shelf svg{height:52px;width:auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.shelf .hint{position:absolute;inset:0;display:grid;place-items:center;font:italic 14px var(--fell);color:rgba(232,193,90,.55)}

/* Common */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:6px 0 10px}
.paper{overflow-wrap:anywhere;background:var(--paper);color:var(--ink);padding:26px 22px 22px;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.35), 0 1px 0 var(--paper-shadow) inset;margin-bottom:14px}
.paper::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),transparent 30%,rgba(0,0,0,.03));pointer-events:none}
.file{font-family:var(--typed);font-size:14px;line-height:1.55}
.file h2{font:400 22px var(--fell);margin:0 0 2px;letter-spacing:.02em}
.file .no{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--pencil);margin-bottom:12px}
.file dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px}
.file dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);padding-top:3px}
.file dd{margin:0}
.file .sec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--pencil);margin:12px 0 4px;border-bottom:1px solid var(--paper-shadow)}
.file ul{margin:0;padding-left:18px}
.file li{margin:3px 0}
.file .gaz{font-family:var(--sans);font-style:italic;font-size:16px;margin:0}
.stamp{position:absolute;right:14px;top:14px;transform:rotate(-10deg);border:2px solid var(--red);color:var(--red);font:400 13px/1.15 var(--fell);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;text-align:center;opacity:.85;border-radius:3px;mix-blend-mode:multiply}
.stamp.cold{border-color:var(--ink-soft);color:var(--ink-soft)}

.suspects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sus{background:var(--paper-deep);color:var(--ink);padding:12px 12px 10px;text-align:left;border:1px solid var(--paper-shadow);box-shadow:2px 3px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px;position:relative}
.sus:nth-child(2n){transform:rotate(.5deg)} .sus:nth-child(2n+1){transform:rotate(-.4deg)}
.sus .med{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 18px var(--fell);color:var(--paper);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--paper-shadow)}
.sus b{font:400 17px var(--fell);line-height:1.15}
.sus i{font-size:13px;color:var(--pencil);font-style:normal;letter-spacing:.04em}
.sus p{margin:0;font-size:14px;line-height:1.3}
.sus .asked{position:absolute;top:8px;right:10px;font:400 11px var(--fell);color:var(--pencil);letter-spacing:.1em}
.sus.guessed{outline:2px dashed var(--ink-soft);outline-offset:-2px}
.sus.culprit{outline:2px solid var(--red);outline-offset:-2px}

.hintline{font-style:italic;color:var(--brass);font-size:15px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--brass);color:#1b1b17;font:400 15px var(--fell);letter-spacing:.06em;padding:11px 16px;border:1px solid #d8b478;box-shadow:0 2px 0 var(--brass-dim);text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--brass);border-color:var(--brass-dim);box-shadow:none}
.btn.danger{background:var(--red);color:var(--paper);border-color:#d0645a;box-shadow:0 2px 0 #6e231c}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.card-note{background:rgba(0,0,0,.18);border:1px solid var(--brass-dim);padding:14px 16px;margin:0 0 16px;color:var(--paper)}
.card-note h2{font:400 20px var(--fell);margin:0 0 6px;color:var(--brass)}
.card-note p{margin:0 0 8px;font-size:16px}
.card-note p:last-child{margin:0}
.card-note .row{margin-top:10px}

/* Sheet */
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:480px;background:var(--paper);color:var(--ink);padding:18px 18px 22px;box-shadow:0 -10px 30px rgba(0,0,0,.45);transition:transform .25s ease;z-index:20;max-height:82dvh;overflow:auto}
#sheet.open{transform:translate(-50%,0)}
#sheet h3{font:400 22px var(--fell);margin:0 0 2px}
#sheet .sub{color:var(--pencil);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
#sheet p{margin:0 0 10px;font-size:16px}
#sheet .close{position:absolute;top:10px;right:14px;font:20px var(--fell);color:var(--pencil)}
.qs{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.q{text-align:left;border:1px solid var(--paper-shadow);background:#f6efdc;padding:10px 12px;font-size:15.5px;color:var(--ink);width:100%}
.q small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:2px}
.a{font-family:var(--hand);font-size:21px;line-height:1.25;color:#2f2a22;padding:8px 12px 10px 16px;border-left:3px solid var(--brass);margin:0 0 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
.scrim.on{display:block}
.verdict{font:400 30px var(--fell);color:var(--red);margin:0 0 4px}
.verdict.cold{color:var(--ink-soft)}
.pay{font:400 24px var(--fell);color:#3b6b3f;margin:0 0 8px}

/* Cases */
.caselist{display:flex;flex-direction:column;gap:10px}
.casebtn{display:flex;align-items:center;gap:12px;background:var(--paper-deep);color:var(--ink);padding:12px 14px;border:1px solid var(--paper-shadow);text-align:left;width:100%;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.casebtn .n{font:400 13px var(--fell);color:var(--pencil);letter-spacing:.1em;width:28px;flex:none}
.casebtn b{font:400 17px var(--fell);display:block}
.casebtn i{font-style:normal;font-size:12px;color:var(--pencil);letter-spacing:.06em;text-transform:uppercase}
.casebtn .st{margin-left:auto;font:400 13px var(--fell);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.casebtn .st.ok{color:#3b6b3f} .casebtn .st.cold{color:var(--pencil)} .casebtn .st.open{color:var(--red)}
.casebtn.locked{opacity:.45}
.casebtn.cur{outline:2px solid var(--lamp);outline-offset:-2px}

/* Notebook */
textarea.nb{width:100%;min-height:260px;resize:vertical;border:0;border-top:1px solid var(--paper-shadow);padding:10px 6px;font-family:var(--nbfont);font-size:var(--nbsize);line-height:var(--nbline);color:#2f2a22;background:
  repeating-linear-gradient(transparent 0 calc(var(--nbline) - 1px), var(--paper-shadow) calc(var(--nbline) - 1px) var(--nbline)) 0 9px/100% var(--nbline), #f6efdc;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.stm{background:var(--paper);color:var(--ink);padding:10px 12px;margin-bottom:8px;box-shadow:1px 2px 0 rgba(0,0,0,.25);border-left:3px solid var(--brass)}
.stm b{font:400 16px var(--fell);display:block;margin-bottom:4px}
.stm div{font-family:var(--typed);font-size:12.5px;line-height:1.5;margin:0 0 4px}
.stm div span{color:var(--pencil)}

/* Shop */
.money{font:400 26px var(--fell);color:var(--lamp);margin:0 0 12px}
.money small{font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-left:8px}
.goods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.good{background:var(--paper-deep);color:var(--ink);border:1px solid var(--paper-shadow);padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.good svg{height:48px;width:auto;align-self:center;margin:4px 0}
.good b{font:400 16px var(--fell)}
.good i{font-style:normal;font-size:13px;color:var(--pencil)}
.good .buy{margin-top:auto;align-self:stretch;text-align:center;font:400 14px var(--fell);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;background:var(--brass);color:#1b1b17;border:1px solid #d8b478}
.good .buy.owned{background:transparent;color:var(--pencil);border-color:var(--paper-shadow)}
.good .buy[disabled]{opacity:.45}
.hands{display:flex;flex-direction:column;gap:10px}
.handrow{background:var(--paper);color:#2f2a22;padding:10px 12px;display:flex;align-items:center;gap:12px;border:1px solid var(--paper-shadow);box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.handrow .prev{flex:1;line-height:1.25;overflow-wrap:anywhere}
.handrow .prev small{display:block;font:400 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-top:4px}
.handrow .buy{flex:none;font:400 13px var(--fell);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;background:var(--brass);color:#1b1b17;border:1px solid #d8b478;min-width:74px;text-align:center}
.handrow .buy.use{background:transparent;color:var(--ink);border-color:var(--pencil)}
.handrow .buy.inuse{background:var(--lamp);border-color:#f0d27a}
.handrow .buy[disabled]{opacity:.45}

/* Tabs */
nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:#141a17;border-top:1px solid var(--brass-dim);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{padding:12px 4px 10px;font:400 14px var(--fell);letter-spacing:.1em;text-transform:uppercase;color:var(--brass-dim);position:relative}
nav.tabs button.on{color:var(--lamp)}
nav.tabs button.pulse{color:var(--lamp);text-shadow:0 0 8px var(--lamp)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--paper);color:var(--ink);padding:10px 16px;font:400 16px var(--fell);box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .3s;z-index:30;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.musicbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 0;padding:10px 12px;border:1px solid var(--brass-dim);color:var(--brass);font-size:14px}
.musicbar b{font:400 15px var(--fell);color:var(--paper)}
.musicbar .row{gap:14px}
.musicbar .row button{font:400 12px var(--fell);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.foot{margin-top:24px;font-size:13px;color:var(--brass-dim);text-align:center}
.foot button{text-decoration:underline;color:var(--brass-dim)}
</style>

<div id="app">
  <header>
    <h1>Dead Letter<small>Saltmarsh · Detective's desk</small></h1>
    <div class="ledger">
      <div><b id="hMoney">£0</b><span>Purse</span></div>
      <div><b id="hSolved">0</b><span>Solved</span></div>
      <button class="music" id="musicBtn" data-act="music" aria-label="Music on or off" title="Music">♪</button>
    </div>
  </header>
  <main>
    <section class="panel on" id="p-desk"></section>
    <section class="panel" id="p-cases"></section>
    <section class="panel" id="p-notebook"></section>
    <section class="panel" id="p-shop"></section>
  </main>
  <nav class="tabs">
    <button data-tab="desk" class="on">Desk</button>
    <button data-tab="cases">Cases</button>
    <button data-tab="notebook">Notebook</button>
    <button data-tab="shop">Shop</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>

   "answers":["At the ovens from four, like every morning. Ines will swear to it, and so will half of Rope Walk's noses.","He called me a thief in front of a crew once, over a coil of rope I never took. I hadn't spoken to him since and didn't mean to.","Ines told me when I came off the ovens at seven. The whole street had it by then."]},
  {"id":"dunn","name":"Cornelius Dunn","age":35,"job":"Crewe's clerk","color":"#4a4f6b","look":"Up-coast vowels; a good coat, damp at the hem.","note":"Kept Crewe's books for nine years. Rooms at the Drowned Bell. Stood to lose his place if Crewe's business failed, which it was doing.",
   "answers":["Asleep at the Bell until eight. I'd been in the taproom until two. Mrs Kell will remember; she remembers everyone's tab.","I kept his books for nine years. He was a hard man to keep books for, latterly.","I went to the loft at eight to bring him the day's letters. I came up the stair and there he was, on the floor by the table. I sent the boy for the constable."]},
  {"id":"kessler","name":"Ruth Kessler","age":44,"job":"boatwright","color":"#6b3f3f","look":"Forearms like hawsers; smells of pitch.","note":"Her yard supplied the ladder. She had quarrelled with Crewe over an unpaid bill for a mast.",
   "answers":["At my forge from five. My boys carried the ladder round to Thorne's at five and were back by ten past. I never left the yard.","He owed me eleven pounds for a mizzen and had done since March. I'd have taken it out of his hide, but not with a needle.","One of my boys came running at eight, said the merchant was dead. I'd had the fire going three hours by then."]}
 ],
 "culprit":"dunn",
 "solution":"Dunn says he 'came up the stair' at eight and found Crewe. There was no stair. It had been taken down the day before, and anyone who actually climbed to that loft on Thursday would remember a ladder in the rain. He was not there at eight. He was there a little after five, when Agnes Thorne heard an up-coast voice overhead, and his coat hem was still damp from the ladder. With Crewe dead before he signed for Thorne's shop, Dunn was left holding nine years of books nobody would ever audit.",
 "arrest":"Dunn asks to fetch his good hat. He is not allowed."},

{"id":"light","title":"The Light Went Out","reward":6,
 "brief":{"victim":"Pieter Voss, 66, lighthouse keeper","weapon":"None. A fall of sixty feet from the lamp gallery onto the rock.","time":"Between nine and ten at night, Saturday","place":"The lighthouse, off the end of Gull Lane",
  "public":"\"The keeper fell from the rocks while fishing.\" The police know better: the gallery door was open and his pipe was on the rail.",
  "facts":["The harbourmaster's log records the light going out at 9:40, and the Halcyon, inbound, sheering off the rock with feet to spare.","Winn's telegraph log shows a wire delivered to the rock at 9:05; the receipt is signed by Voss.","Voss did not fish. He said so to anyone who asked."]},
 "questions":["Where were you between nine and ten?","What did Pieter Voss mean to you?","What do you think happened to him?"],
 "suspects":[
  {"id":"jonas","name":"Jonas Voss","age":33,"job":"nephew, assistant keeper","color":"#3f5560","look":"Tall, wind-reddened, hands in his pockets.","note":"Next in line for the keeper's post and the cottage. Had asked the Board twice to retire his uncle. The Board had refused twice.",
   "answers":["The Weavers' Arms, from eight until Pike put me out at eleven. Up the hill. I saw nothing.","My uncle taught me the lamp. He should have given it up five years ago and I said so to his face.","He'd no business out on the gallery in that wind at his age. He'll have leaned on the rail for his pipe and gone over. I told him. I told him a dozen times."]},
  {"id":"brid","name":"Bríd Nolan","age":70,"job":"brings the keeper his supper","color":"#5a3f5e","look":"Bent, sharp, a basket on her arm from habit.","note":"Has walked Voss's supper out along the causeway every evening for eleven years. The last person known to see him alive but one.",
   "answers":["Home by half past eight. I left him his supper at eight with the lamp already lit and himself asleep in his chair, and I let myself out.","He was a kind man who never said two words together. I'll miss the quiet of him.","The rocks are wicked in the wet. But he didn't fish, whatever the paper says. He hadn't the patience."]},
  {"id":"steel","name":"Captain Amos Steel","age":50,"job":"master of the barque Halcyon","color":"#6b4a3a","look":"Beard like a hedge; still shaking with anger.","note":"His ship came within feet of the rock when the light failed. Twenty crew swear he was on his own quarterdeck all night.",
   "answers":["On my quarterdeck bringing her in, and then on my quarterdeck bringing her about with the rock under my bowsprit. Ask my crew. Ask my ship's paint.","Nothing, until his light went out and near killed forty men. I'd have had words with him. I never got the chance.","The light went out. That is all I know and all I care to. A keeper who lets his light go out has failed at the one thing."]},
  {"id":"winn","name":"Clerk Winn","age":45,"job":"telegraphist","color":"#4b5d4a","look":"Ink on his cuffs; precise to the minute.","note":"Delivered a wire to the rock himself at 9:05, the telegraph boy being off sick. The wire was from the Board, about Jonas's application.",
   "answers":["On the rock at five past nine, off it by quarter past, at my desk by half past. My log says so, and my log is never wrong.","A customer. Four wires a year, all from the Board. I read them, of course. One reads everything.","He was alive and trimming the wick when I left him at quarter past. Whatever happened, happened after."]}
 ],
 "culprit":"jonas",
 "solution":"The Gazette printed that Voss fell from the rocks while fishing. Only the police knew he had gone from the gallery, with his pipe left on the rail. Jonas Voss described exactly that: the gallery, the rail, the pipe, before anyone had told him. He was not at the Weavers' Arms at 9:40. He was on the rock, where the wire Winn delivered at 9:05 had just told his uncle what Jonas had asked the Board to do to him.",
 "arrest":"Jonas asks who will light the lamp tonight. Nobody answers him."},

{"id":"milk","title":"Milk in the Coffee","reward":7,
 "brief":{"victim":"Mr Selim, 60, proprietor of the Turk's Head","weapon":"Laudanum, a heavy dose, in his afternoon coffee","time":"Between three and four in the afternoon, Monday","place":"His own back table at the Turk's Head, Clock Square",
  "public":"\"The coffee-house keeper died suddenly at his table.\" No mention of poison.",
  "facts":["Selim took his coffee with milk. Everyone else at the table took it black. The pot was shared; the milk jug was his alone.","Mrs Ashby's shop girl carried the milk jug across the square at three, as she did every afternoon. Ashby supplied it under the lease.","Dr Lisle's poison register shows two ounces of laudanum sold that morning to 'Mrs Ashby, for her nerves.'","Winn's telegraph log shows a wire sent by Yusuf Selim at 3:35."]},
 "questions":["Where were you between three and four?","How did you stand with Selim?","Do you take milk in your coffee?"],
 "suspects":[
  {"id":"lisle","name":"Dr Lisle","age":55,"job":"apothecary","color":"#4a4f6b","look":"Stooped, dry, spectacles pushed up.","note":"Took coffee with Selim most afternoons at three. Sells laudanum, keeps a register, and is tired of being asked about it.",
   "answers":["At Selim's table from three until a quarter past, then back to my shop. Daubeny took my chair when I left.","Friends, of a sort. I have few. He didn't mind a man who read at the table.","Black. Always. Milk spoils coffee and I said so to him weekly."]},
  {"id":"ashby","name":"Mrs Ashby","age":48,"job":"draper, Selim's landlady","color":"#6b3f3f","look":"Tall, corseted, a tape measure round her neck.","note":"Owns the Turk's Head building and wants it for a larger shop. Had tried for a year to end Selim's lease, and failed.",
   "answers":["In my shop, measuring Mrs Halloran for a mourning dress. The whole afternoon. She'll say so.","He was a tenant. A tidy one, I'll give him that. We had a disagreement about the lease and left it to the lawyers.","I never touch coffee. Nor laudanum, before you ask; I have never bought a drop of it in my life."]},
  {"id":"yusuf","name":"Yusuf Selim","age":28,"job":"the son","color":"#7a6a2e","look":"His father's eyes, a newer coat.","note":"Wanted to sell the coffee house and go to London. They had quarrelled about it in front of customers.",
   "answers":["Sending a wire to London at half past three. Winn will have it in his book. Then walking. I didn't go back in till five, and by then...","We fought. Fathers and sons. I wanted him to sell and rest, and he wanted to die at that table, and he did.","Black. Like him? No. He took milk. He was the only one who did; he said it was how his mother made it."]},
  {"id":"daubeny","name":"Daubeny","age":63,"job":"printer, chess partner","color":"#3f5560","look":"Ink under every nail; a slow talker.","note":"Played chess with Selim every afternoon from three. Left at four when Selim said he felt unwell. Prints the Gazette.",
   "answers":["At his table from three, when Lisle gave up his chair, till four. We'd got to the middle game. He said he felt heavy and I said go and lie down, and I went home.","Twenty years of chess. He was better than me and never let it show.","Black. We drank from the one pot, the two of us, and I'm still here, so it wasn't the pot."]}
 ],
 "culprit":"ashby",
 "solution":"The pot was shared and only Selim died, so the poison was in the one thing only he took: the milk, sent across the square from Mrs Ashby's shop at three. Dr Lisle's register records Mrs Ashby buying two ounces of laudanum that same morning. She told you she has never bought a drop in her life. Yusuf's wire at 3:35 puts him at the telegraph office. Daubeny drank from the same pot and lived.",
 "arrest":"Mrs Ashby asks to close the shop first. The shop stays open."},

{"id":"pier","title":"A Shot on the Pier","reward":8,
 "brief":{"victim":"Constable Jory Penhale, 29, on guard over the seized Kittiwake","weapon":"A .38 revolver, one shot. Recovered from the water at dawn, its number filed off.","time":"Half past midnight, Friday. The harbourmaster's log records the shot.","place":"The cannery pier, off Cannery Row",
  "public":"\"A constable shot on the cannery pier.\" The revolver's recovery was not printed.",
  "facts":["Under the revolver's grip, scratched into the metal: the letters S.M. Pawnbrokers mark their stock that way.","Solly Marsh's pawn ledger shows a .38 revolver sold on the 3rd to a customer entered only as 'T.'","The tide was on the flood at midnight. Anything dropped off the pier's north side drifts toward Kessler's yard, where the gun was found.","Penhale was shot from the front, at close range, by someone he had let walk right up to him."]},
 "questions":["Where were you at half past midnight?","What do you know about the revolver?","Did you see anyone on Cannery Row that night?"],
 "suspects":[
  {"id":"marsh","name":"Solly Marsh","age":58,"job":"pawnbroker","color":"#5a3f5e","look":"Small, neat, fingers that never stop counting.","note":"Fled the Docks when Grady was arrested and came back a month later swearing his innocence. Paid the Kittiwake's berth for four years.",
   "answers":["In my bed above the shop, with the door locked, as a man who has been threatened does.","I sell what's brought to me. A .38 came in, a .38 went out, to a customer who gave an initial. That's the trade. Half this town is an initial in my book.","I saw nothing. I heard the shot and put my head under the pillow, and I'd do it again."]},
  {"id":"ben","name":"Ben Oduya","age":19,"job":"fishmonger's son","color":"#4b5d4a","look":"Tall, restless, in a blue coat.","note":"Was on the pier at eleven by his own admission, waiting for a girl who did not come. Knew Penhale from school.",
   "answers":["On the pier till near midnight, then walking home along the Row. I was on Quay Street when the shot went. I ran back.","Nothing. I've never held one.","Yes. Running from the pier end toward Cannery Row, past me as I turned back. A small man in a long coat, hat down. He went into the dark by the pawnshop."]},
  {"id":"trask","name":"Constable Trask","age":38,"job":"Customs House, suspended","color":"#3f5560","look":"Tall, heavy, a moustache he is proud of.","note":"Named in Grady's confession as the customs man paid to look away. Suspended, not charged. Hated Penhale, who reported him.",
   "answers":["In the Customs House, on the cot in the back room, where I've slept since my wife found out what Grady said. I heard the shot and got there second. Oduya was first.","I've a service revolver, a .45, and it's in the Inspector's safe, where he put it when he suspended me. I never bought a .38 from Marsh or anyone. 'T.' is not me.","Nobody. The Row was empty by the time I got down it."]},
  {"id":"kessler2","name":"Ruth Kessler","age":44,"job":"boatwright","color":"#6b3f3f","look":"Forearms like hawsers; smells of pitch.","note":"Her yard is beside the pier. She found the revolver in the shallows at dawn and brought it in herself.",
   "answers":["In my yard, working late on a hull. The forge was going. I heard the shot over it, just.","I found it. Six in the morning, in a foot of water off my slip. I know what a filed number means and I brought it straight to Dace.","Nobody on the Row. But a lantern went along the pier at half past twelve, walking, not running, toward the Kittiwake."]}
 ],
 "culprit":"marsh",
 "solution":"The revolver carries a pawnbroker's mark, S.M., under the grip. Marsh's ledger says he sold it to 'T.', an initial meant to point at Trask, who is six feet tall with a moustache. Ben Oduya saw the man who ran from the pier: small, long coat, hat down, vanishing into the dark by the pawnshop. Trask is not small. Marsh is. Penhale let his killer walk right up to him, as a constable would for a harmless little pawnbroker with a complaint. Marsh had paid the Kittiwake's berth for four years, and Penhale was guarding what was still aboard her.",
 "arrest":"Marsh asks what the revolver will fetch. Nobody laughs."},

{"id":"tower","title":"A Quarter Past Six","reward":10,
 "brief":{"victim":"E. Rooke, 51, manager of the Savings Bank","weapon":"His own gold watch chain, from behind","time":"Between six and seven in the evening, Wednesday","place":"The stair inside the clock tower, Clock Square",
  "public":"\"The bank manager found dead in the clock tower.\" No cause given.",
  "facts":["Rooke had held a tower key since the ledgers business. He went up at six each evening to check the mechanism, having no faith in the Vells.","The clock struck six. The quarter-past chime never sounded: the mechanism jammed at 6:15 when the chain fouled the rope in the struggle. It has not struck since.","The mark of the chain runs upward. The killer stood on the step above and pulled. That takes height. Rooke was five feet eight.","Lucie Ferrand found the body at seven, when she came to wind."]},
 "questions":["Where were you between six and seven?","What was your business with Rooke?","Did you hear the clock?"],
 "suspects":[
  {"id":"vell","name":"Auguste Vell","age":74,"job":"clockmaker","color":"#7a6a2e","look":"Bent, small, a watchmaker's glass on a ribbon.","note":"Holds the other tower key. Resented Rooke checking 'his' mechanism nightly. Cannot climb the tower stair without stopping four times.",
   "answers":["In my shop, with my daughter, from five until Lucie came screaming across the square at seven.","He had a tower key. The bank's key. He'd go up at six and put his hands on my mechanism, and I'd hear it from the shop, the way he handled the escapement.","Six, yes. Then nothing. I said to Marguerite, he's stopped it, the fool. I meant Rooke."]},
  {"id":"lucie","name":"Lucie Ferrand","age":16,"job":"the clockmaker's granddaughter","color":"#5a3f5e","look":"Small, quick, oil on her fingers.","note":"Winds the clock at seven each evening. Found the body. Had argued with Rooke that morning about his 'interfering'.",
   "answers":["At my school books at Mama's, on Mercer Row, until I went across to wind at seven. Mama was with me. I found him on the stair.","He treated the clock like a bank vault. I told him so on Monday. He told me I was a child.","It struck six while I was reading. It didn't strike the quarter. I noticed. I notice everything about that clock."]},
  {"id":"coyle","name":"Mr Coyle","age":45,"job":"'a corn factor, from up the coast'","color":"#4a4f6b","look":"Very tall, very calm, a heavy gold Albert across his waistcoat.","note":"Arrived Monday; rooms at the Turk's Head. Nobody in the corn trade has heard of him. Had called on Rooke twice about the seized ledgers.",
   "answers":["Dining at the Turk's Head from half past five. The younger Selim served me and can say so. I was still at table at seven.","Business. I represent certain interests who had money in the ledgers Inspector Dace took. I asked Rooke whether copies existed. He said no. I believed him.","I heard it strike six from the dining room. After that I was not listening for it."]},
  {"id":"quint","name":"Jasper Quint","age":30,"job":"formerly Haldane's clerk","color":"#3f5560","look":"Tall, pale, a coat too thin for the season.","note":"Unemployed since Haldane's arrest. Rooke had refused him a loan that morning and, Quint says, laughed while he did it.",
   "answers":["The Weavers' Arms. I went in at five with my last shilling and I was still there when I heard the clock strike seven, and I went home.","He refused me a loan of four pounds and laughed. That is the whole of it. I am not proud of being poor.","Six, and seven. I told you. I heard seven strike and I got up and went home to Weavers' Court."]}
 ],
 "culprit":"quint",
 "solution":"The clock jammed at a quarter past six and has not struck since. Lucie, who notices everything about that clock, said so. Quint says he heard it strike seven and got up to go home. It did not strike seven. He was not in the Weavers' Arms listening for it; he was on the tower stair, a step above a man who had laughed at him, and he is tall enough to have pulled the chain upward. Coyle is taller still, but Yusuf Selim served him dinner through the whole hour. Old Vell cannot climb the stair. Lucie is too small to have pulled from above.",
 "arrest":"Quint asks whether the Arms will keep his tab open. It will not."}
],

<script>
(function(){
const D = JSON.parse(document.getElementById('game-data').textContent);
const C = Object.fromEntries(D.cases.map(c=>[c.id,c]));
const KEY='deadletter.v3';

const fresh=()=>({tab:'desk', money:0, solved:{}, asked:{}, caseId:D.cases[0].id, owned:[], hand:'caveat', notebook:'', intro:true, tut:0, music:false, track:0});
let S=load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.caseId && C[s.caseId]) return s; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $=s=>document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const cur=()=>C[S.caseId];
const idx=id=>D.cases.findIndex(c=>c.id===id);
function unlocked(id){ const i=idx(id); return i===0 || !!S.solved[D.cases[i-1].id]; }
function askedFor(cid){ return S.asked[cid] || (S.asked[cid]={}); }
function nAsked(cid){ return Object.values(askedFor(cid)).reduce((a,l)=>a+l.length,0); }
function nextCase(){ const i=idx(S.caseId); return D.cases[i+1]||null; }
function handOf(){ return D.hands.find(x=>x.id===S.hand)||D.hands[0]; }

/* ---------- Tutorial ---------- */
const TUT=[
 {t:"A case file. Read it twice. Note what the Gazette printed, and what it didn't. Then tap a suspect.", done:s=>!!s.tutOpened},
 {t:"Three questions each. Ask them all; you're not charged by the word. Everything they say is copied into your <b>Notebook</b>.", done:s=>nAsked(s.caseId)>=3||!!s.solved[D.cases[0].id]},
 {t:"Now compare what they say with what you know. One of them will say something they couldn't know, or couldn't have done.", done:s=>nAsked(s.caseId)>=8||!!s.solved[D.cases[0].id]},
 {t:"When you're sure, accuse from the suspect's page. A wrong arrest closes the case with no pay, so be sure. A right one pays, and pay buys things in the <b>Shop</b>.", done:s=>!!s.solved[D.cases[0].id]},
 {t:"That's the job. Cases pile up on the <b>Cases</b> board. Solve one in eight questions or fewer and the Inspector adds a pound for quick work.", done:s=>!!s.tutAck, ack:true}
];
function advanceTut(){ if(S.tut===null||S.tut===undefined) return; while(S.tut<TUT.length && TUT[S.tut].done(S)) S.tut++; if(S.tut>=TUT.length) S.tut=null; }
function coachHTML(){ if(S.intro||S.tut===null||S.tut===undefined) return ''; const st=TUT[S.tut]; if(!st) return ''; return `<div class="coach"><small>The Inspector</small><p>${st.t}</p><div class="row">${st.ack?'<button class="ok" data-act="ack">Understood</button>':''}<button data-act="skiptut">Skip the lesson</button></div></div>`; }

/* ---------- Decor art ---------- */
const ART={
 pipe:`<svg viewBox="0 0 64 40"><path d="M6 12 q26 -6 40 4" fill="none" stroke="#b8925a" stroke-width="3" stroke-linecap="round"/><path d="M42 12 h14 v14 q0 8 -8 8 h-4 q-8 0 -8 -8 z" fill="#3a2a1e" stroke="#b8925a" stroke-width="2"/></svg>`,
 photo:`<svg viewBox="0 0 48 56"><rect x="4" y="4" width="40" height="48" fill="#b8925a"/><rect x="9" y="9" width="30" height="38" fill="#efe6d2"/><ellipse cx="24" cy="26" rx="8" ry="10" fill="#6f675a"/><path d="M8 47 q16 -14 32 0" fill="#4a5561"/></svg>`,
 fern:`<svg viewBox="0 0 56 64"><path d="M14 40 h28 l-4 20 h-20 z" fill="#7a3b2a" stroke="#b8925a" stroke-width="1.5"/><path d="M28 40 q-2 -18 -18 -26 M28 40 q2 -20 18 -30 M28 40 q0 -22 0 -36 M28 40 q-8 -12 -20 -8 M28 40 q8 -14 22 -10" fill="none" stroke="#5f8a5a" stroke-width="3" stroke-linecap="round"/></svg>`,
 lamp:`<svg viewBox="0 0 64 64"><ellipse cx="32" cy="58" rx="16" ry="4" fill="#b8925a"/><rect x="30" y="30" width="4" height="28" fill="#b8925a"/><path d="M8 30 q24 -18 48 0 z" fill="#3b6b3f" stroke="#b8925a" stroke-width="1.5"/><ellipse cx="32" cy="34" rx="18" ry="5" fill="#e8c15a" opacity=".8"/></svg>`,
 decanter:`<svg viewBox="0 0 64 64"><path d="M22 60 h20 q6 0 6 -6 v-14 q0 -10 -10 -14 v-14 h-12 v14 q-10 4 -10 14 v14 q0 6 6 6z" fill="#efe6d2" opacity=".9" stroke="#b8925a" stroke-width="1.5"/><rect x="26" y="8" width="12" height="6" fill="#b8925a"/><path d="M20 44 q12 4 24 0 v10 q0 6 -6 6 h-12 q-6 0 -6 -6z" fill="#8a3a2a" opacity=".8"/><path d="M52 60 h10 v-14 h-10z" fill="#efe6d2" opacity=".9" stroke="#b8925a" stroke-width="1.2"/><path d="M53 52 h8 v8 h-8z" fill="#8a3a2a" opacity=".8"/></svg>`,

 cat:`<svg viewBox="0 0 72 48"><ellipse cx="40" cy="36" rx="28" ry="12" fill="#2a2320"/><circle cx="18" cy="26" r="12" fill="#2a2320"/><path d="M8 20 l2 -12 l8 8z M28 20 l-2 -12 l-8 8z" fill="#2a2320"/><circle cx="14" cy="26" r="1.6" fill="#e8c15a"/><circle cx="22" cy="26" r="1.6" fill="#e8c15a"/><path d="M66 36 q8 -14 -2 -20" fill="none" stroke="#2a2320" stroke-width="5" stroke-linecap="round"/></svg>`,
 typewriter:`<svg viewBox="0 0 80 56"><rect x="24" y="2" width="32" height="20" fill="#efe6d2" stroke="#b8925a" stroke-width="1"/><rect x="8" y="22" width="64" height="26" rx="4" fill="#2a2320" stroke="#b8925a" stroke-width="1.5"/><rect x="4" y="46" width="72" height="8" rx="2" fill="#3a2a1e" stroke="#b8925a" stroke-width="1"/>${[0,1,2,3,4,5,6].map(i=>`<circle cx="${18+i*7.5}" cy="32" r="2" fill="#b8925a"/><circle cx="${22+i*7.5}" cy="39" r="2" fill="#b8925a"/>`).join('')}</svg>`
};

/* ---------- Render ---------- */
function render(){
  advanceTut();
  $('#hMoney').textContent='£'+S.money; $('#hSolved').textContent=Object.values(S.solved).filter(v=>v.correct).length;
  document.querySelectorAll('nav.tabs button').forEach(b=>{ b.classList.toggle('on', b.dataset.tab===S.tab); b.classList.toggle('pulse', S.tut===4 && b.dataset.tab==='cases' && S.tab!=='cases'); });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+S.tab));
  const h=handOf(); const r=document.documentElement.style; r.setProperty('--nbfont',h.font); r.setProperty('--nbsize',h.size); r.setProperty('--nbline',h.line);
  renderDesk(); renderCases(); renderNotebook(); renderShop(); save();
}
function shelfHTML(){
  const items=D.decor.filter(d=>S.owned.includes(d.id));
  return `<div class="shelf" aria-label="Your desk">${items.length?`<div class="items">${items.map(d=>`<span title="${esc(d.name)}">${ART[d.id]}</span>`).join('')}</div>`:`<div class="hint">A bare desk. Pay buys furniture.</div>`}</div>`;
}
function fileHTML(c, v){
  const b=c.brief;
  return `<article class="paper file">${v?`<div class="stamp${v.correct?'':' cold'}">${v.correct?'Closed<br>Arrest':'Cold<br>Case'}</div>`:''}
   <div class="no">Case No. ${idx(c.id)+1} · Saltmarsh Constabulary</div><h2>${esc(c.title)}</h2>
   <dl><dt>Victim</dt><dd>${esc(b.victim)}</dd><dt>Weapon</dt><dd>${esc(b.weapon)}</dd><dt>When</dt><dd>${esc(b.time)}</dd><dt>Where</dt><dd>${esc(b.place)}</dd></dl>
   <div class="sec">What the Gazette printed</div><p class="gaz">${esc(b.public)}</p>
   <div class="sec">Known to the police only</div><ul>${b.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></article>`;
}
function initials(n){ return n.split(' ').map(w=>w[0]).filter(ch=>/[A-Z]/.test(ch)).slice(0,2).join(''); }
function renderDesk(){
  const el=$('#p-desk'); let h='';
  if(S.intro){ h+=`<div class="card-note"><h2>Same desk, worse post</h2><p>After the Kittiwake business the town made its dead-letter clerk a detective. The cases come in a folder now.</p><p>Read the file. Question the suspects. Name the one who did it. A right arrest pays, and pay buys a better desk.</p><div class="row"><button class="btn" data-act="intro">Open the first file</button></div></div>`; el.innerHTML=h; return; }
  const c=cur(); const v=S.solved[c.id]; const asked=askedFor(c.id);
  h+=shelfHTML()+coachHTML();
  h+=fileHTML(c,v);
  h+=`<div class="eyebrow">${v?'The suspects, as they were':'Suspects'}</div><div class="suspects">`+c.suspects.map(s=>{
    const n=(asked[s.id]||[]).length; const cls=['sus', v&&v.guess===s.id&&!v.correct?'guessed':'', v&&s.id===c.culprit?'culprit':''].join(' ');
    return `<button class="${cls}" data-act="suspect" data-id="${s.id}"><span class="asked">${v?(s.id===c.culprit?'GUILTY':(v.guess===s.id?'RELEASED':'')):(n?n+'/3':'')}</span><span class="med" style="background:${s.color}">${esc(initials(s.name))}</span><b>${esc(s.name)}</b><i>${s.age} · ${esc(s.job)}</i><p><em>${esc(s.look)}</em></p><p>${esc(s.note)}</p></button>`; }).join('')+`</div>`;
  if(v){
    const g=c.suspects.find(s=>s.id===c.culprit); const gs=c.suspects.find(s=>s.id===v.guess);
    h+=`<div class="card-note"><h2>${v.correct?'Arrested: '+esc(g.name):'Released: '+esc(gs.name)}</h2><p>${esc(c.solution)}</p><p><em>${esc(c.arrest)}</em></p>${v.correct?`<p>Paid £${v.pay}${v.bonus?', including £1 for quick work':''}.</p>`:'<p>No pay. The file goes in the cold drawer.</p>'}<div class="row">${nextCase()?`<button class="btn" data-act="opencase" data-id="${nextCase().id}">Next case</button>`:''}<button class="btn ghost" data-act="tab" data-tab="cases">The case board</button></div></div>`;
  } else {
    h+=`<p class="hintline">Tap a suspect to question them. Accuse from their page when you're sure. Questions asked so far: ${nAsked(c.id)}.</p>`;
  }
  h+=musicBar();
  h+=`<p class="foot">Six cases so far. <button data-act="reset">Start over</button></p>`;
  el.innerHTML=h; updateMusicUI();
}
function openSuspect(sid){
  const c=cur(); const s=c.suspects.find(x=>x.id===sid); if(!s) return; const v=S.solved[c.id]; const asked=askedFor(c.id); asked[s.id]=asked[s.id]||[];
  S.tutOpened=true;
  let h=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>${esc(s.name)}</h3><p class="sub">${s.age} · ${esc(s.job)}</p><p><em>${esc(s.look)}</em> ${esc(s.note)}</p><div class="qs">`;
  c.questions.forEach((q,i)=>{
    const done=asked[s.id].includes(i);
    if(done||v) h+=`<div class="q"><small>You asked</small>${esc(q)}</div><p class="a">${esc(s.answers[i])}</p>`;
    else h+=`<button class="q" data-act="ask" data-id="${s.id}" data-q="${i}"><small>Ask</small>${esc(q)}</button>`;
  });
  h+=`</div>`;
  if(!v) h+=`<div class="row"><button class="btn danger" data-act="accuse" data-id="${s.id}">Accuse ${esc(s.name.split(' ').slice(-1)[0])}</button><button class="btn ghost" data-act="closesheet">Back to the desk</button></div>`;
  else h+=`<div class="row"><button class="btn ghost" data-act="closesheet">Back to the desk</button></div>`;
  const sh=$('#sheet'); const top=sh.scrollTop; sh.innerHTML=h; sh.classList.add('open'); $('#scrim').classList.add('on'); sh.scrollTop=top; save(); render();
}
function confirmAccuse(sid){
  const c=cur(); const s=c.suspects.find(x=>x.id===sid);
  $('#sheet').innerHTML=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Arrest ${esc(s.name)}?</h3><p class="sub">for the murder of ${esc(c.brief.victim.split(',')[0])}</p><p>The Inspector will sign the warrant on your word. If the magistrate lets them go, the case goes cold and you are not paid.</p><div class="row"><button class="btn danger" data-act="arrest" data-id="${sid}">Sign the warrant</button><button class="btn ghost" data-act="suspect" data-id="${sid}">Not yet</button></div>`;
  $('#sheet').scrollTop=0;
}
function arrest(sid){
  const c=cur(); if(S.solved[c.id]) return; const s=c.suspects.find(x=>x.id===sid); const correct=sid===c.culprit; const n=nAsked(c.id); const bonus=correct && n<=8;
  const pay=correct?c.reward+(bonus?1:0):0; S.money+=pay;
  S.solved[c.id]={guess:sid, correct, pay, bonus, asked:n};
  const g=c.suspects.find(x=>x.id===c.culprit);
  $('#sheet').innerHTML=`<button class="close" data-act="closesheet" aria-label="Close">×</button>
   <p class="verdict${correct?'':' cold'}">${correct?'Arrested.':'Released.'}</p>
   ${correct?`<p class="pay">+ £${pay}${bonus?' <small style="font-size:14px;color:#6f675a">incl. £1 for quick work</small>':''}</p>`:`<p class="sub">The magistrate finds nothing to hold ${esc(s.name)} on. ${esc(g.name)} leaves on the morning coach.</p>`}
   <p>${esc(c.solution)}</p><p><em>${esc(c.arrest)}</em></p>
   <div class="row">${nextCase()?`<button class="btn" data-act="opencase" data-id="${nextCase().id}">Next case</button>`:''}<button class="btn ghost" data-act="closesheet">Back to the desk</button></div>`;
  $('#sheet').scrollTop=0;
  toast(correct?'Arrested. £'+pay+' to the purse.':'Released. No pay.'); render();
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#scrim').classList.remove('on'); }
function renderCases(){
  const el=$('#p-cases');
  let h=coachHTML()+`<div class="eyebrow">The case board</div><div class="caselist">`+D.cases.map((c,i)=>{
    const v=S.solved[c.id]; const un=unlocked(c.id);
    const st=v?(v.correct?`<span class="st ok">Solved · £${v.pay}</span>`:'<span class="st cold">Cold</span>'):(un?'<span class="st open">Open</span>':'<span class="st cold">Locked</span>');
    return `<button class="casebtn${un?'':' locked'}${c.id===S.caseId?' cur':''}" data-act="opencase" data-id="${c.id}" ${un?'':'disabled'}><span class="n">${String(i+1).padStart(2,'0')}</span><span><b>${esc(c.title)}</b><i>${esc(c.brief.place)}</i></span>${st}</button>`; }).join('')+`</div>`;
  const earned=Object.values(S.solved).reduce((a,v)=>a+(v.pay||0),0);
  h+=`<p class="hintline" style="margin-top:14px">Earned so far: £${earned}. Cases open in order. A cold case stays cold.</p>`;
  el.innerHTML=h;
}
function renderNotebook(){
  const el=$('#p-notebook'); const c=cur(); const asked=askedFor(c.id);
  let h=coachHTML()+`<div class="eyebrow">Your notebook <span style="color:var(--brass-dim)">· ${esc(handOf().name)}</span></div>`;
  h+=`<textarea class="nb" id="nb" placeholder="Who was where. Who said what they shouldn't know.">${esc(S.notebook)}</textarea>`;
  const rows=c.suspects.filter(s=>(asked[s.id]||[]).length);
  h+=`<div class="eyebrow" style="margin-top:22px">Statements · ${esc(c.title)}</div>`;
  h+= rows.length ? rows.map(s=>`<div class="stm"><b>${esc(s.name)}</b>${(asked[s.id]||[]).slice().sort().map(i=>`<div><span>${esc(c.questions[i])}</span><br>${esc(s.answers[i])}</div>`).join('')}</div>`).join('') : `<p class="hintline">Nothing yet. Every answer you hear is copied here.</p>`;
  el.innerHTML=h;
}
function renderShop(){
  const el=$('#p-shop');
  let h=coachHTML()+`<p class="money">£${S.money}<small>in the purse</small></p>`;
  h+=`<div class="eyebrow">For the desk</div><div class="goods">`+D.decor.map(d=>{ const own=S.owned.includes(d.id); const can=S.money>=d.price;
    return `<div class="good">${ART[d.id]}<b>${esc(d.name)}</b><i>${esc(d.desc)}</i>${own?'<button class="buy owned" disabled>On the desk</button>':`<button class="buy" data-act="buy" data-id="${d.id}" ${can?'':'disabled'}>Buy · £${d.price}</button>`}</div>`; }).join('')+`</div>`;
  h+=`<div class="eyebrow">Hands for your notebook</div><div class="hands">`+D.hands.map(x=>{ const own=x.price===0||S.owned.includes('hand:'+x.id); const inuse=S.hand===x.id; const can=S.money>=x.price;
    const btn = inuse?'<button class="buy inuse" disabled>In use</button>':own?`<button class="buy use" data-act="usehand" data-id="${x.id}">Use</button>`:`<button class="buy" data-act="buyhand" data-id="${x.id}" ${can?'':'disabled'}>£${x.price}</button>`;
    return `<div class="handrow"><div class="prev" style="font-family:${x.font};font-size:${x.prev}">Rooney knew about the mallet.<small>${esc(x.name)}</small></div>${btn}</div>`; }).join('')+`</div>`;
  h+=`<p class="hintline" style="margin-top:14px">Decor sits on the shelf above your desk. A hand changes how your notebook is written.</p>`;
  el.innerHTML=h;
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- Music ---------- */
const TRACKS=[['Theme I','audio/theme-1.m4a'],['Theme II','audio/theme-2.m4a'],['Theme III','audio/theme-3.m4a'],['Theme IV','audio/theme-4.m4a'],['Theme V','audio/theme-5.m4a']];
const audio=new Audio(); audio.volume=.8; audio.preload='none';
let musicWanted = S.music===true;
function updateMusicUI(){
  const playing=!audio.paused && !audio.ended && audio.src;
  const b=$('#musicBtn'); b.classList.toggle('on', !!playing); b.title = playing ? 'Music: '+TRACKS[S.track||0][0]+' (tap to pause)' : 'Music off (tap to play)';
  document.querySelectorAll('.musicbar b').forEach(x=>x.textContent = playing ? TRACKS[S.track||0][0] : 'off');
  document.querySelectorAll('.musicbar [data-act="music"]').forEach(x=>x.textContent = playing ? 'Pause' : 'Play');
}
function playTrack(i){ S.track=((i%TRACKS.length)+TRACKS.length)%TRACKS.length; audio.src=TRACKS[S.track][1]; audio.play().then(()=>{ S.music=true; musicWanted=true; save(); updateMusicUI(); }).catch(()=>updateMusicUI()); }
audio.addEventListener('ended',()=>playTrack((S.track||0)+1)); audio.addEventListener('pause',updateMusicUI); audio.addEventListener('play',updateMusicUI);
function toggleMusic(){ if(!audio.paused && audio.src){ audio.pause(); S.music=false; musicWanted=false; save(); } else playTrack(S.track||0); }
function musicBar(){ return `<div class="musicbar"><span>Music · <b>off</b></span><div class="row"><button data-act="music">Play</button><button data-act="nexttrack">Next track</button></div></div>`; }

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(musicWanted && !S.intro && !audio.src && !e.target.closest('[data-act="music"]')) playTrack(S.track||0);
  const tab=e.target.closest('nav.tabs button'); if(tab){ S.tab=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(e.target.id==='scrim'){ closeSheet(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(act==='intro'){ S.intro=false; render(); }
  else if(act==='tab'){ S.tab=a.dataset.tab; render(); window.scrollTo(0,0); }
  else if(act==='suspect'){ openSuspect(a.dataset.id); }
  else if(act==='ask'){ const l=askedFor(S.caseId); l[a.dataset.id]=l[a.dataset.id]||[]; if(!l[a.dataset.id].includes(+a.dataset.q)) l[a.dataset.id].push(+a.dataset.q); openSuspect(a.dataset.id); }
  else if(act==='accuse'){ confirmAccuse(a.dataset.id); }
  else if(act==='arrest'){ arrest(a.dataset.id); }
  else if(act==='closesheet'){ closeSheet(); }
  else if(act==='opencase'){ if(unlocked(a.dataset.id)){ S.caseId=a.dataset.id; S.tab='desk'; closeSheet(); render(); window.scrollTo(0,0); } }
  else if(act==='buy'){ const d=D.decor.find(x=>x.id===a.dataset.id); if(d && S.money>=d.price && !S.owned.includes(d.id)){ S.money-=d.price; S.owned.push(d.id); toast(d.name+' bought.'); render(); } }
  else if(act==='buyhand'){ const x=D.hands.find(y=>y.id===a.dataset.id); if(x && S.money>=x.price && !S.owned.includes('hand:'+x.id)){ S.money-=x.price; S.owned.push('hand:'+x.id); S.hand=x.id; toast(x.name+' bought and in use.'); render(); } }
  else if(act==='usehand'){ S.hand=a.dataset.id; render(); }
  else if(act==='music'){ toggleMusic(); }
  else if(act==='nexttrack'){ playTrack((S.track||0)+1); }
  else if(act==='ack'){ S.tutAck=true; render(); }
  else if(act==='skiptut'){ S.tut=null; render(); }
  else if(act==='reset'){ if(confirm('Start over from the first case? Purse, desk and notebook go too.')){ S=fresh(); render(); } }
});
document.addEventListener('input',e=>{ if(e.target.id==='nb'){ S.notebook=e.target.value; save(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
render();
})();
</script>
