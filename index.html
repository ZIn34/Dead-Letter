<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Letter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=Caveat:wght@400;600&family=Schoolbell&display=swap">
<style>
:root{
  --ground:#1b2320; --desk:#243129; --desk-edge:#2f4035; --brass:#b8925a; --brass-dim:#7d6640;
  --paper:#efe6d2; --paper-deep:#e3d7bc; --paper-shadow:#c9bb9c; --ink:#232f3b; --ink-soft:#4a5561;
  --pencil:#6f675a; --red:#b0392e; --red-soft:rgba(176,57,46,.16); --lamp:#e8c15a; --lamp-soft:rgba(232,193,90,.22);
  --map:#e9dfc6; --map-ink:#3a3a33; --water:#8ea3a1;
  --sans: "Crimson Pro", Georgia, "Times New Roman", serif;
  --fell: "IM Fell English", "Crimson Pro", Georgia, serif;
  --typed: "Special Elite", "Courier New", Courier, monospace;
  --hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --child: "Schoolbell", "Comic Sans MS", cursive;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip;background:
  radial-gradient(120% 60% at 50% -10%, rgba(232,193,90,.20), transparent 60%), var(--desk);
  box-shadow:0 0 0 1px var(--desk-edge)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px 10px;border-bottom:1px solid var(--brass-dim)}
header h1{font:400 22px/1 var(--fell);margin:0;letter-spacing:.02em;color:var(--brass)}
header h1 small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-dim);margin-top:5px;font-family:var(--sans)}
.ledger{display:flex;gap:12px;flex:none;font-variant-numeric:tabular-nums;font-size:14px;color:var(--brass)}
.ledger b{display:block;font:400 20px/1 var(--fell);color:var(--paper)}
.ledger span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim)}
.music{width:34px;height:34px;border-radius:50%;border:1px solid var(--brass-dim);color:var(--brass-dim);font:400 18px/32px var(--fell);text-align:center;align-self:center}
.music.on{color:#1b1b17;background:var(--brass);border-color:#d8b478}
.musicbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 0;padding:10px 12px;border:1px solid var(--brass-dim);color:var(--brass);font-size:14px}
.musicbar b{font:400 15px var(--fell);color:var(--paper)}
.musicbar .row{gap:14px}
.musicbar .row button{font:400 12px var(--fell);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
main{flex:1;min-height:0;position:relative}
.panel{display:none;padding:16px 16px 110px;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:.6}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:380px){header h1{font-size:20px} .ledger{gap:9px} .ledger b{font-size:18px} .music{width:30px;height:30px;line-height:28px;font-size:16px} .panel{padding-left:12px;padding-right:12px} .paper{padding:22px 16px 20px}}

/* Coach */
.coach{background:rgba(232,193,90,.10);border:1px solid var(--brass);border-left:4px solid var(--lamp);padding:12px 14px;margin:0 0 14px;color:var(--paper)}
.coach p{margin:0 0 8px;font-size:16px}
.coach .row{gap:14px;align-items:center}
.coach .row button{font:400 13px var(--fell);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.coach .row button.ok{color:#1b1b17;background:var(--brass);padding:6px 12px}
.coach small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}

/* Desk */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:6px 0 10px}
.tray{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.env{display:flex;align-items:center;gap:12px;background:var(--paper-deep);color:var(--ink);padding:12px 14px;border:1px solid var(--paper-shadow);text-align:left;width:100%;position:relative;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.env:nth-child(2n){transform:rotate(.6deg)}
.env:nth-child(2n+1){transform:rotate(-.4deg)}
.env .to{font-size:16px;line-height:1.25}
.env .to i{display:block;font-style:normal;font-size:12px;color:var(--pencil);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.env .stampbox{margin-left:auto;width:34px;height:40px;border:1px dashed var(--pencil);flex:none;display:grid;place-items:center;font:11px var(--fell);color:var(--pencil)}
.env.reply{background:#f4ecd9}
.env.reply .stampbox{border-style:solid;border-color:var(--red);color:var(--red)}
.env.unread::after{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.env.pulse{box-shadow:2px 3px 0 rgba(0,0,0,.25),0 0 0 2px var(--lamp)}
.empty{color:var(--brass-dim);font-style:italic;padding:8px 2px}

.paper{overflow-wrap:anywhere;background:var(--paper);color:var(--ink);padding:26px 22px 22px;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.35), 0 1px 0 var(--paper-shadow) inset;margin-bottom:14px}
.paper::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),transparent 30%,rgba(0,0,0,.03));pointer-events:none}
.paper .addr{font-size:19px;line-height:1.35;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--paper-shadow);white-space:pre-line}
.paper .body{font-size:19px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
.paper .sign{text-align:right;font-size:19px;margin:0}
.paper.typed .addr,.paper.typed .body,.paper.typed .sign{font-family:var(--typed);font-size:15px;line-height:1.55}
.paper.hand .addr,.paper.hand .body,.paper.hand .sign{font-family:var(--hand);font-size:23px;line-height:1.35}
.paper.child .addr,.paper.child .body,.paper.child .sign{font-family:var(--child);font-size:19px;line-height:1.5}
.paper.caps .addr,.paper.caps .body,.paper.caps .sign{font-family:var(--fell);letter-spacing:.08em;font-size:17px;line-height:1.6}
.paper .meta{position:absolute;top:8px;right:12px;font:italic 12px var(--fell);color:var(--pencil)}
.w{cursor:pointer;border-radius:2px;padding:0 1px;transition:background .12s}
.w:hover{background:rgba(0,0,0,.05)}
.w.pin{background:var(--red-soft);text-decoration:underline wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:3px}
.w.faded{filter:blur(3px);opacity:.55;user-select:none;cursor:not-allowed}
.w.clear{background:var(--lamp-soft);box-shadow:0 0 0 2px var(--lamp-soft);border-radius:3px}
.w.clear.pin{background:var(--red-soft)}
.stamp{position:absolute;right:14px;bottom:14px;transform:rotate(-12deg);border:2px solid var(--red);color:var(--red);font:400 13px/1.15 var(--fell);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;text-align:center;opacity:.85;border-radius:3px;mix-blend-mode:multiply}
.hintline{font-style:italic;color:var(--brass);font-size:15px;margin:0 0 10px}
.leads{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.lead{background:var(--paper);color:var(--ink);font-size:14px;padding:5px 10px;border-left:3px solid var(--red);box-shadow:1px 2px 0 rgba(0,0,0,.25)}
.lead small{color:var(--pencil);margin-left:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--brass);color:#1b1b17;font:400 15px var(--fell);letter-spacing:.06em;padding:11px 16px;border:1px solid #d8b478;box-shadow:0 2px 0 var(--brass-dim);text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--brass);border-color:var(--brass-dim);box-shadow:none}
.btn.on{background:var(--lamp);border-color:#f0d27a}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card-note{background:rgba(0,0,0,.18);border:1px solid var(--brass-dim);padding:14px 16px;margin:0 0 16px;color:var(--paper)}
.card-note h2{font:400 20px var(--fell);margin:0 0 6px;color:var(--brass)}
.card-note p{margin:0 0 8px;font-size:16px}
.card-note p:last-child{margin:0}
.card-note .row{margin-top:10px}

/* Map */
.mapwrap{background:var(--map);padding:6px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
svg.map{width:100%;height:auto;display:block;font-family:var(--fell)}
.bld rect{fill:#f2ead6;stroke:var(--map-ink);stroke-width:1.1;transition:fill .2s}
.bld text{fill:var(--map-ink);font-size:8px;pointer-events:none}
.bld .num{font-size:7px;fill:#6a6a60}
.bld.lit rect{fill:#f6df9c;stroke:#8a6a1f}
.bld.hot rect{fill:var(--lamp);stroke:#6a4c10;stroke-width:1.6}
.bld.done rect{fill:#d9d1bb}
.bld.sel rect{stroke:var(--red);stroke-width:2}
.street{font-size:10px;fill:#5a5a50;letter-spacing:.14em;text-transform:uppercase}
.street.circled{fill:var(--red)}
.hintring{fill:none;stroke:var(--red);stroke-width:1.6;stroke-dasharray:3 2}
.water{fill:var(--water)}
.wave{fill:none;stroke:#6e8583;stroke-width:.8}
.mapkey{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 0;font-size:14px;color:var(--brass)}
.mapkey i{display:inline-block;width:12px;height:12px;background:var(--lamp);border:1px solid #6a4c10;vertical-align:-1px;margin-right:6px}

/* Sheet */
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:480px;background:var(--paper);color:var(--ink);padding:18px 18px 22px;box-shadow:0 -10px 30px rgba(0,0,0,.45);transition:transform .25s ease;z-index:20;max-height:75dvh;overflow:auto}
#sheet.open{transform:translate(-50%,0)}
#sheet h3{font:400 22px var(--fell);margin:0 0 2px}
#sheet .sub{color:var(--pencil);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
#sheet p{margin:0 0 10px;font-size:16px}
#sheet .bounce{font-family:var(--hand);font-size:22px;color:var(--red);line-height:1.25;margin:8px 0 12px}
#sheet .close{position:absolute;top:10px;right:14px;font:20px var(--fell);color:var(--pencil)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
.scrim.on{display:block}
textarea.nb{width:100%;min-height:220px;resize:vertical;border:0;border-top:1px solid var(--paper-shadow);padding:10px 4px;font:400 21px/28px var(--hand);color:#2f2a22;background:
  repeating-linear-gradient(transparent 0 27px, var(--paper-shadow) 27px 28px) 0 9px/100% 28px, #f6efdc}
.fab{position:fixed;right:max(14px, calc(50% - 226px));bottom:72px;width:48px;height:48px;border-radius:50%;background:var(--brass);color:#1b1b17;font:24px/48px var(--fell);text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:12;border:1px solid #d8b478}
.fab.pulse{box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 3px var(--lamp)}

/* Files */
.subtabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--brass-dim)}
.subtabs button{flex:1;padding:8px 4px;font:400 15px var(--fell);color:var(--brass-dim);letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.dir{background:var(--paper);color:var(--ink);padding:14px 16px;font-size:16px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.dir h4{font:400 13px var(--fell);letter-spacing:.2em;text-transform:uppercase;color:var(--pencil);margin:0 0 10px;text-align:center}
.dir .e{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--paper-shadow)}
.dir .e:last-child{border:0}
.dir .e span:last-child{color:var(--ink-soft);text-align:right;white-space:nowrap}
.dir .e.pencil{font-family:var(--hand);font-size:19px;color:#4a4238}
.census{display:flex;flex-direction:column;gap:12px}
.ccard{background:#f6efdc;color:var(--ink);padding:12px 14px;font-family:var(--typed);font-size:13.5px;line-height:1.5;border:1px solid var(--paper-shadow);box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.ccard b{display:block;font-size:14px;margin-bottom:2px}
.arch{display:flex;flex-direction:column;gap:10px}

/* Notes */
.board{display:flex;flex-direction:column;gap:10px}
.fact{background:var(--paper);color:var(--ink);padding:10px 12px;font-size:15.5px;box-shadow:1px 2px 0 rgba(0,0,0,.25);border-left:3px solid var(--brass)}
.fact small{display:block;color:var(--pencil);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.fact.who{transform:rotate(-.5deg)}
.nbview{background:#f6efdc;color:#2f2a22;padding:12px 14px;font:400 20px/28px var(--hand);white-space:pre-wrap;box-shadow:0 10px 24px rgba(0,0,0,.35);margin-bottom:10px;min-height:60px}
.nbview.empty-nb{color:var(--pencil);font-style:italic;font-family:var(--sans);font-size:15px;line-height:1.4}

/* Tabs */
nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:#141a17;border-top:1px solid var(--brass-dim);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{padding:12px 4px 10px;font:400 14px var(--fell);letter-spacing:.1em;text-transform:uppercase;color:var(--brass-dim);position:relative}
nav.tabs button.on{color:var(--lamp)}
nav.tabs button .dot{position:absolute;top:8px;right:22%;width:7px;height:7px;border-radius:50%;background:var(--red)}
nav.tabs button.pulse{color:var(--lamp);text-shadow:0 0 8px var(--lamp)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--paper);color:var(--ink);padding:10px 16px;font:400 16px var(--fell);box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .3s;z-index:30;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.foot{margin-top:24px;font-size:13px;color:var(--brass-dim);text-align:center}
.foot button{text-decoration:underline;color:var(--brass-dim)}
</style>

<div id="app">
  <header>
    <h1>Dead Letter<small id="hDistrict">Saltmarsh · The Docks</small></h1>
    <div class="ledger">
      <div><b id="hDay">1</b><span>Night</span></div>
      <div><b id="hStamps">0</b><span>Stamped</span></div>
      <div><b id="hWrong">0</b><span>Bounced</span></div>
      <button class="music" id="musicBtn" data-act="music" aria-label="Music on or off" title="Music">♪</button>
    </div>
  </header>
  <main>
    <section class="panel on" id="p-desk"></section>
    <section class="panel" id="p-map"></section>
    <section class="panel" id="p-files"></section>
    <section class="panel" id="p-notes"></section>
  </main>
  <button class="fab" id="fab" data-act="notebook" aria-label="Open your notebook" title="Notebook">✎</button>
  <nav class="tabs">
    <button data-tab="desk" class="on">Desk</button>
    <button data-tab="map">Map</button>
    <button data-tab="files">Files</button>
    <button data-tab="notes">Notes</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>

"letters":[
 {"id":"reyes","style":"typed","tag":"Typed, a shipping firm's letterhead","to":"Mr T. Reyes,\nThe Harbour,\nSaltmarsh.","body":"Sir, — The barque Halcyon will make Saltmarsh on or about the 12th with timber for the cannery. Kindly hold a berth of not less than ninety feet. Our agent will settle the fees on arrival, as before.","from":"J. Pryce, for Corrigan & Pryce, Shipping.",
  "clues":[{"p":"Reyes","t":["q1"],"why":"in the directory"},{"p":"Harbour","t":["q1","q9"],"why":"waterfront offices"},{"p":"berth","t":["q1"],"why":"harbourmaster's business"}],
  "answer":"q1",
  "reply":{"from":"T. Reyes, Harbourmaster","style":"typed","body":"Clerk — Received, with thanks. Pryce's people are always sloppy with a direction. Berth held.\n\nWhile I have your ear. Someone has paid the mooring on berth 14 every quarter for four years, in coin, through the pawnbroker. Berth 14 was the Kittiwake's, and the Kittiwake is on the bottom of the bay. A drowned boat wants no berth. If a letter about it ever crosses your desk, I should like to know.","facts":[{"who":"Berth 14","f":"The Kittiwake's old berth is still paid for, quarterly, in coin, through Solly Marsh the pawnbroker."}]}},
 {"id":"bakery","style":"hand","tag":"Pencil, a man's hand","to":"Ines,\nat the bakery,\nSaltmarsh.","body":"Ines — I know you said not to write. The rent here is gone up again and the work at the yards has dried up. I am not asking. I am only saying. Mother would have wanted you to know how things stand.\n\nTell no one at the cannery I wrote.","from":"Your brother, Piet.",
  "clues":[{"p":"bakery","t":["r2"],"why":"one on the map"},{"p":"Ines","t":["r2"],"why":"I. Hallam, in the directory"},{"p":"cannery","t":["c2","c4"],"why":"Cannery Row"}],
  "answer":"r2",
  "reply":{"from":"I. Hallam, 2 Rope Walk","style":"hand","body":"To the clerk — Thank you for bringing Piet's letter, though I could have done without it. I am at the ovens from four every morning and the whole of Rope Walk knows it by the smell, so I suppose there is no hiding from anyone.\n\nIf more come from him, bring them to the side door, not the shop.","facts":[{"who":"Ines Hallam","f":"Bakes from four in the morning. Rope Walk smells of bread before dawn."}]}},
 {"id":"priest","style":"hand","tag":"Ink, an elderly hand, posted inland","to":"The Priest,\nSaltmarsh, by the sea.","body":"Father — My daughter Josephine has not answered me since Michaelmas. She was married to a fisherman there who was lost, and I fear she has taken it worse this year than the last. Would you look in on her? I do not know her street, only that she keeps a blue door and will not paint it.","from":"Mrs A. Tully, Harrowgate.",
  "clues":[{"p":"Priest","t":["g1"],"why":"the chapel"},{"p":"Father","t":["g1"],"why":"the chapel"},{"p":"blue door","t":["g5"],"why":"a cottage on Gull Lane"},{"p":"Josephine","t":[],"why":"see the census"}],
  "answer":"g1",
  "bounces":{"g5":"The woman at the blue door reads 'Josephine' on the page and goes very still. 'This is for the priest,' she says, and closes the door."},
  "reply":{"from":"Fr. Amos, St Brendan's","style":"hand","body":"Clerk — I have called on Mrs Anse. She is well enough, if thin. She lights a candle for Calloway every Sunday at the side altar and has done since the Kittiwake went down in the November gale of '92. Four years this month.\n\nThank you for the letter. Her mother worries. I have written to say so, and I have put a stamp on it.","facts":[{"who":"Josephine Anse","f":"Née Tully. Keeps the blue door on Gull Lane. Lights a candle every Sunday for her husband Calloway, lost with the Kittiwake, November 1892."}]}},
 {"id":"grandma","style":"child","tag":"Pencil, a child's hand","to":"To Grandma,\nGull Lane, the house with the green shutters,\nSaltmarsh.","body":"Dear Grandma, I am at school in the town now and I do not like it. Mam says you would send a cake if you knew. The nuns say I have a good hand. Please tell Da the pup is called Biscuit.\n\nP.S. Did the lady next door with the blue door get her letters? The ones with no stamp. Mam said not to ask.","from":"Love, Nuala.",
  "clues":[{"p":"Gull Lane","t":["g1","g3","g5","g7","g9"],"why":"the whole lane"},{"p":"green shutters","t":["g7"],"why":"one cottage"},{"p":"blue door","t":["g5"],"why":"next door, not this one"},{"p":"Nuala","t":[],"why":"see the census"}],
  "answer":"g7",
  "bounces":{"g5":"Jo Anse reads 'Grandma' and almost smiles. 'Next door. And tell the child I did get them.'"},
  "reply":{"from":"S. Halloran, 7 Gull Lane","style":"hand","body":"Clerk — Nuala's letter arrived and Mother wept over it, so you have done a good thing.\n\nAbout the child's question, since she will only ask again. Jo Anse next door has had three letters this year with no stamp, pushed under the blue door in the night. She says she burns them unread. I do not think she does.","unlockCensus":["pell"],"facts":[{"who":"Josephine Anse","f":"Three unstamped letters this year, pushed under her door at night. She claims to burn them."}]}},
 {"id":"tincture","style":"typed","tag":"Typed, the name smudged by rain","to":"Dr L—,\n—— Walk,\nSaltmarsh.","body":"Dear Doctor, Enclosed is your invoice for tincture of laudanum, 12 fl. oz., and camphorated oil, 1 pt. We note this is your fourth such order this quarter and remind you that the Board requires a register of purchasers to be kept and produced on demand.","from":"Whitlock & Daughter, Wholesale Chemists.",
  "clues":[{"p":"Doctor","t":["r10"],"why":"Dr Lisle, the apothecary"},{"p":"tincture","t":["r10"],"why":"an apothecary's stock"},{"p":"laudanum","t":["r10"],"why":"an apothecary's stock"},{"p":"Walk","t":["r2","r4","r6","r8","r10"],"why":"Rope Walk"}],
  "answer":"r10",
  "bounces":{"g3":"Miss Corliss reads 'Doctor' and sniffs. 'Not that kind, and not any kind. Rope Walk, I should think.'"},
  "reply":{"from":"P. Lisle, Apothecary","style":"typed","body":"Clerk — Whitlock's letter, yes. I keep a register, whatever they think.\n\nThree of the four orders went to one man. A lodger at Pell's who gives no name, pays in foreign coin, and keeps his right hand gloved indoors and out. The laudanum is for the hand, he says. I do not think it is only for the hand.","facts":[{"who":"The lodger at Pell's","f":"No name given. Pays in foreign coin. Right hand always gloved. Buys laudanum from Lisle."}]}},
 {"id":"mainsail","style":"hand","tag":"Ink, hurried, no name","to":"To the woman who mended\nthe Kittiwake's mainsail.\nSaltmarsh.","body":"Madam — The stitching held through the crossing and I am grateful for it. I will pay the rest when I can, which may be soon.\n\nDo not speak the boat's name to anyone. Not to the harbourmaster. Not to the priest.","from":"A friend of Cal's.",
  "clues":[{"p":"mended","t":["r8"],"why":"the sailmaker"},{"p":"mainsail","t":["r8"],"why":"the sailmaker"},{"p":"Kittiwake","t":[],"why":"a drowned boat"},{"p":"Cal","t":[],"why":"see the census"}],
  "answer":"r8",
  "reply":{"from":"A. Thorne, Sailmaker","style":"hand","body":"Clerk — I did mend a mainsail three weeks ago. The boy who brought it would not say whose it was, but it was an old sail, well made, and the boat's name had been picked out of the leech stitch by stitch.\n\nThere is one boat in this town whose sail I would know blind, because I made it. She is meant to be on the bottom of the bay.","facts":[{"who":"The Kittiwake","f":"Agnes Thorne mended what she swears is the Kittiwake's mainsail three weeks ago. Somebody unpicked the name."}]}},
 {"id":"warning","style":"caps","tag":"Block capitals, no stamp, found on the step","to":"THE CLERK,\nDEAD LETTER OFFICE,\nQUAY STREET.","body":"YOU HAVE BEEN CAREFUL WITH OTHER PEOPLE'S LETTERS.\n\nBE CAREFUL WITH YOUR OWN.\n\nTHE KITTIWAKE IS A DROWNED BOAT. LET HER LIE.","from":"",

 {"id":"ben","style":"hand","tag":"Violet ink, a young woman's hand","to":"Ben,\nwhose father sells the fish,\nSaltmarsh.","body":"Ben — Papa says I am not to see you and I have told him I will do as I like. Meet me at the end of the cannery pier on Friday after the lamps are lit. Bring nothing. Wear the blue coat.","from":"M.",
  "clues":[{"p":"father sells the fish","t":["q5"],"why":"the fishmonger"},{"p":"Ben","t":["q5"],"why":"Benedict Oduya, see the census"},{"p":"cannery pier","t":["c2","c4","c6","c8","c10"],"why":"a meeting place, not an address"}],
  "answer":"q5",
  "reply":{"from":"B. Oduya, 5 Quay St","style":"hand","body":"Clerk — Thank you. I will be there Friday.\n\nI have been at the end of that pier most nights this month waiting for a girl who did not come, so I will tell you what I did see. Lanterns out on the water past the cannery, late, with no riding lights. A boat that came in to berth 14, quiet, and left before the tide turned. Reyes says nothing is berthed at 14.","facts":[{"who":"Berth 14","f":"Ben Oduya has seen an unlit boat use berth 14 at night and leave before the tide."}]}},
 {"id":"sister","style":"hand","tag":"Ink, a woman's hand, no street given","to":"Mr T. Blackwood,\ncare of Mrs Pell,\nSaltmarsh.","body":"Tom — if that is what I am to call you now. The money came again. I do not want it and Mother would not have taken it either.\n\nYou have a wife three streets away who lights candles for you. Whatever Grady has you doing on that boat, it is not worth her. Go home to her, Cal. I will not write again.","from":"Nell.",

  "reply":{"from":"Returned, next morning","style":"hand","body":"The letter is back on your desk before you arrive, with NO ONE OF THAT NAME pencilled across the front in a hand that is trying not to look like a hand.\n\nThe flap has been opened and resealed with wax that is not yours. Under it, pressed flat, is a sea-pink, the kind that grows only on the lighthouse rock.","facts":[{"who":"Tom Blackwood","f":"The lodger at Pell's is Calloway Anse. His sister Nell knows. Grady has him working a boat."}]}},
 {"id":"grady","style":"typed","tag":"Typed, no signature, posted from up the coast","to":"Mr G.,\nthe cannery,\nSaltmarsh.","body":"G. — The fourteenth, as before. Have the crates on the pier by the second bell and the Inspector's man will not be on it.\n\nYour boatman is asking for more. Remind him what the Widow would think of a husband who ran, and what the town would think of a widow who kept a dead man's berth paid.","from":"S.",
  "clues":[{"p":"cannery","t":["c2","c4"],"why":"office or dormitory"},{"p":"Mr G.","t":["c2"],"why":"M. Grady, foreman"},{"p":"Inspector","t":["q9"],"why":"Customs House"},{"p":"boatman","t":[],"why":"Cal Anse?"},{"p":"berth","t":[],"why":"berth 14, see Notes"}],

  "reply":{"from":"M. Grady, Cannery Office","style":"typed","body":"Clerk. You did right to bring it.\n\nYou would do better to forget it.","facts":[{"who":"M. Grady","f":"Runs crates off the cannery pier on the fourteenth. Customs is paid to look away. 'S.' who pays the berth money is Solly Marsh."},{"who":"Inspector Dace","f":"His man will 'not be on the pier' on the fourteenth. Bought, or careless."}]}},
 {"id":"jo","style":"hand","tag":"Ink, a woman's hand, water-marked","to":"Cal,\nwherever you are.","body":"Cal — I write this every November and put it in the post, because a letter that cannot be delivered is the only kind I can bear to send. Four years.\n\nI have stopped burning the ones under the door. I know your hand, even with the letters cut from the newspaper. I know it is you.\n\nIf you are three streets from me and alive, I would rather know that than have you drowned and honest. Come home.","from":"Jo.",
  "requires":["sister"],
  "clues":[{"p":"Cal","t":[],"why":"a drowned man. Or a lodger with another name?"},{"p":"under the door","t":["g5"],"why":"her own door"},{"p":"three streets","t":[],"why":"count them on the map"},{"p":"November","t":[],"why":"the month the Kittiwake went down"}],
  "answer":"r4","deliverLabel":"Deliver to the lodger",
  "bounces":{"g5":"You have brought her own letter back to her. Jo Anse takes it and does not close the door for a long moment. 'He is not here,' she says. 'You know that. You know where he is.'","g1":"Father Amos reads the first line and gives it back gently. 'Not to the chapel, clerk. To the man. If there is a man.'","q1":"Reyes' clerk frowns. 'A drowned man's letter? Try the bottom of the bay.'"},
  "reply":{"from":"C. Anse, at Pell's","style":"hand","body":"Clerk — She wrote to a dead man and you brought it to a live one. I have been Tom Blackwood for four years and it took you a month to undo.\n\nI am going to do a thing tomorrow night that will finish Grady or finish me. Either way she will have a letter from me, and it will have a stamp on it.","facts":[{"who":"Calloway Anse","f":"Alive, at Pell's, under the name Blackwood. Moving against Grady tomorrow night."}]}},
 {"id":"home","style":"hand","tag":"Ink, a man's hand, a stamp at last","to":"The blue door,\nGull Lane,\nSaltmarsh.","body":"Jo — It is done. The Kittiwake is at berth 14 with Dace's own seal on her hatches and Grady in the customs cell, and my name is on the charge sheet as witness, which is to say my own name.\n\nI will be at the side altar on Sunday. Do not light the candle.","from":"Cal.",

  "answer":"g5",
  "reply":{"from":"J. Anse, 5 Gull Lane","style":"hand","body":"Clerk — He came home at four in the morning with the bakery smell in his coat, and I did not ask where he had been for four years, and he did not ask why I had kept his boots by the door.\n\nThank you for being bad at your job. A letter that reaches the Dead Letter Office is meant to stay dead.","facts":[{"who":"Josephine Anse","f":"Cal came home. She kept his boots by the door for four years."}],
   "second":{"from":"H. Dace, Customs House","style":"typed","body":"Clerk — Grady named you. Not to me. To the people 'S.' answers to, up the coast, before we took him.\n\nI would not walk Quay Street alone after dark. I would not stop reading the letters either. There will be more.","facts":[{"who":"Inspector Dace","f":"Warns you: Grady named you to the people up the coast. The next district's trouble is already on its way."}]}}}

  "reply":{"from":"A. & C. Pryor, Bell Steps","style":"hand","body":"Clerk — Winifred's note came, though the rain had been at it first. Since you are the new person who reads things: our late brother Julian was the Pryor in Haldane & Pryor, and Mr Haldane still sends us a goose at Christmas, which we give to the almshouse.\n\nWe do not care for Mr Haldane. We thought someone ought to say so to somebody.","unlockCensus":["pryor"],"facts":[{"who":"The Misses Pryor","f":"Their late brother was Haldane's partner. They do not trust Haldane, and they notice things."}]}},
 {"id":"haldane","style":"typed","tag":"Typed, posted from up the coast","to":"H.,\nwho keeps the accounts,\nClock Square.","body":"H. — Our friend at the cannery is taken and our friend at the customs house has turned. The clerk at the dead letter office reads more than a clerk should.\n\nMove the ledgers out of the square before quarter day, and see that the clerk is ⟦discouraged⟧.","from":"For the Committee.",

  "reply":{"from":"G. Haldane, Solicitor","style":"typed","body":"Clerk — A letter intended for me reached me by your hand, having been opened, I assume, by the weather. I keep clients' accounts, as any solicitor does.\n\nI would take it as a professional courtesy if the next one came sealed, and as a personal one if you forgot this one.","unlockCensus":["committee"],"facts":[{"who":"G. Haldane","f":"Keeps 'the ledgers' for the Committee up the coast. Knows you read his letter."}]}},
 {"id":"clock","style":"hand","tag":"Ink, an impatient hand","to":"The man who stopped the clock,\nOld Quarter,\nSaltmarsh.","body":"Sir — My late wife's watch was left with you in March and I have heard nothing since. I am told your shop keeps no hours because the clock in the square keeps none. I do not want an explanation. I want the watch.","from":"T. Ambler, Harrowgate.",
  "clues":[{"p":"stopped the clock","t":["k1"],"why":"the clockmaker faces the tower"},{"p":"watch","t":["k1"],"why":"a clockmaker's trade"},{"p":"clock in the square","t":[],"why":"stopped at 3:12"}],
  "answer":"k1",
  "reply":{"from":"A. Vell, Clockmaker","style":"hand","body":"Clerk — The watch is done. It has been done since April. I do not go to the door; bring Ambler here if he wants it.\n\nThe clock in the square stopped at twelve minutes past three on the morning of the 9th of June, 1871, and I have not had the heart to wind it, or anything, since. You will hear the rest from someone. Everyone tells it.","facts":[{"who":"A. Vell","f":"The square's clock stopped at 3:12 a.m., 9 June 1871, the night his daughter Marguerite vanished. He has wound nothing since."}]}},
 {"id":"midwife","style":"hand","tag":"Pencil, a rough hand, from the Docks","to":"The woman who caught\nthe Marr baby,\nWeavers' Court.","body":"Missus — You came to my sister in the Court in the spring when the boy was born. She is confined again and will have no one else, she says, and she is not to be argued with. Please come Tuesday to the rooms over the old dyer's. I will send the money from the Docks.","from":"E. Marr.",
  "clues":[{"p":"caught the Marr baby","t":["w5"],"why":"the midwife"},{"p":"Weavers' Court","t":["w1","w2","w3","w4","w5"],"why":"the whole court"},{"p":"rooms over the old dyer's","t":["w2"],"why":"where the sister lives, not the midwife"},{"p":"Docks","t":[],"why":"E. Marr lodges at Pell's"}],
  "answer":"w5",

  "reply":{"from":"R. Okonkwo, Midwife","style":"hand","body":"Clerk — I'll go Tuesday. Since you're the one who reads the letters, here is a thing I have never put in one.\n\nI have caught babies in this Court for thirty years. In June of 1871 I caught one in those same rooms over the dyer's, for a girl of seventeen who gave no name and was gone by morning with the child in a shawl. The music teacher at number three paid me, in gold, and asked me to forget. I have not.","facts":[{"who":"R. Okonkwo","f":"June 1871: a nameless girl of 17 gave birth above the dyer's and was gone by morning with the baby. Signor Abate paid the midwife in gold."}]}},
 {"id":"abate","style":"hand","tag":"Ink, a foreign hand, from Genoa","to":"Il Maestro,\nnear the church,\nOld Quarter.","body":"Maestro — My father Enzo died in Genoa in March. He asked for you at the end. He said: tell my teacher I kept the promise. I never wrote to the old man, and neither did she.\n\nI do not know who 'she' is. My mother will not say. Perhaps you will.","from":"L. Ferrand, Genoa.",

  "answer":"w3",
  "bounces":{"m7":"Mme Ferrand reads the name on the envelope and her hands stop moving. 'Not for me,' she says at last. 'The Maestro. Number three, in the Court.' She does not give it back at once."},
  "reply":{"from":"L. Abate, Weavers' Court","style":"hand","body":"Clerk — Enzo Ferrand was my best pupil and my worst decision. In June of 1871 I put him and a girl and a baby three days old on the night coach, and I have taught scales to drapers' daughters ever since as a penance.\n\nThe girl's father had said he would sooner stop every clock in the world than see her married to a foreigner. I gather he made a start.","facts":[{"who":"L. Abate","f":"Enzo Ferrand eloped with Marguerite Vell and a three-day-old baby on the night coach, June 1871. Enzo died in Genoa this March."}]}},
 {"id":"bribe","style":"typed","tag":"Typed, heavy paper, something folded inside","to":"The clerk who reads,\nDead Letter Office,\nSaltmarsh.","body":"Haldane & Pryor are instructed to retain your discretion in the matter of certain correspondence. Five pounds is enclosed, with the same to follow each quarter day.\n\nShould you prefer a less comfortable arrangement, the Committee is in a position to provide one.","from":"per pro G. Haldane.",

 {"id":"photograph","style":"typed","tag":"Typed, unsigned but for an initial","to":"The photographer who did\nthe Assembly Rooms ball,\nOld Quarter.","body":"Sir — Plate 14 from the ball. The gentleman at the edge of the frame, by the curtain, with the ⟦packet⟧. I will pay any price for the print and more for the negative.\n\nDo not display it. Do not print it again.","from":"H.",

  "reply":{"from":"O. Lund, Photographer","style":"typed","body":"Clerk — 'H.' is Haldane; no one else in this town signs a single letter and expects to be obeyed. Plate 14 shows him by the curtain handing a packet to a man I know for a customs officer from up the coast, and it shows the officer's face.\n\nI have made three prints. One is in the poor box at St Cuthbert's, because nobody has opened it since 1871 and nobody will think to.","facts":[{"who":"O. Lund","f":"Has a photograph of Haldane paying a customs officer from up the coast. Hid a print in St Cuthbert's poor box."}]}},
 {"id":"granddaughter","style":"child","tag":"Ink, a schoolgirl's hand, from Genoa","to":"My grandfather,\nwho makes clocks,\nin the town where Mama was born.","body":"Dear Grandfather, I am Lucie. I am sixteen. I found Papa's letters after he died and now I know that you are real, and that Mama has passed your window every day for eleven years and never once gone in.\n\nI am not allowed to write this. I am writing it anyway. Please wind the clock.","from":"Lucie Ferrand.",

  "answer":"k1",

  "reply":{"from":"A. Vell, Clockmaker","style":"hand","body":"Clerk — I have read it forty times. Eleven years. Which window? I have not looked out of one since 1871.\n\nThere is a milliner's a few doors along that I have never once been inside, because I do not buy hats. I am too old to walk that far and too proud, which is the same thing. Bring me paper.","facts":[{"who":"A. Vell","f":"Knows now that his daughter is a few doors from him. Mme Ferrand, milliner on Mercer Row since 1885, is Marguerite Vell."}]}},
 {"id":"vell","style":"hand","tag":"Ink, a shaking hand","to":"Marguerite.\nI do not know what name you use.","body":"Marguerite — The clock stopped because I stopped it. I told the town it stopped on its own, and I have told myself a great many things since.\n\nYour daughter writes a better letter than I do. If you are a few doors from me I will not make you walk them. Tell me which door and I will come out.","from":"Papa.",

  "answer":"m7","deliverLabel":"Deliver to the milliner",
  "bounces":{"k1":"You have brought the old man his own letter back. He will not take it. 'You know the door. You have known for a week.'","w3":"Abate reads 'Marguerite' and closes his eyes. 'Not here. Mercer Row. The hats. You knew that.'"},
  "reply":{"from":"M. Ferrand, who was Vell","style":"hand","body":"Clerk — I have sold that man's neighbours their hats for eleven years and crossed the square rather than pass his glass.\n\nTell him: Sunday, at noon, when the clock would strike if it struck. I will stand under it. If he can walk a few doors he can walk to the middle of the square.","facts":[{"who":"Marguerite Ferrand","f":"Will stand under the stopped clock Sunday at noon and wait for her father to come out."}]}},
 {"id":"ledgers","style":"typed","tag":"Typed, a solicitor's clerk","to":"The manager,\nthe bank,\nClock Square.","body":"Rooke — The ledgers come to the vault tonight; H. brings them himself by the back stair after the lamps. Have the second key ready.\n\nThe Committee's man collects Sunday at noon, when the square is empty and the church is shut.","from":"J., for H.",

 {"id":"sexton","style":"typed","tag":"Typed, Customs House paper","to":"The sexton,\nSt Cuthbert's,\nOld Quarter.","body":"Fell — There is a photograph in your poor box that I need before Sunday noon, and I would sooner not be seen taking it. Bring it to the Turk's Head on Saturday.\n\nLet no one from Haldane's office near the church, whatever they offer for the roof.","from":"H. Dace, Customs.",

 {"id":"finale","style":"hand","tag":"Ink, a woman's hand, a thick packet","to":"Vell, Clockmaker,\n1 Clock Square.","body":"Papa — The sexton has given me back twenty-five letters I never meant anyone to read. They are enclosed. Read them in order.\n\nI will be under the clock at noon on Sunday, for as long as it takes. When you come out, bring the key to the tower.","from":"M.",
  "requires":["sexton"],
  "clues":[{"p":"Vell","t":["k1"],"why":"in the directory"},{"p":"Clock Square","t":["k1","k2","k3","k4","k5"],"why":"the square"},{"p":"key to the tower","t":[],"why":"twenty-five years"}],

   "second":{"from":"H. Dace, Customs House","style":"typed","body":"Clerk — Haldane is in the cell beside Grady, and the ledgers are in mine. The Committee itself is up the coast, past the end of my writ.\n\nThere is a letter on your desk with no stamp that came while you were in the square. I did not open it. I would.","facts":[{"who":"Inspector Dace","f":"Haldane arrested with the ledgers. The Committee is up the coast, beyond his reach. An unstamped letter waits on your desk."}]}}}

<script>
(function(){
const D = JSON.parse(document.getElementById('game-data').textContent);
const DIST = Object.fromEntries(D.districts.map(d=>[d.id,d]));
const B = {}, L = {}, LD = {};
D.districts.forEach(d=>{ d.buildings.forEach(b=>{ b.d=d.id; B[b.id]=b; }); d.letters.forEach(l=>{ l.d=d.id; L[l.id]=l; }); });
const KEY = 'deadletter.v2';
const HINT_AFTER = 3;

const fresh = () => ({day:1, tab:'desk', district:'docks', open:null, tray:[], queue:{}, delivered:{}, post:[], pins:{}, wrong:{}, census:[], learned:[], intro:true, files:'dir', selB:null, notebook:'', tut:0, tut2:null, glass:false, tools:{}});
let S = load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.day) return s; }catch(e){} return start(fresh(),'docks'); }
function start(s, did){ const d=DIST[did]; s.district=did; s.queue[did]=s.queue[did]||0; d.census.filter(c=>c.start).forEach(c=>{ if(!s.census.includes(c.id)) s.census.push(c.id); }); s.tray=[]; s.open=null; s.intro=true; fillTray(s); return s; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const cur = () => DIST[S.district];
const replyOf = (l,d) => l.keep ? l.keep[d.choice].reply : l.reply;

function repliesArrived(s,id){ const d=s.delivered[id]; return d && d.day < s.day; }
function canEnter(s,l){ return (l.requires||[]).every(r=>repliesArrived(s,r)); }
function fillTray(s){
  const d=DIST[s.district]; const ids=d.letters.map(l=>l.id);
  while(s.tray.length<2 && s.queue[d.id]<ids.length){
    const l=L[ids[s.queue[d.id]]];
    if(!canEnter(s,l)) break;
    s.tray.push(l.id); s.queue[d.id]++;
  }
}
function districtDone(d){ return d.letters.every(l=>S.delivered[l.id] && repliesArrived(S,l.id)) && S.post.filter(p=>L[p.id].d===d.id).every(p=>p.read); }
function nextDistrict(){ const i=D.districts.findIndex(d=>d.id===S.district); return D.districts[i+1]||null; }
function morning(){
  S.day++;
  for(const id in S.delivered){ const d=S.delivered[id]; if(d.day===S.day-1 && !d.posted){ d.posted=true; if(replyOf(L[id],d)) S.post.push({id, day:S.day, read:false}); } }
  fillTray(S); S.open=null; S.selB=null; save(); render();
  toast(S.post.some(p=>!p.read) ? 'Morning. The post has come.' : 'Morning. Nothing came.');
}

/* ---------- Tutorial ---------- */
const TUT = [
 {t:"This is your tray. Two letters nobody could deliver. Tap the top one.", done:s=>s.open==='reyes'},
 {t:"Read it. The address is half the puzzle. Tap the word <b>Reyes</b> to pin him as a lead.", done:s=>(s.pins.reyes?.c||[]).length>0},
 {t:"A lead. Leads light doors on the map. Tap <b>Open the map</b>.", done:s=>s.tab==='map'||!!s.delivered.reyes},
 {t:"One door is lit: the harbourmaster on Quay Street. Tap it, then <b>Deliver here</b>. A wrong door bounces back with a hint, so guessing is allowed but the town remembers.", done:s=>!!s.delivered.reyes},
 {t:"Stamped. The reply comes in the morning. The second letter is yours to solve. When the tray is empty, end the shift.", done:s=>s.day>=2},
 {t:"The post came. Read the replies. What people tell you lands in <b>Notes</b>, and it is the real puzzle.", done:s=>s.post.some(p=>p.read)},
 {t:"Not every name is in the Directory. Widows, lodgers and children are on the Census cards under <b>Files</b>. Your own notebook is the pencil button, bottom right.", done:s=>!!s.tutAck, ack:true}
];
const TUT2 = [
 {t:"Some words on this letter are too faded to read. Open it and tap <b>Glass</b> above the paper to read them under the magnifying glass.", done:s=>s.glass===true},
 {t:"Faded words come clear under the glass and pin like any other. The glass stays in your drawer from now on.", done:s=>!!s.tut2Ack, ack:true}
];
function advanceTut(){
  if(S.tut!==null && S.tut!==undefined){ while(S.tut<TUT.length && TUT[S.tut].done(S)) S.tut++; if(S.tut>=TUT.length) S.tut=null; }
  if(S.tut2!==null && S.tut2!==undefined){ while(S.tut2<TUT2.length && TUT2[S.tut2].done(S)) S.tut2++; if(S.tut2>=TUT2.length) S.tut2=null; }
}
function coachHTML(){
  if(S.intro) return '';
  let step=null, which=null;
  if(S.tut!==null && S.tut!==undefined && TUT[S.tut]){ step=TUT[S.tut]; which='tut'; }
  else if(S.tut2!==null && S.tut2!==undefined && TUT2[S.tut2]){ step=TUT2[S.tut2]; which='tut2'; }
  if(!step) return '';
  return `<div class="coach"><small>The postmaster</small><p>${step.t}</p><div class="row">${step.ack?`<button class="ok" data-act="ack" data-which="${which}">Got it</button>`:''}<button data-act="skiptut" data-which="${which}">Skip the lesson</button></div></div>`;
}

/* ---------- Text & clues ---------- */
const clean = w => w.toLowerCase().replace(/[^a-z0-9'’]/g,'');
function sections(l){ return [['to',l.to],['body',l.body],['from',l.from||'']]; }
function tokens(text){ // [{t, ws, faded}]
  let inFade=false;
  return text.split(/(\s+)/).filter(t=>t.length).map(t=>{
    if(/^\s+$/.test(t)) return {t, ws:true};
    const opens=t.includes('⟦'), closes=t.includes('⟧');
    const faded = inFade || opens;
    if(opens) inFade=true; if(closes) inFade=false;
    return {t:t.replace(/[⟦⟧]/g,''), faded};
  });
}
function clueMap(l){
  const m={};
  sections(l).forEach(([sec,text])=>{
    const toks=tokens(text); const idx=[]; const words=[];
    toks.forEach((tk,i)=>{ if(!tk.ws){ idx.push(i); words.push(clean(tk.t)); } });
    m[sec]={};
    l.clues.forEach((c,ci)=>{
      const pw=c.p.split(/\s+/).map(clean);
      for(let i=0;i+pw.length<=words.length;i++){
        let ok=true; for(let j=0;j<pw.length;j++){ if(words[i+j]!==pw[j]){ok=false;break;} }
        if(ok){ for(let j=0;j<pw.length;j++) m[sec][idx[i+j]]=ci; }
      }
    });
  });
  return m;
}
function pinsFor(id){ return S.pins[id] || (S.pins[id]={c:[],w:[]}); }
function renderText(l, sec, text, cm, readonly){
  const p=pinsFor(l.id);
  return tokens(text).map((tk,i)=>{
    if(tk.ws) return tk.t;
    const ci=cm[sec][i];
    const pinned = ci!==undefined ? p.c.includes(ci) : p.w.includes(sec+':'+i);
    if(readonly) return esc(tk.t);
    const cls=['w', pinned?'pin':'', tk.faded?(S.glass?'clear':'faded'):''].join(' ');
    return `<span class="${cls}" data-sec="${sec}" data-i="${i}" data-ci="${ci===undefined?'':ci}" data-faded="${tk.faded?1:''}">${esc(tk.t)}</span>`;
  }).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function togglePin(id, sec, i, ci){
  const p=pinsFor(id);
  if(ci!==''){ const n=+ci; const k=p.c.indexOf(n); k>=0?p.c.splice(k,1):p.c.push(n); }
  else { const key=sec+':'+i; const k=p.w.indexOf(key); k>=0?p.w.splice(k,1):p.w.push(key); }
  save(); render();
}
function leadTargets(l){ const p=pinsFor(l.id); const sc={}; p.c.forEach(ci=>{ (l.clues[ci].t||[]).forEach(b=>{ sc[b]=(sc[b]||0)+1; }); }); return sc; }
function hasFaded(l){ return /⟦/.test(l.to+l.body+(l.from||'')); }

/* ---------- Rendering ---------- */
const $=s=>document.querySelector(s);
function render(){
  advanceTut();
  $('#hDay').textContent=S.day; $('#hStamps').textContent=Object.keys(S.delivered).length;
  $('#hWrong').textContent=Object.values(S.wrong).reduce((a,b)=>a+b,0); $('#hDistrict').textContent=cur().tagline;
  document.querySelectorAll('nav.tabs button').forEach(b=>{ b.classList.toggle('on', b.dataset.tab===S.tab); b.querySelector('.dot')?.remove(); if(b.dataset.tab==='desk' && S.post.some(p=>!p.read)) b.insertAdjacentHTML('beforeend','<span class="dot"></span>');
    b.classList.toggle('pulse', (S.tut===2 && b.dataset.tab==='map') || (S.tut===5 && b.dataset.tab==='desk' && S.tab!=='desk')); });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+S.tab));
  $('#fab').classList.toggle('pulse', S.tut===6);
  $('#fab').hidden = !!S.intro;
  renderDesk(); renderMap(); renderFiles(); renderNotes(); save();
}
function letterPaper(l, {readonly=false, stamp=null, meta=null}={}){
  const cm=clueMap(l);
  return `<article class="paper ${l.style}">
    ${meta?`<div class="meta">${esc(meta)}</div>`:''}
    <p class="addr">${renderText(l,'to',l.to,cm,readonly)}</p>
    <p class="body">${renderText(l,'body',l.body,cm,readonly)}</p>
    ${l.from?`<p class="sign">${renderText(l,'from',l.from,cm,readonly)}</p>`:''}
    ${stamp?`<div class="stamp">${stamp}</div>`:''}
  </article>`;
}
function replyPaper(r, meta){ return `<article class="paper ${r.style||'hand'}"><div class="meta">${esc(meta||'')}</div><p class="body">${esc(r.body)}</p><p class="sign">${esc(r.from)}</p></article>`; }
function stampText(d){ return d.b==='self' ? 'Kept' : 'Delivered<br>'+B[d.b].num+' '+DIST[B[d.b].d].streets[B[d.b].st]; }
function renderDesk(){
  const el=$('#p-desk'); const d=cur(); let h='';
  if(S.intro){
    h+=`<div class="card-note"><h2>${esc(d.intro.title)}</h2>${d.intro.text.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}<div class="row"><button class="btn" data-act="intro">${esc(d.intro.button)}</button></div></div>`;
    el.innerHTML=h; return;
  }
  h+=coachHTML();
  if(S.open){
    const l=L[S.open]; const done=S.delivered[l.id]; const p=pinsFor(l.id);
    h+=`<div class="toolbar"><button class="btn ghost" data-act="back">← Tray</button>${S.tools.glass && !done ? `<button class="btn ghost${S.glass?' on':''}" data-act="glass">Glass ${S.glass?'on':'off'}</button>`:''}</div>`;
    h+=letterPaper(l,{readonly:!!done, stamp: done?stampText(done):null, meta:l.tag});
    if(!done){
      const leads=p.c.map(ci=>l.clues[ci]);
      if(leads.length) h+=`<div class="eyebrow">Leads</div><div class="leads">`+leads.map(c=>`<span class="lead">${esc(c.p)}<small>${c.t.length?(c.t.length===1?'one place':c.t.length+' places'):'—'} · ${esc(c.why)}</small></span>`).join('')+`</div>`;
      else if(!S.tut && !S.tut2) h+=`<p class="hintline">Tap words that could tell you where this belongs.</p>`;
      const w=S.wrong[l.id]||0;
      if(w>=HINT_AFTER && l.answer) h+=`<p class="hintline">The postmaster has circled ${d.streets[B[l.answer].st]} on the map in pencil.</p>`;
      if(l.keep) h+=`<div class="eyebrow">This one is yours</div><div class="row">`+l.keep.map((k,i)=>`<button class="btn${i?' ghost':''}" data-act="keep" data-i="${i}">${esc(k.label)}</button>`).join('')+`</div>`;
      else h+=`<div class="row"><button class="btn" data-act="tomap">Open the map</button></div>`;
    } else {
      const rep=S.post.find(x=>x.id===l.id); const r=replyOf(l,done);
      if(rep){ h+=`<div class="eyebrow">Reply</div>`+replyPaper(r,'Arrived night '+rep.day); if(r.second) h+=replyPaper(r.second,'Same morning'); }
      else h+=`<p class="hintline">${done.b==='self'?'Kept.':'Stamped.'} A reply, if any, comes with the morning.</p>`;
    }
    el.innerHTML=h; return;
  }
  const unread=S.post.filter(p=>!p.read);
  if(unread.length){
    h+=`<div class="eyebrow">Morning post</div><div class="tray">`+unread.map(p=>{ const r=replyOf(L[p.id],S.delivered[p.id]); return `<button class="env reply unread" data-act="read" data-id="${p.id}"><span class="to">${esc(r.from)}<i>Reply · re: ${esc(L[p.id].to.split('\n')[0])}</i></span><span class="stampbox">1d</span></button>`; }).join('')+`</div>`;
  }
  h+=`<div class="eyebrow">In the tray</div>`;
  const done = districtDone(d); const nd = nextDistrict();
  if(S.tray.length){
    h+=`<div class="tray">`+S.tray.map((id,i)=>{ const l=L[id]; const w=S.wrong[id]||0; return `<button class="env${S.tut===0&&i===0?' pulse':''}" data-act="open" data-id="${id}"><span class="to">${esc(l.to.split('\n')[0])}<i>${esc(l.tag)}${w?' · bounced '+w+'×':''}</i></span><span class="stampbox">?</span></button>`; }).join('')+`</div>`;
  } else if(done){
    h+=`<div class="card-note"><h2>${esc(d.ending.title)}</h2><p>${esc(d.ending.text)}</p><p>Nights worked: ${S.day}. Bounced: ${Object.values(S.wrong).reduce((a,b)=>a+b,0)}.</p>${nd?`<div class="row"><button class="btn" data-act="nextdistrict">${esc(d.ending.button)}</button></div>`:''}</div>`;
  } else {
    h+=`<p class="empty">${unread.length?'Read the post first.':'Nothing more tonight. Sleep, and see what the morning brings.'}</p>`;
  }
  if(!done) h+=`<div class="row" style="margin-top:8px"><button class="btn" data-act="sleep">End the shift → morning</button></div>`;
  h+=musicBar();
  h+=`<p class="foot">Replies arrive the next morning. In the full game a night is a real night. <button data-act="reset">Start over</button></p>`;
  el.innerHTML=h; updateMusicUI();
}

/* Map geometry */
const BH=58, GAP=8;
function rows(d){ const out={}; Object.keys(d.streets).forEach((st,i)=>{ const list=d.buildings.filter(b=>b.st===st); const n=list.length; const w=Math.min(56,Math.floor((336-(n-1)*GAP)/n)); const total=n*w+(n-1)*GAP; const x0=Math.round((360-total)/2); out[st]={y:48+i*110,w,xs:list.map((_,k)=>x0+k*(w+GAP)),ids:list.map(b=>b.id)}; }); return out; }
function renderMap(){
  const el=$('#p-map'); const d=cur(); const R=rows(d);
  const l=S.open && !S.delivered[S.open] && !L[S.open].keep ? L[S.open] : null;
  const sc=l?leadTargets(l):{}; const max=Math.max(0,...Object.values(sc));
  const hintSt = l && (S.wrong[l.id]||0)>=HINT_AFTER ? B[l.answer].st : null;
  let svg=`<svg class="map" viewBox="0 0 360 560" role="img" aria-label="Map of ${esc(d.name)}"><rect x="0" y="0" width="360" height="560" fill="#e9dfc6"/>${d.extras||''}`;
  for(const st in d.streets){
    const r=R[st]; const y=r.y-14;
    svg+=`<line x1="10" y1="${r.y+BH+6}" x2="350" y2="${r.y+BH+6}" stroke="#a89f88" stroke-width="1"/>`;
    svg+=`<text class="street${hintSt===st?' circled':''}" x="12" y="${y}">${esc(d.streets[st])}</text>`;
    if(hintSt===st) svg+=`<ellipse class="hintring" cx="${12+d.streets[st].length*3.4}" cy="${y-3}" rx="${d.streets[st].length*4.2}" ry="9"/>`;
  }
  d.buildings.forEach(b=>{
    const r=R[b.st]; const k=r.ids.indexOf(b.id); const x=r.xs[k], y=r.y, w=r.w;
    const s=sc[b.id]||0; const deliveredHere=Object.values(S.delivered).some(dd=>dd.b===b.id);
    const cls=['bld', s>0?(s===max?'hot':'lit'):'', (!s&&deliveredHere)?'done':'', S.selB===b.id?'sel':''].join(' ');
    const words=b.sign.split(' '); const lines=[]; let c='';
    words.forEach(wd=>{ if((c+' '+wd).trim().length>11 && c){ lines.push(c); c=wd; } else c=(c+' '+wd).trim(); }); if(c) lines.push(c);
    svg+=`<g class="${cls}" data-b="${b.id}" tabindex="0" role="button" aria-label="${esc(b.num+' '+d.streets[b.st]+', '+b.sign)}"><rect x="${x}" y="${y}" width="${w}" height="${BH}" rx="1"/><text class="num" x="${x+4}" y="${y+10}">${b.num}</text>${lines.slice(0,3).map((t,i)=>`<text x="${x+w/2}" y="${y+26+i*10}" text-anchor="middle">${esc(t)}</text>`).join('')}</g>`;
  });
  svg+='</svg>';
  let h=coachHTML()+`<div class="mapwrap">${svg}</div>`;
  h+=`<div class="mapkey"><span>${l?'<i></i>Lit by your leads · '+esc(l.to.split('\n')[0]):'Open a letter to light the map.'}</span></div>`;
  h+=`<p class="hintline" style="margin-top:10px">Tap a door to read the sign${l?' and deliver':''}.</p>`;
  el.innerHTML=h;
}
function openSheet(bid){
  S.selB=bid; const b=B[bid]; const d=DIST[b.d]; const l=S.open && !S.delivered[S.open] && !L[S.open].keep ? L[S.open] : null;
  const known = b.who || S.learned.find(x=>x.b===bid)?.who || 'Occupant not in the directory';
  const past = Object.entries(S.delivered).filter(([id,dd])=>dd.b===bid).map(([id])=>L[id].to.split('\n')[0]);
  let h=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>${esc(b.num)} ${esc(d.streets[b.st])}</h3><p class="sub">${esc(b.sign)}</p><p>${esc(known)}</p>`;
  if(past.length) h+=`<p style="color:var(--pencil);font-size:14px">Delivered here: ${past.map(esc).join(' · ')}</p>`;
  if(l) h+=`<div class="row"><button class="btn" data-act="deliver" data-b="${bid}">${esc(l.deliverLabel||'Deliver here')}</button><button class="btn ghost" data-act="closesheet">Not this one</button></div>`;
  $('#sheet').innerHTML=h; $('#sheet').classList.add('open'); $('#scrim').classList.add('on'); renderMap();
}
function closeSheet(){ S.selB=null; $('#sheet').classList.remove('open'); $('#scrim').classList.remove('on'); renderMap(); }
function openNotebook(){
  $('#sheet').innerHTML=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Your notebook</h3><p class="sub">Pencil. Nobody else reads it.</p><textarea class="nb" id="nb" placeholder="Who lodges at Pell's? Which door is three streets from the blue one?">${esc(S.notebook)}</textarea><div class="row" style="margin-top:10px"><button class="btn ghost" data-act="closesheet">Put it away</button></div>`;
  $('#sheet').classList.add('open'); $('#scrim').classList.add('on'); setTimeout(()=>$('#nb')?.focus(),250);
}
function finishLetter(l, rec){
  S.delivered[l.id]=rec; S.tray=S.tray.filter(x=>x!==l.id);
  if(rec.b!=='self'){ const b=B[rec.b]; if(!b.who && b.learn && !S.learned.some(x=>x.b===rec.b)) S.learned.push({b:rec.b,who:b.learn}); }
  fillTray(S); save();
}
function deliver(bid){
  const l=L[S.open]; const b=B[bid]; const d=DIST[b.d];
  if(bid===l.answer){
    finishLetter(l,{b:bid, day:S.day});
    $('#sheet').innerHTML=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Stamped.</h3><p class="sub">${esc(b.num)} ${esc(d.streets[b.st])}</p><p>${l.id==='warning'?'You keep it. Nobody else will read it.':'The door closes on the letter. A reply, if any, comes with the morning.'}</p><div class="row"><button class="btn" data-act="backdesk">Back to the desk</button></div>`;
    toast('Delivered.'); render();
  } else {
    S.wrong[l.id]=(S.wrong[l.id]||0)+1; save();
    const msg=(l.bounces&&l.bounces[bid])||b.bounce;
    let extra='';
    if(S.wrong[l.id]===HINT_AFTER) extra=`<p>Back at the desk the postmaster looks over your shoulder, sighs, and circles <b>${esc(d.streets[B[l.answer].st])}</b> on the map in pencil.</p>`;
    $('#sheet').innerHTML=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Returned to sender</h3><p class="sub">${esc(b.num)} ${esc(d.streets[b.st])}</p><p class="bounce">${esc(msg)}</p>${extra}<div class="row"><button class="btn ghost" data-act="closesheet">Try another door</button></div>`;
    render();
  }
}
function renderFiles(){
  const el=$('#p-files'); const d=cur();
  let h=coachHTML()+`<div class="subtabs">${[['dir','Directory'],['census','Census'],['arch','Archive']].map(([k,n])=>`<button data-files="${k}" class="${S.files===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(S.files==='dir'){
    const learned=S.learned.filter(x=>B[x.b].d===d.id).map(x=>[x.who, B[x.b].num+' '+d.streets[B[x.b].st]]);
    h+=`<div class="dir"><h4>${esc(d.name)} · Residents & Trades</h4>`+d.directory.map(([n,a])=>`<div class="e"><span>${esc(n)}</span><span>${esc(a)}</span></div>`).join('')+learned.map(([n,a])=>`<div class="e pencil"><span>${esc(n)}</span><span>${esc(a)}</span></div>`).join('')+`</div><p class="hintline" style="margin-top:12px">The directory lists householders and trades. Lodgers, widows and children are not in it. Try the census.</p>`;
  } else if(S.files==='census'){
    const cards=D.districts.flatMap(dd=>dd.census.filter(c=>S.census.includes(c.id)).map(c=>({...c,dn:dd.name})));
    h+=`<div class="census">`+cards.map(c=>`<div class="ccard"><b>Census card · ${esc(c.dn)}</b>${esc(c.text)}</div>`).join('')+`</div><p class="hintline" style="margin-top:12px">More cards turn up as the town gets to know you.</p>`;
  } else {
    const done=Object.entries(S.delivered).sort((a,b)=>a[1].day-b[1].day);
    h+= done.length ? `<div class="arch">`+done.map(([id,dd])=>`<button class="env" data-act="open" data-id="${id}"><span class="to">${esc(L[id].to.split('\n')[0])}<i>Night ${dd.day} · ${dd.b==='self'?'kept':esc(B[dd.b].num+' '+DIST[B[dd.b].d].streets[B[dd.b].st])}${repliesArrived(S,id)?' · reply on file':''}</i></span><span class="stampbox">✓</span></button>`).join('')+`</div>` : `<p class="empty">Nothing delivered yet.</p>`;
  }
  el.innerHTML=h;
}
function renderNotes(){
  const el=$('#p-notes');
  const facts=[]; S.post.filter(p=>p.read).forEach(p=>{ const r=replyOf(L[p.id],S.delivered[p.id]); (r.facts||[]).forEach(f=>facts.push({...f,day:p.day})); if(r.second) (r.second.facts||[]).forEach(f=>facts.push({...f,day:p.day})); });
  let h=coachHTML()+`<div class="eyebrow">Your notebook</div>`;
  h+=`<div class="nbview${S.notebook.trim()?'':' empty-nb'}" >${S.notebook.trim()?esc(S.notebook):'Nothing written yet. Tap the pencil to jot names, doors, and hunches.'}</div><div class="row" style="margin-bottom:22px"><button class="btn ghost" data-act="notebook">Write in it</button></div>`;
  h+=`<div class="eyebrow">What the town has told you</div>`;
  h+= facts.length ? `<div class="board">`+facts.slice().reverse().map((f,i)=>`<div class="fact${i%3===1?' who':''}"><small>${esc(f.who)} · night ${f.day}</small>${esc(f.f)}</div>`).join('')+`</div>` : `<p class="empty">Nothing yet. Replies fill this board.</p>`;
  el.innerHTML=h;
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- Music ---------- */
const TRACKS=[['Theme I','audio/theme-1.m4a'],['Theme II','audio/theme-2.m4a'],['Theme III','audio/theme-3.m4a'],['Theme IV','audio/theme-4.m4a'],['Theme V','audio/theme-5.m4a']];
const audio=new Audio(); audio.volume=.8; audio.preload='none';
let musicWanted = S.music!==false; // default on; first play waits for a tap
function updateMusicUI(){
  const playing=!audio.paused && !audio.ended && audio.src;
  const b=$('#musicBtn'); b.classList.toggle('on', !!playing); b.title = playing ? 'Music: '+TRACKS[S.track||0][0]+' (tap to pause)' : 'Music off (tap to play)';
  document.querySelectorAll('.musicbar b').forEach(x=>x.textContent = playing ? TRACKS[S.track||0][0] : 'off');
  document.querySelectorAll('.musicbar [data-act="music"]').forEach(x=>x.textContent = playing ? 'Pause' : 'Play');
}
function playTrack(i){
  S.track=((i%TRACKS.length)+TRACKS.length)%TRACKS.length; audio.src=TRACKS[S.track][1];
  audio.play().then(()=>{ S.music=true; musicWanted=true; save(); updateMusicUI(); }).catch(()=>{ updateMusicUI(); });
}
audio.addEventListener('ended',()=>playTrack((S.track||0)+1));
audio.addEventListener('pause',updateMusicUI); audio.addEventListener('play',updateMusicUI);
function toggleMusic(){ if(!audio.paused && audio.src){ audio.pause(); S.music=false; musicWanted=false; save(); } else playTrack(S.track||0); }
function musicBar(){ return `<div class="musicbar"><span>Music · <b>off</b></span><div class="row"><button data-act="music">Play</button><button data-act="nexttrack">Next track</button></div></div>`; }

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(musicWanted && !S.intro && !audio.src && !e.target.closest('[data-act="music"]')) playTrack(S.track||0);
  const w=e.target.closest('.w'); if(w && S.open && !S.delivered[S.open]){ if(w.dataset.faded && !S.glass){ toast('Too faded to read. Use the glass.'); return; } togglePin(S.open,w.dataset.sec,+w.dataset.i,w.dataset.ci); return; }
  const tab=e.target.closest('nav.tabs button'); if(tab){ S.tab=tab.dataset.tab; render(); return; }
  const ft=e.target.closest('[data-files]'); if(ft){ S.files=ft.dataset.files; save(); renderFiles(); return; }
  const bld=e.target.closest('.bld'); if(bld){ openSheet(bld.dataset.b); return; }
  if(e.target.id==='scrim'){ closeSheet(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='intro'){ S.intro=false; render(); if(musicWanted && audio.paused) playTrack(S.track||0); }
  else if(act==='music'){ toggleMusic(); }
  else if(act==='nexttrack'){ playTrack((S.track||0)+1); }
  else if(act==='open'){ S.open=a.dataset.id; S.tab='desk'; render(); window.scrollTo(0,0); }
  else if(act==='read'){ const p=S.post.find(x=>x.id===a.dataset.id); p.read=true; (replyOf(L[p.id],S.delivered[p.id]).unlockCensus||[]).forEach(c=>{ if(!S.census.includes(c)) S.census.push(c); }); S.open=p.id; S.tab='desk'; render(); window.scrollTo(0,0); }
  else if(act==='back'){ S.open=null; render(); }
  else if(act==='tomap'){ S.tab='map'; render(); window.scrollTo(0,0); }
  else if(act==='glass'){ S.glass=!S.glass; render(); }
  else if(act==='deliver'){ deliver(a.dataset.b); }
  else if(act==='keep'){ const l=L[S.open]; finishLetter(l,{b:'self', day:S.day, choice:+a.dataset.i}); S.open=null; toast('Kept.'); render(); }
  else if(act==='closesheet'){ closeSheet(); }
  else if(act==='backdesk'){ closeSheet(); S.open=null; S.tab='desk'; render(); window.scrollTo(0,0); }
  else if(act==='sleep'){ morning(); window.scrollTo(0,0); }
  else if(act==='notebook'){ openNotebook(); }
  else if(act==='ack'){ if(a.dataset.which==='tut') S.tutAck=true; else S.tut2Ack=true; render(); }
  else if(act==='skiptut'){ if(a.dataset.which==='tut') S.tut=null; else S.tut2=null; render(); }
  else if(act==='nextdistrict'){ const nd=nextDistrict(); if(nd){ start(S, nd.id); S.tut=null; if(nd.id==='old'){ S.tools.glass=true; S.tut2=0; S.glass=false; } S.tab='desk'; render(); window.scrollTo(0,0); } }
  else if(act==='reset'){ if(confirm('Start over from night one? Your notebook goes too.')){ S=start(fresh(),'docks'); render(); } }
});
document.addEventListener('input',e=>{ if(e.target.id==='nb'){ S.notebook=e.target.value; save(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.classList.contains('bld')) openSheet(e.target.dataset.b); if(e.key==='Escape') closeSheet(); });
render();
})();
</script>
