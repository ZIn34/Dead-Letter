<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Detective</title>
<meta name="theme-color" content="#1b2320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Detective">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=Caveat:wght@400;600&family=Homemade+Apple&family=Dancing+Script:wght@500&family=Rock+Salt&family=Shadows+Into+Light&display=swap">
<style>
:root{
  --ground:#1b2320; --desk:#243129; --desk-edge:#2f4035; --brass:#b8925a; --brass-dim:#7d6640;
  --paper:#efe6d2; --paper-deep:#e3d7bc; --paper-shadow:#c9bb9c; --ink:#232f3b; --ink-soft:#4a5561;
  --pencil:#6f675a; --red:#b0392e; --red-soft:rgba(176,57,46,.16); --lamp:#e8c15a; --lamp-soft:rgba(232,193,90,.22);
  --wood:#3a2a1e; --wood-edge:#5a4331;
  --sans: "Crimson Pro", Georgia, "Times New Roman", serif;
  --fell: "IM Fell English", "Crimson Pro", Georgia, serif;
  --typed: "Special Elite", "Courier New", Courier, monospace;
  --hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --nbfont: var(--hand); --nbsize:21px; --nbline:28px;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip;background:
  radial-gradient(120% 60% at 50% -10%, rgba(232,193,90,.20), transparent 60%), var(--desk);
  box-shadow:0 0 0 1px var(--desk-edge)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px 10px;border-bottom:1px solid var(--brass-dim)}
header h1{font:400 22px/1 var(--fell);margin:0;letter-spacing:.02em;color:var(--brass)}
header h1 small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-dim);margin-top:5px;font-family:var(--sans)}
.ledger{display:flex;gap:12px;flex:none;font-variant-numeric:tabular-nums;font-size:14px;color:var(--brass)}
.ledger b{display:block;font:400 20px/1 var(--fell);color:var(--paper)}
.ledger span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim)}
.music{width:34px;height:34px;border-radius:50%;border:1px solid var(--brass-dim);color:var(--brass-dim);font:400 18px/32px var(--fell);text-align:center;align-self:center}
.music.on{color:#1b1b17;background:var(--brass);border-color:#d8b478}
.music.snd{display:grid;place-items:center}
.music.snd.off .w1,.music.snd.off .w2{display:none}
main{flex:1;min-height:0;position:relative}
.panel{display:none;padding:16px 16px 110px;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:.6}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){header h1{font-size:20px} .ledger{gap:9px} .ledger b{font-size:18px} .music{width:30px;height:30px;line-height:28px;font-size:16px} .panel{padding-left:12px;padding-right:12px} .paper{padding:22px 16px 20px}}

/* Coach */
.coach{background:rgba(232,193,90,.10);border:1px solid var(--brass);border-left:4px solid var(--lamp);padding:12px 14px;margin:0 0 14px;color:var(--paper)}
.coach p{margin:0 0 8px;font-size:16px}
.coach .row{gap:14px;align-items:center}
.coach .row button{font:400 13px var(--fell);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.coach .row button.ok{color:#1b1b17;background:var(--brass);padding:6px 12px}
.coach small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}

/* Shelf */
.shelf{position:relative;height:74px;margin:0 -4px 18px;background:linear-gradient(180deg,#4a3627,var(--wood) 60%,#2a1d14);border-top:2px solid var(--wood-edge);border-bottom:6px solid #1c130d;box-shadow:0 8px 16px rgba(0,0,0,.4) inset,0 2px 0 #5a4331}
.shelf .items{position:absolute;left:14px;right:14px;bottom:4px;display:flex;align-items:flex-end;justify-content:space-around;height:64px}
.shelf svg{height:52px;width:auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.shelf .hint{position:absolute;inset:0;display:grid;place-items:center;font:italic 14px var(--fell);color:rgba(232,193,90,.55)}

/* Common */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:6px 0 10px}
.paper{overflow-wrap:anywhere;background:var(--paper);color:var(--ink);padding:26px 22px 22px;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.35), 0 1px 0 var(--paper-shadow) inset;margin-bottom:14px}
.paper::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),transparent 30%,rgba(0,0,0,.03));pointer-events:none}
.file{font-family:var(--typed);font-size:14px;line-height:1.55}
.file h2{font:400 22px var(--fell);margin:0 0 2px;letter-spacing:.02em}
.file .no{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--pencil);margin-bottom:12px}
.file dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px}
.file dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);padding-top:3px}
.file dd{margin:0}
.file .sec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--pencil);margin:12px 0 4px;border-bottom:1px solid var(--paper-shadow)}
.file ul{margin:0;padding-left:18px}
.file li{margin:3px 0}
.file li.since{color:#7a3b2a}
.file .gaz{font-family:var(--sans);font-style:italic;font-size:16px;margin:0}
.stamp{position:absolute;right:14px;top:14px;transform:rotate(-10deg);border:2px solid var(--red);color:var(--red);font:400 13px/1.15 var(--fell);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;text-align:center;opacity:.85;border-radius:3px;mix-blend-mode:multiply}
.stamp.cold{border-color:var(--ink-soft);color:var(--ink-soft)}
.budget{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{background:rgba(0,0,0,.22);border:1px solid var(--brass-dim);color:var(--paper);font-size:14px;padding:5px 10px;font-variant-numeric:tabular-nums}
.chip b{font:400 16px var(--fell);color:var(--lamp)}
.chip.zero b{color:var(--red)}

.suspects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sus{background:var(--paper-deep);color:var(--ink);padding:12px 12px 10px;text-align:left;border:1px solid var(--paper-shadow);box-shadow:2px 3px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px;position:relative}
.sus:nth-child(2n){transform:rotate(.5deg)} .sus:nth-child(2n+1){transform:rotate(-.4deg)}
.sus .med{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 18px var(--fell);color:var(--paper);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--paper-shadow)}
.sus b{font:400 17px var(--fell);line-height:1.15}
.sus i{font-size:13px;color:var(--pencil);font-style:normal;letter-spacing:.04em}
.sus p{margin:0;font-size:14px;line-height:1.3}
.sus .asked{position:absolute;top:8px;right:10px;font:400 11px var(--fell);color:var(--pencil);letter-spacing:.1em}
.sus .asked.hot{color:var(--red)}
.sus.guessed{outline:2px dashed var(--ink-soft);outline-offset:-2px}
.sus.culprit{outline:2px solid var(--red);outline-offset:-2px}

.hintline{font-style:italic;color:var(--brass);font-size:15px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--brass);color:#1b1b17;font:400 15px var(--fell);letter-spacing:.06em;padding:11px 16px;border:1px solid #d8b478;box-shadow:0 2px 0 var(--brass-dim);text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--brass);border-color:var(--brass-dim);box-shadow:none}
.btn.danger{background:var(--red);color:var(--paper);border-color:#d0645a;box-shadow:0 2px 0 #6e231c}
.btn.press{background:var(--ink);color:var(--paper);border-color:#4a5561;box-shadow:0 2px 0 #10161d}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.card-note{background:rgba(0,0,0,.18);border:1px solid var(--brass-dim);padding:14px 16px;margin:0 0 16px;color:var(--paper)}
.card-note h2{font:400 20px var(--fell);margin:0 0 6px;color:var(--brass)}
.card-note p{margin:0 0 8px;font-size:16px}
.card-note p:last-child{margin:0}
.card-note .row{margin-top:10px}

/* Sheet */
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:480px;background:var(--paper);color:var(--ink);padding:18px 18px 22px;box-shadow:0 -10px 30px rgba(0,0,0,.45);transition:transform .25s ease;z-index:20;max-height:84dvh;overflow:auto}
#sheet.open{transform:translate(-50%,0)}
#sheet h3{font:400 22px var(--fell);margin:0 0 2px}
#sheet .sub{color:var(--pencil);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
#sheet p{margin:0 0 10px;font-size:16px}
#sheet .close{position:absolute;top:10px;right:14px;font:20px var(--fell);color:var(--pencil)}
.qs{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.q{text-align:left;border:1px solid var(--paper-shadow);background:#f6efdc;padding:10px 12px;font-size:15.5px;color:var(--ink);width:100%}
.q small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:2px}
.q[disabled]{opacity:.5}
.q.ev{border-left:3px solid var(--brass)}
.q.ev.fact{border-left-color:var(--ink-soft)}
.a{font-family:var(--hand);font-size:21px;line-height:1.25;color:#2f2a22;padding:8px 12px 10px 16px;border-left:3px solid var(--brass);margin:0 0 4px}
.a.break{border-left-color:var(--red);background:var(--red-soft)}
.a.secret{border-left-color:var(--ink-soft);background:rgba(74,85,97,.08)}
.a.miss{color:var(--pencil)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
.scrim.on{display:block}
.verdict{font:400 30px var(--fell);color:var(--red);margin:0 0 4px}
.verdict.cold{color:var(--ink-soft)}
.pay{font:400 24px var(--fell);color:#3b6b3f;margin:0 0 8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dotted var(--paper-shadow)}
.setrow:last-of-type{border:0}
.setrow b{font:400 17px var(--fell)}
.setrow i{display:block;font-style:normal;font-size:13px;color:var(--pencil)}
.sw{flex:none;min-width:64px;text-align:center;font:400 13px var(--fell);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--pencil);color:var(--ink)}
.sw.on{background:var(--brass);border-color:#d8b478;color:#1b1b17}

/* Cases */
.caselist{display:flex;flex-direction:column;gap:10px}
.casebtn{display:flex;align-items:center;gap:12px;background:var(--paper-deep);color:var(--ink);padding:12px 14px;border:1px solid var(--paper-shadow);text-align:left;width:100%;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.casebtn .n{font:400 13px var(--fell);color:var(--pencil);letter-spacing:.1em;width:28px;flex:none}
.casebtn b{font:400 17px var(--fell);display:block}
.casebtn i{font-style:normal;font-size:12px;color:var(--pencil);letter-spacing:.06em;text-transform:uppercase}
.casebtn .st{margin-left:auto;font:400 13px var(--fell);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-align:right}
.casebtn .st.ok{color:#3b6b3f} .casebtn .st.cold{color:var(--pencil)} .casebtn .st.open{color:var(--red)}
.casebtn.locked{opacity:.45}
.casebtn.cur{outline:2px solid var(--lamp);outline-offset:-2px}

/* Notebook */
textarea.nb{width:100%;min-height:260px;resize:vertical;border:0;border-top:1px solid var(--paper-shadow);padding:10px 6px;font-family:var(--nbfont);font-size:var(--nbsize);line-height:var(--nbline);color:#2f2a22;background:
  repeating-linear-gradient(transparent 0 calc(var(--nbline) - 1px), var(--paper-shadow) calc(var(--nbline) - 1px) var(--nbline)) 0 9px/100% var(--nbline), #f6efdc;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.stm{background:var(--paper);color:var(--ink);padding:10px 12px;margin-bottom:8px;box-shadow:1px 2px 0 rgba(0,0,0,.25);border-left:3px solid var(--brass)}
.stm b{font:400 16px var(--fell);display:block;margin-bottom:4px}
.stm div{font-family:var(--typed);font-size:12.5px;line-height:1.5;margin:0 0 4px}
.stm div span{color:var(--pencil)}
.stm div.pr{color:#7a3b2a}

/* Shop */
.money{font:400 26px var(--fell);color:var(--lamp);margin:0 0 12px}
.money small{font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-left:8px}
.goods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.good{background:var(--paper-deep);color:var(--ink);border:1px solid var(--paper-shadow);padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.good svg{height:48px;width:auto;align-self:center;margin:4px 0}
.good b{font:400 16px var(--fell)}
.good i{font-style:normal;font-size:13px;color:var(--pencil)}
.good .buy{margin-top:auto;align-self:stretch;text-align:center;font:400 14px var(--fell);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;background:var(--brass);color:#1b1b17;border:1px solid #d8b478}
.good .buy.owned{background:transparent;color:var(--pencil);border-color:var(--paper-shadow)}
.good .buy[disabled]{opacity:.45}
.hands{display:flex;flex-direction:column;gap:10px}
.handrow{background:var(--paper);color:#2f2a22;padding:10px 12px;display:flex;align-items:center;gap:12px;border:1px solid var(--paper-shadow);box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.handrow .prev{flex:1;line-height:1.25;overflow-wrap:anywhere}
.handrow .prev small{display:block;font:400 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-top:4px}
.handrow .buy{flex:none;font:400 13px var(--fell);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;background:var(--brass);color:#1b1b17;border:1px solid #d8b478;min-width:74px;text-align:center}
.handrow .buy.use{background:transparent;color:var(--ink);border-color:var(--pencil)}
.handrow .buy.inuse{background:var(--lamp);border-color:#f0d27a}
.handrow .buy[disabled]{opacity:.45}


/* Online: subtabs, editor, co-op */
.subtabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--brass-dim)}
.subtabs button{flex:1;padding:8px 4px;font:400 15px var(--fell);color:var(--brass-dim);letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.empty{color:var(--brass-dim);font-style:italic;padding:8px 2px}
.casebtn .st .btn{padding:7px 10px;font-size:13px}
.casebtn .st .chip{font-size:12px}
.editor{background:var(--paper);color:var(--ink);padding:16px 14px 18px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.editor .eyebrow{color:var(--pencil);display:flex;justify-content:space-between;align-items:center}
.editor .hintline{color:#7a3b2a}
.fld{display:block;margin:0 0 10px}
.fld span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--paper-shadow);background:#f6efdc;color:var(--ink);font:400 16px var(--sans);padding:8px 10px;border-radius:0}
.fld textarea{resize:vertical;min-height:48px;font-family:var(--hand);font-size:19px;line-height:1.25}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--lamp);outline-offset:1px}
#sheet .fld input{background:#fff}
.cul{font:400 13px var(--sans);letter-spacing:.04em;text-transform:none;color:var(--red);display:flex;align-items:center;gap:6px}
.cul input{accent-color:var(--red)}
.code-in{width:110px;border:1px solid var(--brass-dim);background:rgba(0,0,0,.25);color:var(--lamp);font:400 22px var(--fell);letter-spacing:.3em;text-align:center;padding:8px 6px;text-transform:uppercase}
#sheet .code-in{background:#fff;color:var(--ink)}
.card-note.coop{border-color:var(--lamp)}
.card-note.coop .code{font:400 22px var(--fell);letter-spacing:.3em;color:var(--lamp);margin-left:6px}

/* Tabs */
nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:#141a17;border-top:1px solid var(--brass-dim);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{padding:12px 4px 10px;font:400 14px var(--fell);letter-spacing:.1em;text-transform:uppercase;color:var(--brass-dim);position:relative}
nav.tabs button.on{color:var(--lamp)}
nav.tabs button.pulse{color:var(--lamp);text-shadow:0 0 8px var(--lamp)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--paper);color:var(--ink);padding:10px 16px;font:400 16px var(--fell);box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .3s;z-index:30;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.musicbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 0;padding:10px 12px;border:1px solid var(--brass-dim);color:var(--brass);font-size:14px}
.musicbar b{font:400 15px var(--fell);color:var(--paper)}
.musicbar .row{gap:14px}
.musicbar .row button{font:400 12px var(--fell);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.foot{margin-top:24px;font-size:13px;color:var(--brass-dim);text-align:center}
.foot button{text-decoration:underline;color:var(--brass-dim)}
</style>

<div id="app">
  <header>
    <h1>The Detective<small>Saltmarsh · Night desk</small></h1>
    <div class="ledger">
      <div><b id="hMoney">£0</b><span>Purse</span></div>
      <div><b id="hSolved">0</b><span>Solved</span></div>
      <button class="music" id="musicBtn" data-act="music" aria-label="Music on or off" title="Music">♪</button>
      <button class="music snd" id="sndBtn" data-act="sound" aria-label="Sound settings" title="Sound"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="w1" d="M16 9.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="w2" d="M18.5 7a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <main>
    <section class="panel on" id="p-desk"></section>
    <section class="panel" id="p-cases"></section>
    <section class="panel" id="p-notebook"></section>
    <section class="panel" id="p-shop"></section>
  </main>
  <nav class="tabs">
    <button data-tab="desk" class="on">Desk</button>
    <button data-tab="cases">Cases</button>
    <button data-tab="notebook">Notebook</button>
    <button data-tab="shop">Shop</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>

<script id="game-data" type="application/json">

"cases":[
{"id":"bell","title":"The Yard Behind the Bell","reward":4,

   "answers":["The Weavers' Arms. I went in at five with my last shilling and I was still there when I heard the clock strike seven, and I went home.","He refused me a loan of four pounds and laughed. That is the whole of it. I am not proud of being poor.","Six, and seven. I told you. I heard seven strike and I got up and went home to Weavers' Court."],
   "press":{"keys":["f1","lucie:2","lucie:press","vell:2"],"answer":"It struck seven, I heard... It didn't. No. I went up because he'd laughed, and he was on the stair with his back to me and his chain hanging out of his waistcoat like a rope somebody had left for me. I am a tall man. It was over before the quarter. I went to the Arms after, and I told myself I'd heard seven.","miss":"Pike will tell you I was there."}}

<script>
(function(){
const D = JSON.parse(document.getElementById('game-data').textContent);
const C = Object.fromEntries(D.cases.map(c=>[c.id,c]));
const R = D.rules;
const KEY='deadletter.v5';
const rid=(n=10)=>Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');

const fresh=()=>({tab:'desk', money:0, solved:{}, inv:{}, caseId:D.cases[0].id, owned:[], hand:'caveat', notebook:'', intro:true, tut:0, music:false, track:0,
  pid:'p'+rid(10), name:'', made:{}, taken:{}, coop:null, coopApplied:{}, casesTab:'files', editing:null});
let S=load();
let db=null, room=null, ONLINE=false, BOARD=[], COOP=null, unsubCoop=null, PEERS=[], netNote='';
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.caseId){ if(!s.pid) s.pid='p'+rid(10); s.made=s.made||{}; s.taken=s.taken||{}; s.coopApplied=s.coopApplied||{}; return s; } }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} try{ pushSave(); }catch(e){} }
const $=s=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const idx=id=>D.cases.findIndex(c=>c.id===id);
const isStory=id=>!!C[id];
function getCase(id){ if(C[id]) return C[id]; if(COOP && COOP.caseId===id && COOP.caseData) return COOP.caseData; if(S.taken[id]) return S.taken[id].c; return null; }
function cur(){ if(COOP && COOP.caseData) return COOP.caseData; return getCase(S.caseId) || (S.caseId=D.cases[0].id, C[S.caseId]); }
function unlocked(id){ if(!isStory(id)) return true; const i=idx(id); return i===0 || !!S.solved[D.cases[i-1].id]; }
function localInv(cid){ return S.inv[cid] || (S.inv[cid]={asked:{}, presses:[], revealed:{}, broken:false}); }
function inv(cid){ if(COOP && COOP.caseId===cid) return COOP.inv || {asked:{},presses:[],revealed:{},broken:false}; return localInv(cid); }
function nAsked(cid){ return Object.values(inv(cid).asked||{}).reduce((a,l)=>a+l.length,0); }
function qLeft(cid){ return Math.max(0, R.questions - nAsked(cid)); }
function pLeft(cid){ return Math.max(0, R.presses - (inv(cid).presses||[]).length); }
function nextCase(){ if(!isStory(S.caseId)) return null; const i=idx(S.caseId); return D.cases[i+1]||null; }
function handOf(){ return D.hands.find(x=>x.id===S.hand)||D.hands[0]; }
function sus(c,sid){ return c.suspects.find(x=>x.id===sid); }
function myName(){ return S.name || 'Detective '+S.pid.slice(1,5).toUpperCase(); }
function inCoop(){ return !!(S.coop && COOP); }

/* Evidence available to press with: facts, heard statements, reveals */
function evidence(c){
  const I=inv(c.id); const out=[];
  c.brief.facts.forEach((f,i)=>out.push({id:'f'+i, kind:'fact', who:'Case file', text:f}));
  c.suspects.forEach(s=>{ ((I.asked||{})[s.id]||[]).slice().sort().forEach(qi=>out.push({id:s.id+':'+qi, kind:'said', who:s.name, text:s.answers[qi]})); if((I.revealed||{})[s.id]) out.push({id:s.id+':press', kind:'press', who:s.name+', pressed', text:s.press.answer}); });
  return out;
}
function evText(c,id){ const e=evidence(c).find(x=>x.id===id); return e? e.who+': '+e.text : id; }

/* ---------- Money ---------- */
function addMoney(d){ S.money=Math.max(0, S.money+d); save(); pushPlayer(); }

/* ---------- Tutorial ---------- */
const first=D.cases[0].id;
const TUT=[
 {t:"A case file. Read it twice: what the Gazette printed, and what only this office knows. Then tap a suspect.", done:s=>!!s.tutOpened},
 {t:"You get <b>six questions</b> for four people, so choose. Their descriptions and notes are there to help you decide whom to ask what.", done:s=>nAsked(first)>=2||!!s.solved[first]},
 {t:"When something a suspect says doesn't square with the file, or with what someone else said, <b>press</b> them with it. Two presses a case. A press can break a killer, or make an honest liar admit what they were really hiding.", done:s=>(localInv(first).presses.length>=1)||!!s.solved[first]},
 {t:"Accuse from the suspect's page when you're sure. A wrong arrest goes cold with no pay. A right one pays, and £2 more if you broke them first: the magistrate likes a confession.", done:s=>!!s.solved[first]},
 {t:"That's the job. Cold cases follow you into later files. The <b>Cases</b> board keeps the score, and it's also where other detectives post cases of their own, for stakes, and where you can open a co-op room.", done:s=>!!s.tutAck, ack:true}
];
function advanceTut(){ if(S.tut===null||S.tut===undefined) return; while(S.tut<TUT.length && TUT[S.tut].done(S)) S.tut++; if(S.tut>=TUT.length) S.tut=null; }
function coachHTML(){ if(S.intro||S.tut===null||S.tut===undefined) return ''; const st=TUT[S.tut]; if(!st) return ''; return `<div class="coach"><small>The Inspector</small><p>${st.t}</p><div class="row">${st.ack?'<button class="ok" data-act="ack">Understood</button>':''}<button data-act="skiptut">Skip the lesson</button></div></div>`; }

/* ---------- Decor art ---------- */
const ART={
 pipe:`<svg viewBox="0 0 64 40"><path d="M6 12 q26 -6 40 4" fill="none" stroke="#b8925a" stroke-width="3" stroke-linecap="round"/><path d="M42 12 h14 v14 q0 8 -8 8 h-4 q-8 0 -8 -8 z" fill="#3a2a1e" stroke="#b8925a" stroke-width="2"/></svg>`,
 photo:`<svg viewBox="0 0 48 56"><rect x="4" y="4" width="40" height="48" fill="#b8925a"/><rect x="9" y="9" width="30" height="38" fill="#efe6d2"/><ellipse cx="24" cy="26" rx="8" ry="10" fill="#6f675a"/><path d="M8 47 q16 -14 32 0" fill="#4a5561"/></svg>`,
 fern:`<svg viewBox="0 0 56 64"><path d="M14 40 h28 l-4 20 h-20 z" fill="#7a3b2a" stroke="#b8925a" stroke-width="1.5"/><path d="M28 40 q-2 -18 -18 -26 M28 40 q2 -20 18 -30 M28 40 q0 -22 0 -36 M28 40 q-8 -12 -20 -8 M28 40 q8 -14 22 -10" fill="none" stroke="#5f8a5a" stroke-width="3" stroke-linecap="round"/></svg>`,
 lamp:`<svg viewBox="0 0 64 64"><ellipse cx="32" cy="58" rx="16" ry="4" fill="#b8925a"/><rect x="30" y="30" width="4" height="28" fill="#b8925a"/><path d="M8 30 q24 -18 48 0 z" fill="#3b6b3f" stroke="#b8925a" stroke-width="1.5"/><ellipse cx="32" cy="34" rx="18" ry="5" fill="#e8c15a" opacity=".8"/></svg>`,
 decanter:`<svg viewBox="0 0 64 64"><path d="M22 60 h20 q6 0 6 -6 v-14 q0 -10 -10 -14 v-14 h-12 v14 q-10 4 -10 14 v14 q0 6 6 6z" fill="#efe6d2" opacity=".9" stroke="#b8925a" stroke-width="1.5"/><rect x="26" y="8" width="12" height="6" fill="#b8925a"/><path d="M20 44 q12 4 24 0 v10 q0 6 -6 6 h-12 q-6 0 -6 -6z" fill="#8a3a2a" opacity=".8"/><path d="M52 60 h10 v-14 h-10z" fill="#efe6d2" opacity=".9" stroke="#b8925a" stroke-width="1.2"/><path d="M53 52 h8 v8 h-8z" fill="#8a3a2a" opacity=".8"/></svg>`,
 ship:`<svg viewBox="0 0 80 40"><path d="M6 12 h50 q18 0 18 8 t-18 8 h-50 z" fill="#efe6d2" opacity=".85" stroke="#b8925a" stroke-width="1.5"/><rect x="0" y="14" width="8" height="12" fill="#b8925a"/><path d="M22 27 h26 l-3 4 h-20z" fill="#3a2a1e"/><path d="M35 27 v-14 l10 12 z" fill="#efe6d2" stroke="#3a2a1e" stroke-width="1"/><path d="M34 27 v-14 l-9 12 z" fill="#efe6d2" stroke="#3a2a1e" stroke-width="1"/></svg>`,
 cat:`<svg viewBox="0 0 72 48"><ellipse cx="40" cy="36" rx="28" ry="12" fill="#2a2320"/><circle cx="18" cy="26" r="12" fill="#2a2320"/><path d="M8 20 l2 -12 l8 8z M28 20 l-2 -12 l-8 8z" fill="#2a2320"/><circle cx="14" cy="26" r="1.6" fill="#e8c15a"/><circle cx="22" cy="26" r="1.6" fill="#e8c15a"/><path d="M66 36 q8 -14 -2 -20" fill="none" stroke="#2a2320" stroke-width="5" stroke-linecap="round"/></svg>`,
 typewriter:`<svg viewBox="0 0 80 56"><rect x="24" y="2" width="32" height="20" fill="#efe6d2" stroke="#b8925a" stroke-width="1"/><rect x="8" y="22" width="64" height="26" rx="4" fill="#2a2320" stroke="#b8925a" stroke-width="1.5"/><rect x="4" y="46" width="72" height="8" rx="2" fill="#3a2a1e" stroke="#b8925a" stroke-width="1"/>${[0,1,2,3,4,5,6].map(i=>`<circle cx="${18+i*7.5}" cy="32" r="2" fill="#b8925a"/><circle cx="${22+i*7.5}" cy="39" r="2" fill="#b8925a"/>`).join('')}</svg>`
};

/* ---------- Online (claude.ai artifact runtime) ---------- */
async function initNet(){
  try{
    if(!(window.claude && typeof window.claude.use==='function')){ netNote='offline'; return; }
    db=await window.claude.use('db');
    if(!db){ netNote='offline'; render(); return; }
    ONLINE=true; netNote='';
    await syncPlayer();
    db.collection('cases').orderBy('createdAt','desc').limit(60).onSnapshot(snap=>{ BOARD=snap.docs.map(d=>d.data()).filter(Boolean); checkLost(); render(); }, e=>{ netNote='board '+e.code; render(); });
    watchPlayer();
    if(S.coop) joinCoop(S.coop.code, true);
    room=await window.claude.use('room');
    if(room){ room.onPeers(ch=>{ PEERS=ch.peers.slice(); renderCoopPeers(); }); pushPresence(); }
    render();
  }catch(e){ netNote='offline'; render(); }
}
async function syncPlayer(){
  const ref=db.doc('players/'+S.pid); const snap=await ref.get();
  if(snap.exists){ const d=snap.data(); if(S.account && d.save) adoptSave(d.save); if(typeof d.money==='number') S.money=d.money; if(d.name && !S.name) S.name=d.name; save(); if(d.name!==myName()) pushPlayer(); }
  else await ref.set({pid:S.pid, name:myName(), money:S.money, save:S.account?saveBlob():null, updatedAt:Date.now()});
}
let pushT; function pushPlayer(){ if(!ONLINE) return; clearTimeout(pushT); pushT=setTimeout(()=>{ db.doc('players/'+S.pid).set({pid:S.pid, name:myName(), money:S.money, updatedAt:Date.now()}).catch(()=>{}); },150); }
function pushPresence(){ if(room) room.presence({name:myName(), coop:S.coop?S.coop.code:null}).catch(()=>{}); }
function boardCase(cid){ return BOARD.find(b=>b.id===cid); }
function checkLost(){ let changed=false; for(const cid in S.taken){ const b=boardCase(cid); if(b && b.status!=='open' && b.solvedBy!==S.pid && !S.solved[cid]){ delete S.taken[cid]; if(S.caseId===cid) S.caseId=D.cases[0].id; changed=true; toast('Someone closed "'+b.title+'" before you.'); } } if(changed) save(); }

/* ----- accounts: username + password, verified in the page, progress kept in the player doc ----- */
const hex=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbkdf(pw, saltHex){ const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']); const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(saltHex),iterations:120000},key,256); return hex(new Uint8Array(bits)); }
const SAVE_KEYS=['money','solved','inv','owned','hand','notebook','taken','made','coopApplied','tut','tutAck','tutOpened','intro','sfx','amb','music'];
function saveBlob(){ const o={}; SAVE_KEYS.forEach(k=>{ if(S[k]!==undefined) o[k]=S[k]; }); return o; }
let cloudT; function pushSave(){ if(!ONLINE||!S.account) return; clearTimeout(cloudT); cloudT=setTimeout(()=>{ db.doc('players/'+S.pid).update({save:saveBlob(), money:S.money, name:myName(), savedAt:Date.now()}).catch(()=>{}); },900); }
function adoptSave(blob){ if(!blob) return; SAVE_KEYS.forEach(k=>{ if(blob[k]!==undefined) S[k]=blob[k]; }); S.intro=false; S.caseId=D.cases[0].id; S.coop=null; save(); }
function validUser(u){ return /^[a-z0-9_]{3,16}$/.test(u); }
async function register(u, pw){
  u=String(u||'').trim().toLowerCase(); if(!validUser(u)) return 'Username: 3 to 16 letters, numbers or underscores.'; if(String(pw||'').length<4) return 'Password: at least 4 characters.';
  if(!ONLINE) return 'Accounts need the online version.';
  const ref=db.doc('accounts/'+u); const lock=await ref.acquire({holder:S.pid, ttlMs:8000}); if(!lock.acquired) return 'Try again in a moment.';
  const snap=await ref.get(); if(snap.exists) return 'That name is taken.';
  const salt=hex(crypto.getRandomValues(new Uint8Array(16))); const h=await pbkdf(pw,salt); const pid='p'+rid(10);
  await ref.set({user:u, salt, hash:h, pid, createdAt:Date.now()});
  // carry the guest's progress into the new account
  S.pid=pid; S.account=u; if(!S.name) S.name=u; save();
  await db.doc('players/'+pid).set({pid, name:myName(), money:S.money, save:saveBlob(), updatedAt:Date.now(), savedAt:Date.now()});
  watchPlayer(); pushPresence(); return null;
}
async function login(u, pw){
  u=String(u||'').trim().toLowerCase(); if(!ONLINE) return 'Accounts need the online version.';
  const snap=await db.doc('accounts/'+u).get(); if(!snap.exists) return 'No account by that name.';
  const a=snap.data(); const h=await pbkdf(pw||'',a.salt); if(h!==a.hash) return 'Wrong password.';
  S.pid=a.pid; S.account=u; save();
  const ps=await db.doc('players/'+a.pid).get();
  if(ps.exists){ const d=ps.data(); if(d.save) adoptSave(d.save); if(typeof d.money==='number') S.money=d.money; if(d.name) S.name=d.name; save(); }
  else await db.doc('players/'+a.pid).set({pid:a.pid, name:myName(), money:S.money, save:saveBlob(), updatedAt:Date.now()});
  watchPlayer(); pushPresence(); return null;
}
function signOut(){ if(S.coop) leaveCoop(true); const keepSfx={sfx:S.sfx, amb:S.amb}; S=Object.assign(fresh(), keepSfx); save(); watchPlayer(); pushPlayer(); pushPresence(); render(); toast('Signed out. This device is a guest again.'); }
let unsubPlayer=null;
const claimed={};
function watchPlayer(){ if(!ONLINE) return; if(unsubPlayer) unsubPlayer(); unsubPlayer=db.collection('credits').where('to','==',S.pid).onSnapshot(snap=>{ snap.docs.forEach(d=>{ const c=d.data(); if(!c||c.to!==S.pid||claimed[d.id]) return; claimed[d.id]=true; db.doc('credits/'+d.id).delete().then(()=>{ addMoney(+c.amount||0); SFX.play('coin'); toast((c.from||'Someone')+' paid you £'+c.amount+(c.reason?' · '+c.reason:'')+'.'); render(); }).catch(()=>{ claimed[d.id]=false; }); }); }, e=>{}); }
function credit(to, amount, reason){ if(!ONLINE||!amount) return Promise.resolve(); return db.collection('credits').add({to, amount, from:myName(), fromPid:S.pid, reason, at:Date.now()}).catch(()=>{}); }
function openAccount(){
  let h=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Account</h3>`;
  if(!ONLINE) h+=`<p class="sub">Offline</p><p>Accounts need the game opened through its claude.ai link. On this copy you are a guest; your progress is saved in this browser only.</p><div class="row"><button class="btn ghost" data-act="rename">Change name</button></div>`;
  else if(S.account) h+=`<p class="sub">Signed in as ${esc(S.account)}</p><p>Your purse, cases and notebook follow this account to any device. Displayed as <b>${esc(myName())}</b>.</p><div class="row"><button class="btn ghost" data-act="rename">Change display name</button><button class="btn ghost" data-act="signout">Sign out</button></div>`;
  else h+=`<p class="sub">Guest on this device</p><p>Make an account to keep your purse and progress across devices, and to put a name on the board. Your guest progress comes with you.</p>
    <label class="fld"><span>Username</span><input id="acc_u" autocapitalize="none" autocomplete="username" placeholder="lowercase, 3 to 16"></label>
    <label class="fld"><span>Password</span><input id="acc_p" type="password" autocomplete="current-password"></label>
    <p class="hintline" id="acc_msg" style="min-height:1.2em"></p>
    <div class="row"><button class="btn" data-act="login">Sign in</button><button class="btn ghost" data-act="register">Create account</button></div>
    <p class="hintline" style="margin-top:12px;font-size:13px">This is a friends' game, not a bank: passwords are checked in the page and the shared database is open to everyone who has the link. Don't reuse a password you care about.</p>`;
  h+=`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="closesheet">Back</button></div>`;
  $('#sheet').innerHTML=h; $('#sheet').classList.add('open'); $('#scrim').classList.add('on');
}
async function accountAction(kind){
  const u=$('#acc_u')&&$('#acc_u').value, p=$('#acc_p')&&$('#acc_p').value; const msg=$('#acc_msg'); if(msg) msg.textContent='One moment…';
  try{ const err = kind==='login' ? await login(u,p) : await register(u,p); if(err){ if(msg) msg.textContent=err; return; } closeSheet(); SFX.play('stamp'); toast(kind==='login'?'Signed in as '+S.account+'.':'Account made. Welcome, '+S.account+'.'); render(); }
  catch(e){ if(msg) msg.textContent='Could not reach the database ('+(e.code||e.message)+').'; }
}

/* ----- player cases: publish / take / resolve ----- */
function blankCase(){
  const sid=()=>'s'+rid(4);
  return {id:'pc_'+rid(8), title:'', reward:0, brief:{victim:'', weapon:'', time:'', place:'', public:'', facts:['','','']}, questions:['Where were you when it happened?','How did you know the victim?','What do you make of how they died?'],
    suspects:[0,1,2,3].map(i=>({id:sid(), name:'', age:'', job:'', color:['#6b4a3a','#3f5560','#7a6a2e','#5a3f5e'][i], look:'', note:'', answers:['','',''], press:{keys:[], answer:'', miss:''}})),
    culprit:'', solution:'', arrest:''};
}
function validateCase(c){
  const errs=[]; const need=(v,l)=>{ if(!String(v||'').trim()) errs.push(l); };
  need(c.title,'a title'); need(c.brief.victim,'the victim'); need(c.brief.weapon,'the weapon'); need(c.brief.time,'the time'); need(c.brief.place,'the place'); need(c.brief.public,'what the Gazette printed');
  if(!c.brief.facts.some(f=>f.trim())) errs.push('at least one police fact');
  c.questions.forEach((q,i)=>need(q,'question '+(i+1)));
  c.suspects.forEach((s,i)=>{ need(s.name,'suspect '+(i+1)+"'s name"); s.answers.forEach((a,j)=>need(a,(s.name||'suspect '+(i+1))+"'s answer "+(j+1))); if(s.press.keys.length) need(s.press.answer,(s.name||'suspect '+(i+1))+"'s line when the press lands"); });
  if(!c.suspects.some(s=>s.id===c.culprit)) errs.push('which suspect did it');
  return errs;
}
function cleanCase(c){ // trim empty facts, default texts
  const x=JSON.parse(JSON.stringify(c)); x.brief.facts=x.brief.facts.filter(f=>f.trim()); x.suspects.forEach(s=>{ s.age=String(s.age||'?'); if(!s.press.miss) s.press.miss='Nothing to say to that.'; if(!s.look) s.look='No description given.'; if(!s.note) s.note=''; if(s.press.keys.length && s.id!==x.culprit) s.press.secret=true; }); if(!x.solution) x.solution='The maker left no explanation. Draw your own.'; if(!x.arrest) x.arrest=''; return x; }
async function publishCase(mid, stake){
  const m=S.made[mid]; if(!m||m.published) return; const errs=validateCase(m.c); if(errs.length){ toast('Missing: '+errs.slice(0,3).join(', ')+(errs.length>3?'…':'')); return; }
  if(!ONLINE){ toast('Publishing needs the online version.'); return; }
  stake=Math.max(0,Math.floor(+stake||0)); if(stake>S.money){ toast('You can\'t cover a £'+stake+' stake.'); return; }
  const c=cleanCase(m.c); const doc={id:c.id, title:c.title, maker:S.pid, makerName:myName(), stake, status:'open', createdAt:Date.now(), caseData:c, solvedBy:null, solvedByName:null, correct:null, solvedAt:null};
  try{ await db.doc('cases/'+c.id).set(doc); }catch(e){ toast('Could not publish: '+(e.code||e.message)); return; }
  m.published=c.id; m.stake=stake; if(stake) addMoney(-stake); save(); SFX.play('stamp'); toast('Posted to the board'+(stake?' with £'+stake+' on it.':'.')); render();
}
async function withdrawCase(mid){
  const m=S.made[mid]; if(!m||!m.published||!ONLINE) return; const ref=db.doc('cases/'+m.published);
  const lock=await ref.acquire({holder:S.pid, ttlMs:8000}); if(!lock.acquired){ toast('Someone is closing it right now.'); return; }
  const snap=await ref.get(); if(!snap.exists||snap.data().status!=='open'){ toast('Too late; it has been closed.'); return; }
  await ref.update({status:'withdrawn'}); if(m.stake) addMoney(m.stake); m.published=null; save(); toast('Withdrawn. Stake returned.'); render();
}
function takeCase(cid){
  const b=boardCase(cid); if(!b||b.status!=='open') return toast('Not open.'); if(b.maker===S.pid) return toast('That one is yours.'); if(S.taken[cid]) return;
  if(b.stake>S.money) return toast('You need £'+b.stake+' in the purse to take this on.');
  S.taken[cid]={c:b.caseData, stake:b.stake, maker:b.maker, makerName:b.makerName, title:b.title, takenAt:Date.now()}; S.caseId=cid; S.tab='desk'; save(); SFX.play('paper'); render(); window.scrollTo(0,0);
}
async function resolvePlayerCase(c, sid){
  const t=S.taken[c.id]; if(!t) return; const I=localInv(c.id);
  if(!ONLINE){ toast('You need to be online to close a board case.'); return; }
  if(t.stake>S.money){ toast('You can\'t cover the £'+t.stake+' stake any more.'); return; }
  const ref=db.doc('cases/'+c.id);
  const lock=await ref.acquire({holder:S.pid, ttlMs:8000}); if(!lock.acquired){ toast('Someone else is closing this case. Try again in a moment.'); return; }
  const snap=await ref.get(); const d=snap.exists?snap.data():null;
  if(!d||d.status!=='open'){ delete S.taken[c.id]; S.caseId=D.cases[0].id; save(); closeSheet(); render(); toast(d&&d.status==='solved'?'Too late. '+(d.solvedByName||'Someone')+' closed it first.':'The maker withdrew this case.'); return; }
  const correct=sid===c.culprit;
  try{ await ref.update({status:'solved', solvedBy:S.pid, solvedByName:myName(), correct, solvedAt:Date.now()}); }catch(e){ toast('Could not close: '+(e.code||e.message)); return; }
  if(t.stake){ if(correct) addMoney(t.stake); else { addMoney(-t.stake); await credit(t.maker, 2*t.stake, 'your case "'+String(c.title).slice(0,24)+'"'); } }
  S.solved[c.id]={guess:sid, correct, pay:correct?t.stake:0, wager:t.stake, broken:correct&&I.broken, asked:nAsked(c.id), player:true};
  t.done=true; save();
  showVerdict(c, sid, correct, correct?t.stake:0, false, t.stake && !correct ? 'You lose your £'+t.stake+' to '+esc(t.makerName)+'.' : (t.stake&&correct?'£'+t.stake+' from '+esc(t.makerName)+"'s stake.":''));
}

/* ----- co-op ----- */
function coopRef(code){ return db.doc('coop/'+code); }
async function createCoop(){
  if(!ONLINE) return toast('Co-op needs the online version.');
  const c=cur(); if(S.taken[c.id] && S.taken[c.id].stake>0) return toast('Co-op works on story cases and free board cases, not wagers.');
  const code=rid(4).toUpperCase().replace(/[^A-Z0-9]/g,'X'); const doc={code, host:S.pid, hostName:myName(), caseId:c.id, kind:isStory(c.id)?'story':'player', caseData:c, members:{[S.pid]:myName()}, inv:{asked:{},presses:[],revealed:{},broken:false}, proposal:null, result:null, createdAt:Date.now()};
  await coopRef(code).set(doc); S.coop={code}; save(); joinCoop(code,true); pushPresence(); toast('Room '+code+' open.');
}
async function joinCoop(code, resume){
  if(!ONLINE) return toast('Co-op needs the online version.'); code=String(code||'').trim().toUpperCase(); if(!code) return;
  const ref=coopRef(code); const snap=await ref.get(); if(!snap.exists){ toast('No room '+code+'.'); if(resume){ S.coop=null; save(); } return; }
  const d=snap.data(); if(d.result && !resume){ toast('That room has already made its arrest.'); return; }
  if(!d.members[S.pid]){ const members={...d.members,[S.pid]:myName()}; await ref.update({members}); }
  S.coop={code}; save(); if(unsubCoop) unsubCoop();
  unsubCoop=ref.onSnapshot(s=>{ if(!s.exists){ leaveCoop(true); return; } COOP=s.data(); onCoopUpdate(); render(); }, e=>{ toast('Room lost: '+e.code); leaveCoop(true); });
  pushPresence(); S.tab='desk'; render();
}
async function leaveCoop(silent){
  const code=S.coop&&S.coop.code; if(unsubCoop){ unsubCoop(); unsubCoop=null; }
  if(code && ONLINE && COOP && COOP.members && COOP.members[S.pid] && !COOP.result){ try{ const members={...COOP.members}; delete members[S.pid]; await coopRef(code).update({members}); }catch(e){} }
  S.coop=null; COOP=null; save(); pushPresence(); if(!silent) toast('Left the room.'); render();
}
async function coopUpdateInv(mut){ if(!COOP) return; const I=JSON.parse(JSON.stringify(COOP.inv||{asked:{},presses:[],revealed:{},broken:false})); mut(I); COOP.inv=I; try{ await coopRef(S.coop.code).update({inv:I}); }catch(e){ toast('Could not sync: '+(e.code||e.message)); } }
async function coopPropose(sid){ if(!COOP||COOP.result) return; await coopRef(S.coop.code).update({proposal:{sid, by:S.pid, byName:myName(), votes:{[S.pid]:true}}}); }
async function coopVote(yes){ if(!COOP||!COOP.proposal) return; const p={...COOP.proposal, votes:{...COOP.proposal.votes}}; if(yes){ p.votes[S.pid]=true; await coopRef(S.coop.code).update({proposal:p}); } else await coopRef(S.coop.code).update({proposal:null}); }
async function onCoopUpdate(){
  const d=COOP; if(!d) return;
  // proposer finalises when every member has agreed
  if(d.proposal && !d.result && d.proposal.by===S.pid){ const members=Object.keys(d.members||{}); if(members.every(m=>d.proposal.votes[m])){ const c=d.caseData; const correct=d.proposal.sid===c.culprit; try{ await coopRef(S.coop.code).update({result:{sid:d.proposal.sid, correct, by:S.pid, at:Date.now()}, proposal:null}); }catch(e){} if(d.kind==='player' && db){ try{ const ref=db.doc('cases/'+c.id); const snap=await ref.get(); if(snap.exists&&snap.data().status==='open') await ref.update({status:'solved', solvedBy:S.pid, solvedByName:Object.values(d.members).join(' & '), correct, solvedAt:Date.now()}); }catch(e){} } } }
  if(d.result && !S.coopApplied[d.code]){ S.coopApplied[d.code]=true; const c=d.caseData; const r=d.result; const already=!!S.solved[c.id];
    const broken=r.correct && (d.inv&&d.inv.broken); const pay=(!already && r.correct && isStory(c.id)) ? c.reward+(broken?R.breakBonus:0) : 0;
    if(!already){ S.solved[c.id]={guess:r.sid, correct:r.correct, pay, broken, asked:nAsked(c.id), coop:d.code}; if(S.taken[c.id]) S.taken[c.id].done=true; }
    if(pay) addMoney(pay); save(); showVerdict(c, r.sid, r.correct, pay, broken, already?'You had already closed this file yourself; no second pay.':'Shared with '+esc(Object.values(d.members).filter(n=>n!==myName()).join(', ')||'nobody')+'.'); }
}

function openSuspect(sid, keepScroll){

function applyAsk(I, sid, qi){ I.asked[sid]=I.asked[sid]||[]; if(!I.asked[sid].includes(qi)) I.asked[sid].push(qi); }
function applyPress(I, c, sid, evId){ const s=sus(c,sid); const hit=s.press.keys.includes(evId); I.presses.push({sid, ev:evId, hit, by:myName()}); if(hit){ I.revealed[sid]=true; if(sid===c.culprit) I.broken=true; } return hit; }
async function doAsk(sid, qi){

  if(inCoop()){ if(((COOP.inv.asked||{})[sid]||[]).includes(qi)) return; SFX.play('scratch'); await coopUpdateInv(I=>applyAsk(I,sid,qi)); openSuspect(sid,true); return; }
  const I=localInv(c.id); const before=(I.asked[sid]||[]).length; applyAsk(I,sid,qi); if((I.asked[sid]||[]).length>before) SFX.play('scratch'); openSuspect(sid,true);

async function doPress(sid, evId){

function arrest(sid){
  const c=cur(); if(S.solved[c.id]) return; if(!isStory(c.id)){ resolvePlayerCase(c, sid); return; }
  const I=localInv(c.id); const correct=sid===c.culprit; const broken=correct && I.broken;
  const pay=correct?c.reward+(broken?R.breakBonus:0):0; if(pay) addMoney(pay);

}

function editorHTML(){
  const mid=S.editing; const m=mid&&S.made[mid];
  if(!m){ return `<div class="card-note"><h2>Make a case</h2><p>Write a file, four suspects with three answers each, and decide who did it. Give the killer a tell: a statement or a police fact that breaks them when pressed. Give one innocent a lie of their own if you like. Then post it to the board, with money on it or free.</p><p>Right answers pay the detective your stake. Wrong answers pay you theirs. You need the stake in your purse to post; they need it to take the case on.</p><div class="row"><button class="btn" data-act="newdraft">New case</button>${Object.keys(S.made).length?'<button class="btn ghost" data-act="ctab" data-ctab="mine">My drafts</button>':''}</div></div>`; }

    h+=`<div class="eyebrow" style="margin-top:14px">Suspect ${i+1} <label class="cul"><input type="radio" name="culprit" data-path="culprit" value="${s.id}" ${c.culprit===s.id?'checked':''}> did it</label></div>`;
    h+=field('suspects.'+i+'.name','Name',s.name)+field('suspects.'+i+'.age','Age',s.age)+field('suspects.'+i+'.job','Occupation or relation',s.job)+field('suspects.'+i+'.look','How they look',s.look,{ph:'Tall, nervous, a burned hand'})+field('suspects.'+i+'.note','What the file says about them',s.note,{area:true});

    h+=field('suspects.'+i+'.press.answer','What they say when it lands',s.press.answer,{area:true,ph:s.id===c.culprit?'The confession.':'The secret they were hiding instead.'})+field('suspects.'+i+'.press.miss','What they say to a bad press',s.press.miss,{ph:'A shrug, in their voice.'});

/* ---------- Sound effects (synthesised) ---------- */
const SFX=(()=>{
  let ctx=null, master=null, amb=null, ambNodes=null, tickTimer=null, noiseBuf=null;
  const on=()=>S.sfx!==false;
  function get(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC(); master=ctx.createGain(); master.gain.value=.6; master.connect(ctx.destination); amb=ctx.createGain(); amb.gain.value=0; amb.connect(ctx.destination); } if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function noise(){ const c=get(); if(!noiseBuf){ const n=c.sampleRate*2, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; noiseBuf=b; } return noiseBuf; }
  function burst({dur=.2,type='bandpass',f0=1000,f1=null,q=1,g=.3,at=0,attack=.005}){ const c=get(); if(!c) return; const src=c.createBufferSource(); src.buffer=noise(); src.loop=true; const fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q; const t=c.currentTime+at; fl.frequency.setValueAtTime(f0,t); if(f1) fl.frequency.exponentialRampToValueAtTime(f1,t+dur); const gn=c.createGain(); gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+attack); gn.gain.exponentialRampToValueAtTime(.0005,t+dur); src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t); src.stop(t+dur+.05); }
  function tone({f=440,f1=null,dur=.3,g=.3,type='sine',at=0}){ const c=get(); if(!c) return; const o=c.createOscillator(); o.type=type; const t=c.currentTime+at; o.frequency.setValueAtTime(f,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); const gn=c.createGain(); gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+.004); gn.gain.exponentialRampToValueAtTime(.0005,t+dur); o.connect(gn); gn.connect(master); o.start(t); o.stop(t+dur+.05); }
  const fx={
    paper(){ burst({dur:.28,f0:1400,f1:500,q:.8,g:.22,attack:.03}); },
    scratch(){ [0,.07,.15].forEach(at=>burst({dur:.05,type:'highpass',f0:2200,g:.12,at})); },
    page(){ burst({dur:.16,f0:3000,f1:1200,q:.7,g:.16,attack:.01}); },
    stamp(){ tone({f:95,f1:45,dur:.22,g:.7}); burst({dur:.05,type:'lowpass',f0:700,g:.45}); },
    clank(){ [1250,1870,2630,3390].forEach((f,i)=>tone({f:f*(1+(Math.random()-.5)*.01),dur:.55-i*.08,g:.12,type:'triangle'})); burst({dur:.08,type:'highpass',f0:1500,g:.2}); tone({f:140,f1:70,dur:.25,g:.3,at:.02}); },
    coin(){ tone({f:4200,dur:.14,g:.16}); tone({f:5700,dur:.12,g:.1}); tone({f:4600,dur:.16,g:.14,at:.1}); tone({f:6100,dur:.14,g:.08,at:.1}); },
    drawer(){ burst({dur:.32,type:'lowpass',f0:500,f1:150,g:.35,attack:.02}); tone({f:70,f1:40,dur:.14,g:.4,at:.28}); },
    knock(){ tone({f:180,f1:120,dur:.13,g:.4}); burst({dur:.03,type:'lowpass',f0:1200,g:.3}); }
  };
  function play(name){ if(!on()) return; try{ if(!get()) return; fx[name]&&fx[name](); }catch(e){} }
  function ambience(want){
    try{ const c=get(); if(!c) return;
      if(want && !ambNodes){
        const src=c.createBufferSource(); src.buffer=noise(); src.loop=true; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; const rain=c.createGain(); rain.gain.value=.05;
        const lfo=c.createOscillator(); lfo.frequency.value=.08; const lfoG=c.createGain(); lfoG.gain.value=.02; lfo.connect(lfoG); lfoG.connect(rain.gain);
        src.connect(lp); lp.connect(rain); rain.connect(amb); src.start(); lfo.start();
        let tock=false;
        tickTimer=setInterval(()=>{ if(c.state!=='running') return; const t=c.currentTime+.02; const s2=c.createBufferSource(); s2.buffer=noise(); const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=tock?2600:3400; f.Q.value=6; const g=c.createGain(); g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0005,t+.03); s2.connect(f); f.connect(g); g.connect(amb); s2.start(t); s2.stop(t+.05); tock=!tock; },1000);
        ambNodes={src,lfo}; amb.gain.setTargetAtTime(1,c.currentTime,.8);
      } else if(!want && ambNodes){ amb.gain.setTargetAtTime(0,c.currentTime,.4); clearInterval(tickTimer); const n=ambNodes; ambNodes=null; setTimeout(()=>{ try{ n.src.stop(); n.lfo.stop(); }catch(e){} },1500); }
    }catch(e){}
  }
  return {play, ambience, unlock:()=>{ try{ get(); }catch(e){} }};
})();

  let h=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Co-op room</h3><p class="sub">Work a case together</p>`;
  if(!ONLINE) h+=`<p>Co-op needs the game opened through its claude.ai link, so the room can be shared.</p>`;
  else h+=`<p>Open a room on the case you have on the desk and give the code to another detective. You share one budget of questions and presses, see each other's work as it happens, and must all agree before the warrant is signed. Story cases pay everyone; free board cases work too; wagers don't.</p><div class="row"><button class="btn" data-act="coopcreate">Open a room on “${esc(cur().title)}”</button></div><p class="sub" style="margin-top:16px">Or join one</p><div class="row"><input id="joincode" class="code-in" placeholder="CODE" maxlength="4" autocapitalize="characters"><button class="btn ghost" data-act="coopjoin">Join</button></div>`;
  h+=`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="closesheet">Back</button></div>`;
  $('#sheet').innerHTML=h; $('#sheet').classList.add('open'); $('#scrim').classList.add('on');
}

/* ---------- Events ---------- */
let ambStarted=false;
document.addEventListener('click',e=>{
  if(!ambStarted && S.amb && !S.intro){ ambStarted=true; SFX.ambience(true); }
  if(musicWanted && !S.intro && !audio.src && !e.target.closest('[data-act="music"]')) playTrack(S.track||0);
  const tab=e.target.closest('nav.tabs button'); if(tab){ S.tab=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const ct=e.target.closest('[data-ctab]'); if(ct && !e.target.closest('[data-act]')){ S.casesTab=ct.dataset.ctab; render(); return; }
  if(e.target.id==='scrim'){ closeSheet(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(act==='intro'){ S.intro=false; SFX.unlock(); SFX.play('paper'); render(); if(S.amb) SFX.ambience(true); }
  else if(act==='sound'){ openSound(); }
  else if(act==='toggle'){ const k=a.dataset.k; if(k==='sfx'){ S.sfx=!(S.sfx!==false); if(S.sfx) SFX.play('knock'); } else if(k==='amb'){ S.amb=!S.amb; SFX.ambience(!!S.amb); } else if(k==='music'){ toggleMusic(); } save(); updateSoundUI(); setTimeout(openSound,k==='music'?150:0); }
  else if(act==='tab'){ S.tab=a.dataset.tab; render(); window.scrollTo(0,0); }
  else if(act==='ctab'){ S.casesTab=a.dataset.ctab; S.tab='cases'; render(); }
  else if(act==='suspect'){ SFX.play('paper'); openSuspect(a.dataset.id,false); }
  else if(act==='ask'){ doAsk(a.dataset.id, +a.dataset.q); }
  else if(act==='pressmenu'){ pressMenu(a.dataset.id); }
  else if(act==='press'){ doPress(a.dataset.id, a.dataset.ev); }
  else if(act==='accuse'){ confirmAccuse(a.dataset.id); }
  else if(act==='arrest'){ arrest(a.dataset.id); }
  else if(act==='cooppropose'){ coopPropose(a.dataset.id); closeSheet(); }
  else if(act==='coopvote'){ coopVote(a.dataset.v==='1'); }
  else if(act==='coopmenu'){ openCoopMenu(); }
  else if(act==='coopcreate'){ closeSheet(); createCoop(); }
  else if(act==='coopjoin'){ const v=$('#joincode')&&$('#joincode').value; closeSheet(); joinCoop(v,false); }
  else if(act==='coopleave'){ leaveCoop(false); }
  else if(act==='rename'){ const n=prompt('Your name on the board and in rooms:', S.name||''); if(n!==null){ S.name=n.trim().slice(0,24); save(); pushPlayer(); pushPresence(); if(inCoop()&&COOP.members[S.pid]!==myName()){ const members={...COOP.members,[S.pid]:myName()}; coopRef(S.coop.code).update({members}).catch(()=>{}); } render(); } }
  else if(act==='account'){ openAccount(); }
  else if(act==='login'){ accountAction('login'); }
  else if(act==='register'){ accountAction('register'); }
  else if(act==='signout'){ if(confirm('Sign out? This device goes back to a fresh guest; your progress stays with the account.')){ closeSheet(); signOut(); } }
  else if(act==='closesheet'){ closeSheet(); }
  else if(act==='opencase'){ if(inCoop()){ toast('Leave the co-op room first.'); return; } if(unlocked(a.dataset.id) && getCase(a.dataset.id)){ SFX.play('paper'); S.caseId=a.dataset.id; S.tab='desk'; closeSheet(); render(); window.scrollTo(0,0); } }
  else if(act==='take'){ takeCase(a.dataset.id); }
  else if(act==='newdraft'){ const c=blankCase(); const mid='m'+rid(6); S.made[mid]={c, stake:0, published:null, createdAt:Date.now()}; S.editing=mid; save(); render(); }
  else if(act==='edit'){ S.editing=a.dataset.id; S.casesTab='make'; render(); window.scrollTo(0,0); }
  else if(act==='deldraft'){ if(confirm('Delete this draft?')){ delete S.made[a.dataset.id]; if(S.editing===a.dataset.id) S.editing=null; save(); render(); } }
  else if(act==='closeeditor'){ S.editing=null; S.casesTab='mine'; save(); render(); }
  else if(act==='publish'){ publishCase(a.dataset.id, $('#stake')&&$('#stake').value); }
  else if(act==='withdraw'){ withdrawCase(a.dataset.id); }
  else if(act==='buy'){ const d=D.decor.find(x=>x.id===a.dataset.id); if(d && S.money>=d.price && !S.owned.includes(d.id)){ addMoney(-d.price); S.owned.push(d.id); SFX.play('coin'); setTimeout(()=>SFX.play('knock'),220); toast(d.name+' bought.'); render(); } }
  else if(act==='buyhand'){ const x=D.hands.find(y=>y.id===a.dataset.id); if(x && S.money>=x.price && !S.owned.includes('hand:'+x.id)){ addMoney(-x.price); S.owned.push('hand:'+x.id); S.hand=x.id; SFX.play('coin'); setTimeout(()=>SFX.play('page'),200); toast(x.name+' bought and in use.'); render(); } }
  else if(act==='usehand'){ S.hand=a.dataset.id; SFX.play('page'); render(); }
  else if(act==='music'){ toggleMusic(); }
  else if(act==='nexttrack'){ playTrack((S.track||0)+1); }
  else if(act==='ack'){ S.tutAck=true; render(); }
  else if(act==='skiptut'){ S.tut=null; render(); }
  else if(act==='reset'){ if(confirm('Start over from the first case? Purse, desk and notebook go too. Your name and board identity stay.')){ const keep={pid:S.pid,name:S.name}; S=Object.assign(fresh(),keep); save(); pushPlayer(); render(); } }
});
document.addEventListener('input',e=>{
  if(e.target.id==='nb'){ S.notebook=e.target.value; save(); return; }
  const p=e.target.dataset && e.target.dataset.path; if(p && S.editing && S.made[S.editing]){
    const c=S.made[S.editing].c; let v=e.target.value;
    if(p.endsWith('press.keys')) v = v? [v] : [];
    setPath(c,p,v); save();
    if(e.target.tagName==='SELECT' || e.target.type==='radio') render();
  }
});
document.addEventListener('change',e=>{ const p=e.target.dataset && e.target.dataset.path; if(p && (e.target.type==='radio'||e.target.tagName==='SELECT') && S.editing){ const c=S.made[S.editing].c; let v=e.target.value; if(p.endsWith('press.keys')) v=v?[v]:[]; setPath(c,p,v); save(); render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
render();
initNet();
})();
</script>
