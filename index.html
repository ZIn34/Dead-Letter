<script id="game-data" type="application/json">
{"rules":{"questions":8,"presses":3,"breakBonus":2},"cases":[{"id":"bell","title":"The Yard Behind the Bell","reward":4,"brief":{"victim":"Dennis Quaile, 31, cooper's mate","weapon":"A cooper's mallet, found in the rain barrel. Marked T.V.","time":"Between eleven and midnight, Tuesday","place":"The yard behind the Drowned Bell, Quay Street","public":"\"A dock labourer found dead behind the Drowned Bell; foul play suspected.\" Nothing about a mallet, nothing about the barrel.","facts":["Struck once, from behind, with a cooper's mallet marked T.V. The mallet has been mentioned to nobody outside this office except Teddy Vane, who was shown it at seven this morning to identify.","The yard gate onto Quay Street was bolted from inside. The only other way into the yard is through the taproom.","The rain barrel was full. Whoever pushed the mallet under got a sleeve wet to the elbow."]},"questions":["Where were you between eleven and midnight?","How did you know Dennis Quaile?","What do you know about how he died?","Who else was around the Bell that week?"],"suspects":[{"id":"kell","name":"Marta Kell","age":52,"job":"landlady of the Drowned Bell","color":"#6b4a3a","look":"Broad, quick, a bar-towel over one shoulder.","note":"Has run the Bell for twenty years. Twenty drinkers saw her behind the bar until she rang the bell at midnight.","answers":["Behind my own bar till I rang midnight; twenty men saw me. Lil went out the back at eleven, white as a sheet, and I covered a quarter hour for her.","He drank here and paid, mostly. He owed Sam Rooney two pound and Rooney let the whole bar know it. Rooney's in the cannery dormitory this week, and Grady bolts that door at ten, so if he tells you he was tucked up by eleven, ask him how he got in.","Only what the constable told me: found in my yard this morning. Nobody uses that yard but me and the barrels.","Regulars, the brewer's dray, and the gentleman from Harrowgate who rents my back room by the quarter. Mr Coyle. Keeps odd hours, pays in gold, and I don't ask. A landlady who asks doesn't keep gentlemen."],"press":{"keys":[],"miss":"Press me all you like. I've twenty witnesses and a bar to run."}},{"id":"rooney","name":"Sam Rooney","age":27,"job":"dock hand","color":"#3f5560","look":"Big hands, small eyes, a fresh scrape across the right knuckles.","note":"Quaile owed him two pounds since the spring. Sleeps in the cannery dormitory when he is working, which this week he is.","answers":["In my bunk at the dormitory by eleven. Slept like the dead.","He owed me two pound and he'd have paid it. No sense killing a man who owes you money.","I don't know anything about any mallet, and I'll thank you not to say I do.","Same faces. Vane came by Wednesday shouting about his mallet and nobody took it seriously."],"press":{"keys":["f0","kell:1","lil:press"],"answer":"Nobody said mallet? Marta said... no. The constable, then. — Fine. He laughed at me. In the yard, over two pound, he laughed. I only meant to frighten him. The barrel was to hide it, and my sleeve's still damp if you want to feel it.","miss":"That's nothing. You've got nothing."}},{"id":"vane","name":"Teddy Vane","age":40,"job":"cooper, Quaile's brother-in-law","color":"#7a6a2e","look":"Sawdust in his beard, a limp from an old dropped cask.","note":"Employed Quaile. Owns a set of mallets marked T.V.; reported one stolen from his Quay Street yard a week ago.","answers":["Home in Gull Lane with my wife, his sister. She'll tell you. She'll tell you at length.","I married his sister and gave him work, and he was bad at it, and I kept him on anyway.","The constable showed me the mallet at seven this morning; it's mine. I reported it gone last Wednesday and there's a note to say so.","Quaile's sister came to my yard Tuesday to beg a week's wages early for him. I gave it. He drank it here that night."],"press":{"keys":[],"miss":"The constable showed it to me himself. Ask him. I've a note about the theft with a date on it."}},{"id":"lil","name":"Lil Marr","age":19,"job":"barmaid","color":"#5a3f5e","look":"Small, tired, a cannery hand's roughened palms.","note":"Serves at the Bell four nights a week. Quaile had been pestering her; Marta had warned him off.","answers":["Serving. I never left the taproom till we'd cleared the glasses.","He wouldn't leave me be. Marta told him if he touched me again she'd bar him. That was Sunday.","Somebody hit him, they say. Good. I'm sorry, but good.","The Harrowgate gent. He watches the door and never his glass. He tipped me a shilling to tell him which nights Constable Penhale drinks here."],"press":{"keys":["kell:0"],"secret":true,"answer":"All right. I went out to the yard at eleven to be sick. I'm carrying, and it was his, and he laughed about that too. When I came back in through the taproom door Sam Rooney was going out through it, and when he came back his right sleeve was wet to the elbow. I said nothing. I was glad.","miss":"I was serving. Ask anyone."}},{"id":"cobb","name":"Amos Cobb","age":45,"job":"brewery drayman","color":"#4b5d4a","look":"Leather apron, a horse smell, forearms like knotted rope.","note":"Delivers casks to the Bell's yard every Tuesday evening and drinks his pay after. Was in the yard with the dray until half past ten.","answers":["Loading empties in the yard till half past ten, then in the taproom till Marta rang. Ask the horse.","Knew him to nod at. He helped me roll casks once for a pint and dropped one on his own foot.","Marta said foul play and the constable said nothing at all, so that's the whole of what I know.","Vane came Wednesday about a mallet. And on Tuesday a man in a good coat asked me what time the yard gate gets bolted. I told him: when Marta says."],"press":{"keys":[],"miss":"I've a dray to see to."}}],"culprit":"rooney","solution":"Rooney knew a mallet had been used when nobody had told him; the Gazette said only foul play, and only Vane had been shown it. His bunk was behind a door Grady bolts at ten. Lil Marr, once she admitted why she left the taproom, had seen him come back from the yard with his sleeve wet to the elbow, where the barrel was. Vane's stolen mallet was stolen by the man who shared his yard. The man in the good coat who asked Cobb about the gate is another matter, and not this case's.","arrest":"Rooney goes quietly, which surprises everyone but Marta."},{"id":"loft","title":"The Sailmaker's Loft","reward":5,"cold":{"bell":"Sam Rooney, released in the Quaile matter for want of evidence, has left town owing the Bell four shillings."},"brief":{"victim":"Nathaniel Crewe, 58, sail merchant from Harrowgate","weapon":"A sailmaker's needle, driven in under the ribs","time":"Between five and six in the morning, Thursday","place":"The loft above Thorne's sail shop, 8 Rope Walk","public":"\"A visiting merchant found dead in a Rope Walk loft.\" No weapon, no hour.","facts":["The loft's inside stair was taken down on Wednesday for rebuilding. Since then the only way up is by ladder.","Rain fell steadily from four until seven.","Crewe had come to buy Thorne's shop. The papers were on the table, unsigned, and his pocket-book is missing."]},"questions":["Where were you between five and six?","What was your business with Nathaniel Crewe?","How did you learn he was dead?","Anyone unusual on Rope Walk lately?"],"suspects":[{"id":"thorne","name":"Agnes Thorne","age":61,"job":"sailmaker","color":"#4b5d4a","look":"Thimble-scarred fingers; she does not sit still.","note":"Has made sail on Rope Walk for forty years. Crewe's offer would have made her his employee in her own shop.","answers":["In my bed at the back of the shop, under the loft. I heard a ladder go up against the wall at five and thought it was Kessler's boys.","He wanted my shop and he'd have had it, the way things are. I told him I'd think on it. I was thinking on it.","Two voices overhead, a little after five. One was Crewe. The other had that flat up-coast way of talking. Then nothing. I went up at first light and found him.","A Harrowgate man came in on Monday's packet with Crewe and stood in my shop pricing canvas by the yard as if he meant to buy the street. Crewe called him Coyle, and Crewe was frightened of him."],"press":{"keys":[],"miss":"I've told you what I heard. I'm too old to climb ladders in the rain for a man I could have outlived."}},{"id":"piet","name":"Piet Hallam","age":24,"job":"yard hand, the baker's brother","color":"#8a7040","look":"Flour to the elbows, even now.","note":"Works nights at the boatyard and mornings at his sister's ovens. Crewe had refused him a berth on a Harrowgate boat last year and said why, loudly.","answers":["At the ovens from four, like every morning. Ines will swear to it.","He called me a thief once in front of a crew, over a coil of rope I never took. I hadn't spoken to him since.","Ines told me when I came off the ovens at seven. The whole street had it by then.","The Harrowgate man. He asked me at the yard whether the night boats still use Kessler's slip. I said I wouldn't know. I would."],"press":{"keys":["kessler:2"],"secret":true,"answer":"I went to tell him what I thought of him. From the street; there was no way up and I wouldn't have gone if there were. He put his head out of the window and laughed and I went back to the ovens by a quarter to five. Ines says I never left because I asked her to say it.","miss":"I was at the ovens. Ask my sister."}},{"id":"dunn","name":"Cornelius Dunn","age":35,"job":"Crewe's clerk","color":"#4a4f6b","look":"Up-coast vowels; a good coat, damp at the hem.","note":"Kept Crewe's books for nine years. Rooms at the Drowned Bell. Stood to lose his place if Crewe's business failed, which it was doing.","answers":["Asleep at the Bell until eight. I'd been in the taproom until two. Mrs Kell will remember; she remembers everyone's tab.","I kept his books for nine years. He was a hard man to keep books for, latterly.","I went up at eight with the day's letters. I came up the stair and there he was, on the floor by the table. I sent the boy for the constable.","Mr Coyle. Crewe's backer, after a fashion; he was to sign as guarantor for Thorne's shop. Crewe's death saved him a signature. I mention it because you'll hear it anyway."],"press":{"keys":["f0","kessler:0","thorne:2"],"answer":"The stair. Yes. I mean the ladder; one says stair from habit. — No. I was there at five. He was going to sign for the shop, and he'd have had the books audited by Michaelmas, and there are nine years in those books that would hang me. The needle was on the table. His pocket-book is up the Bell's chimney.","miss":"I found him. That is the whole of my part in it."}},{"id":"kessler","name":"Ruth Kessler","age":44,"job":"boatwright","color":"#6b3f3f","look":"Forearms like hawsers; smells of pitch.","note":"Her yard supplied the ladder. She had quarrelled with Crewe over an unpaid bill for a mast.","answers":["At my forge from five. My boys carried the ladder round to Thorne's at five and were back by ten past. Nobody went up that loft before five unless they flew.","He owed me eleven pounds for a mizzen since March. I'd have had it out of his hide, but not with a needle.","Piet Hallam was in Rope Walk at half past four with flour on him, shouting up at the loft window like a fool. My boys passed him going for the ladder.","Coyle. He signed my yard book: from Harrowgate. Asked what a mizzen costs and whether my slip can take a forty-footer at night. I said the slip takes what the tide lets it."],"press":{"keys":[],"miss":"Ask my boys. Ask anyone on Rope Walk who heard my hammer."}},{"id":"ines","name":"Ines Hallam","age":30,"job":"baker, Piet's sister","color":"#8a7040","look":"Flour in her hair, eyes that have been up since four.","note":"Covers for her brother without being asked. Crewe had offered to buy her ovens as well as Thorne's loft, and she had refused him in front of the whole street.","answers":["At my ovens from four, and Piet with me. From four, I said.","He wanted my shop as well as Agnes's. I told him where to put his offer in front of half of Rope Walk.","The Kessler boy ran past shouting at eight. I put my head out and saw the ladder still against Agnes's wall, dripping.","A gentleman in a good coat bought a loaf on Wednesday and asked which loft was the sailmaker's. He paid in gold. Who pays for a loaf in gold?"],"press":{"keys":["kessler:2"],"secret":true,"answer":"Piet wasn't with me from four. He went out at half past four to shout at Crewe and came back at a quarter to five with rain on him and no sense. He was here when the ladder went up; I'd swear to that in church. I said 'from four' because a brother is a brother.","miss":"I bake. I don't watch lofts."}}],"culprit":"dunn","solution":"Dunn said he came up the stair. There was no stair, and anyone who climbed to that loft on Thursday climbed a ladder in the rain, which is why his coat hem was damp. Kessler's boys set the ladder at five; Agnes heard an up-coast voice overhead just after. Piet Hallam lied about where he was, but he was in the street shouting at a window he couldn't reach, and the boys saw him. Crewe's signature would have put Dunn's nine years of books in front of an auditor.","arrest":"Dunn asks to fetch his good hat. He is not allowed."},{"id":"light","title":"The Light Went Out","reward":6,"cold":{"loft":"Cornelius Dunn, released in the Crewe matter, took the up-coast packet on Friday with a heavy bag. Thorne's shop is his, on paper."},"brief":{"victim":"Pieter Voss, 66, lighthouse keeper","weapon":"None. A fall of sixty feet from the lamp gallery onto the rock.","time":"Between nine and ten at night, Saturday","place":"The lighthouse, off the end of Gull Lane","public":"\"The keeper fell from the rocks while fishing.\" Nothing else has been said outside this office.","facts":["Voss went from the lamp gallery, not the rocks: the gallery door was open and his pipe was on the rail. The Gazette was told 'fishing' on purpose.","The harbourmaster's log records the light going out at 9:40, and the Halcyon, inbound, sheering off the rock with feet to spare.","A wire from the Board was delivered to the rock that evening. Its contents are not yet known to this office."]},"questions":["Where were you between nine and ten?","What did Pieter Voss mean to you?","What do you think happened to him?","Has anything odd happened on the rock lately?"],"suspects":[{"id":"jonas","name":"Jonas Voss","age":33,"job":"nephew, assistant keeper","color":"#3f5560","look":"Tall, wind-reddened, hands in his pockets.","note":"Next in line for the keeper's post and the cottage. Had asked the Board twice to retire his uncle. The Board had refused twice.","answers":["The Weavers' Arms, from eight until Pike put me out at eleven. Up the hill. I saw nothing.","My uncle taught me the lamp. He should have given it up five years ago and I said so to his face.","He'd no business out on the gallery in that wind at his age. He'll have leaned on the rail for his pipe and gone over. I told him. I told him a dozen times.","Boats. Lights on the water at hours when no honest boat is out, and my uncle logging them and then tearing the page out. He said the Board wouldn't want to know."],"press":{"keys":["f0","winn:1","brid:press"],"answer":"The rail, the pipe... everyone knows he smoked on the... No. All right. The wire said the Board had refused me a third time, on his word. He read it out to me on the gallery and he laughed, and I put my hand on his chest. I didn't mean it to be that easy. The light went out because I ran.","miss":"I was at the Arms. Ask Pike."}},{"id":"brid","name":"Bríd Nolan","age":70,"job":"brings the keeper his supper","color":"#5a3f5e","look":"Bent, sharp, a basket on her arm from habit.","note":"Has walked Voss's supper out along the causeway every evening for eleven years.","answers":["Home by half past eight. I left him his supper at eight and let myself out.","He was a kind man who never said two words together. I'll miss the quiet of him.","The rocks are wicked in the wet. But he didn't fish, whatever the paper says. He hadn't the patience.","A man came out along the causeway a fortnight ago in a good coat and gave Pieter an envelope. Pieter threw it in the sea in front of him. The man laughed and said there'd be another."],"press":{"keys":["winn:0"],"secret":true,"answer":"I stayed. I stayed most nights, if you want it plain, and at seventy I'll not be ashamed of it. I left when Winn came out with the wire, so as not to be seen, and passed him on the causeway at a quarter past. Pieter was alive and cursing the Board. And Jonas was at no public house: his lamp was coming along Gull Lane toward the rock as I went up it.","miss":"An old woman's evening is her own."}},{"id":"steel","name":"Captain Amos Steel","age":50,"job":"master of the barque Halcyon","color":"#6b4a3a","look":"Beard like a hedge; still shaking with anger.","note":"His ship came within feet of the rock when the light failed. Twenty crew swear he was on his own quarterdeck all night.","answers":["On my quarterdeck bringing her in, and then on my quarterdeck bringing her about with the rock under my bowsprit. Ask my crew. Ask my ship's paint.","Nothing, until his light went out and near killed forty men. I'd have had words with him. I never got the chance.","The light went out. That is all I know and all I care to. A keeper who lets his light go out has failed at the one thing.","My owners routed me by Saltmarsh on the word of a Harrowgate agent named Coyle, who promised the light would be 'attended to'. I took that to mean lit."],"press":{"keys":[],"miss":"Forty men and a logbook. Go away."}},{"id":"winn","name":"Clerk Winn","age":45,"job":"telegraphist","color":"#4b5d4a","look":"Ink on his cuffs; precise to the minute.","note":"Delivered a wire to the rock himself that evening, the telegraph boy being off sick.","answers":["On the rock at five past nine, off it by a quarter past, at my desk by half past. My log says so. I passed the Nolan woman on the causeway as I came off, which surprised me, at her age and that hour.","A customer. Four wires a year, all from the Board. I read them, of course. This one told him the Board had refused the nephew's application a third time, on the keeper's own advice.","Alive and trimming the wick when I left him at a quarter past. He said he'd smoke on the gallery and think about the nephew.","Wires from the Board, and one a month to a Mr Coyle, care of the Drowned Bell, from Harrowgate, always the same three words: 'Goods as arranged.' The landlady signs for them. I read them. One reads everything."],"press":{"keys":[],"miss":"My log is never wrong. Neither am I."}},{"id":"penhale","name":"Constable Penhale","age":29,"job":"the Gull Lane beat","color":"#3f5560","look":"Young, tidy, a notebook of his own.","note":"Walked Gull Lane that night. Had asked Voss twice about lights on the water and been told to mind the land.","answers":["On the lane from nine to ten. I saw the light go out at twenty to and ran for the causeway. I met nobody on it, but the north rocks are dry at low water and a man who knows them can come off that way. I've written that down.","A stubborn old man who knew more than he'd say. I liked him.","He was pushed, sir, or he fell. If he fell, why was the gallery door hooked open? He hated a draught.","Lights on the water. I've counted eleven nights this month and reported it to the Inspector twice. He tells me the customs house has it in hand. The customs house has Trask in it."],"press":{"keys":[],"miss":"It's all written down, sir. Ask for the book."}}],"culprit":"jonas","solution":"The Gazette said Voss fell from the rocks while fishing. Jonas described the gallery, the rail and the pipe before anyone told him. Winn's wire, read to Voss at nine, said the Board had refused Jonas again on his uncle's word. Bríd Nolan, once she admitted she was there, saw Jonas's lamp coming along Gull Lane toward the rock as she left it. He was not at the Arms.","arrest":"Jonas asks who will light the lamp tonight. Nobody answers him."},{"id":"milk","title":"Milk in the Coffee","reward":7,"cold":{"light":"Jonas Voss keeps the light now. It has gone out twice this month and the Board has written to ask why."},"brief":{"victim":"Mr Selim, 60, proprietor of the Turk's Head","weapon":"Laudanum, a heavy dose, in his afternoon coffee","time":"Between three and four in the afternoon, Monday","place":"His own back table at the Turk's Head, Clock Square","public":"\"The coffee-house keeper died suddenly at his table.\" No mention of poison.","facts":["Selim took his coffee with milk, from a small jug that was his alone. The pot was shared with whoever sat at his table.","The jug is missing. It was on the table at three and gone when the constable arrived at half past four.","Laudanum is bitter. A heavy dose would be tasted in black coffee. In milk, less so."]},"questions":["Where were you between three and four?","How did you stand with Selim?","Do you take milk in your coffee?","Who else came to the Turk's Head that afternoon?"],"suspects":[{"id":"lisle","name":"Dr Lisle","age":55,"job":"apothecary","color":"#4a4f6b","look":"Stooped, dry, spectacles pushed up.","note":"Took coffee with Selim most afternoons at three. Sells laudanum, keeps a register, and is tired of being asked about it.","answers":["At Selim's table from three until a quarter past, then back to my shop. Daubeny took my chair when I left.","Friends, of a sort. I have few. He didn't mind a man who read at the table.","Black. Always. If you are asking about my register, and you will: I sold two ounces of laudanum that morning to Mrs Ashby, for her nerves, as I have every month this year. It is in the book.","The usual. And a Harrowgate gentleman at the window table who reads the Gazette and never orders twice. Selim said the man had asked to rent the back room on Thursday nights and been refused."],"press":{"keys":[],"miss":"I keep a register. That is the extent of my involvement with anybody's coffee."}},{"id":"ashby","name":"Mrs Ashby","age":48,"job":"draper, Selim's landlady","color":"#6b3f3f","look":"Tall, corseted, a tape measure round her neck.","note":"Owns the Turk's Head building and wants it for a larger shop. Had tried for a year to end Selim's lease, and failed. Supplies his milk under the lease.","answers":["In my shop, measuring Mrs Halloran for a mourning dress. The whole afternoon. She'll say so.","He was a tenant. A tidy one, I'll give him that. We had a disagreement about the lease and left it to the lawyers.","I never touch coffee. Nor laudanum, before you ask; I have never bought a drop of it in my life.","How would I know? I was in my shop, measuring."],"press":{"keys":["lisle:2","daubeny:2","tess:press"],"answer":"Lisle's book. Of course. I take it for my nerves, and I have nerves because that man sat in my building for eleven years drinking my milk. It was in the jug. The jug is in the harbour. I'd have had my shop by Christmas.","miss":"I have a witness for the whole afternoon and a solicitor for the rest of it."}},{"id":"yusuf","name":"Yusuf Selim","age":28,"job":"the son","color":"#7a6a2e","look":"His father's eyes, a newer coat.","note":"Wanted to sell the coffee house and go to London. They had quarrelled about it in front of customers.","answers":["Sending a wire to London at half past three. Winn has it in his book, timed. Then walking. I didn't come back in till five.","We fought. Fathers and sons. I wanted him to sell and rest, and he wanted to die at that table, and he did.","Black. He took milk; he was the only one who did. He said it was how his mother made it.","Mr Coyle. He offered my father money for the back room on Thursdays, for 'a card game'. Father said the Turk's Head was not the Drowned Bell. I wish he'd taken it; we'd have had money enough to stop fighting."],"press":{"keys":["daubeny:1"],"secret":true,"answer":"The wire was to a buyer in London. I'd been to the bank that morning to see if Rooke would lend against the lease so I could sell without him. I was going behind his back, yes. I was not poisoning him. Walking meant walking; I couldn't face him.","miss":"Winn has my wire. Timed."}},{"id":"daubeny","name":"Daubeny","age":63,"job":"printer, chess partner","color":"#3f5560","look":"Ink under every nail; a slow talker.","note":"Played chess with Selim every afternoon from three. Left at four when Selim said he felt unwell. Prints the Gazette.","answers":["At his table from three, when Lisle gave up his chair, till four. He said he felt heavy; I said go and lie down, and I went home.","Twenty years of chess. That afternoon he was off his game. His boy had been at the bank that morning asking Rooke about a loan against the lease, and Rooke had told him, and it sat on him.","Black. We drank from the one pot, the two of us, and I'm here. The girl from Ashby's brought his milk jug at three as always, and Mrs Ashby herself came across for the jug at four, which she never does. Said the girl had forgotten it.","The Gazette had a lawyer's letter last month threatening suit if we printed the name Coyle again. We had never printed it. I kept the letter. I keep everything."],"press":{"keys":[],"miss":"I drank from the pot. I'm here. Draw your own conclusions; I print them."}},{"id":"tess","name":"Tess","age":15,"job":"Mrs Ashby's shop girl","color":"#5a3f5e","look":"Thin, quick, a bruise on her wrist she keeps her cuff over.","note":"Carries the milk jug across the square at three every day. Frightened of her mistress, and of losing the place.","answers":["I took the jug over at three and went back to the shop. Mrs Ashby sent me to the warehouse for ribbon at half past and I was gone an hour.","He gave me a coffee bean to chew every day. Said it was for luck.","I don't drink coffee, sir. I carry it.","Nobody, sir. Only Mrs Ashby when I got back, coming across the square with the jug under her shawl. She said the girl had forgotten it, meaning me. I hadn't."],"press":{"keys":["daubeny:2"],"secret":true,"answer":"She sent me away on purpose. I know that now. She measured nobody that afternoon; Mrs Halloran was at her sister's in Harrowgate all week. I said nothing because she'd put me out, and I've nowhere. Please don't tell her I told you.","miss":"I only carry the jug, sir."}}],"culprit":"ashby","solution":"Only Selim took milk, and the jug vanished. Daubeny saw Mrs Ashby herself come for it at four, which she never does, while she swore she never left her shop. Dr Lisle's register has her buying two ounces of laudanum that morning, which she said she had never bought in her life. Yusuf was going behind his father's back to sell the lease, which is a betrayal but not a murder; his wire is timed at 3:35. Tess, once she dared, confirmed there was no Mrs Halloran in the shop that afternoon.","arrest":"Mrs Ashby asks to close the shop first. The shop stays open."},{"id":"pier","title":"A Shot on the Pier","reward":8,"cold":{"milk":"Mrs Ashby has taken the Turk's Head lease. The coffee is worse and nobody takes milk."},"brief":{"victim":"Constable Jory Penhale, 29, on guard over the seized Kittiwake","weapon":"A .38 revolver, one shot","time":"Half past midnight, Friday. The harbourmaster's log records the shot.","place":"The cannery pier, off Cannery Row","public":"\"A constable shot on the cannery pier.\" The revolver's recovery was not printed.","facts":["One shot, from the front, at close range. Penhale let his killer walk right up to him.","The revolver came out of the water off Kessler's slip at dawn: a .38, its number filed off, and under the grip the scratched letters S.M.","The tide was on the flood. Anything dropped off the pier's north side drifts to Kessler's slip."]},"questions":["Where were you at half past midnight?","What do you know about the revolver?","Did you see anyone on Cannery Row that night?","Who was really behind the Kittiwake?"],"suspects":[{"id":"marsh","name":"Solly Marsh","age":58,"job":"pawnbroker","color":"#5a3f5e","look":"Small, neat, fingers that never stop counting.","note":"Fled the Docks when Grady was arrested and came back a month later swearing his innocence. Paid the Kittiwake's berth for four years.","answers":["In my bed above the shop, with the door locked, as a man who has been threatened does.","A .38 came in, a .38 went out, to a customer who gave an initial. T. It's in my book. Half this town is an initial in my book.","I saw nothing. I heard the shot and put my head under the pillow, and I'd do it again.","Grady took orders. I took mine from a gentleman who drinks at the Bell and never pays for it. If I say his name out loud I won't see the assizes."],"press":{"keys":["ben:press","trask:1"],"answer":"Small man, long coat. There are a dozen... No. He was going to open the hold. There's four years of my money in that boat's ballast and Penhale had the key and a lantern and no sense. I walked up and asked him for a light. The 'T.' in my book was for Trask. Everyone would have believed it.","miss":"A pawnbroker's word against a pawnbroker's book. Read the book."}},{"id":"ben","name":"Ben Oduya","age":19,"job":"fishmonger's son","color":"#4b5d4a","look":"Tall, restless, in a blue coat.","note":"Was on the pier at eleven by his own admission, waiting for a girl who did not come. Knew Penhale from school.","answers":["On the pier till near midnight, then walking home along the Row. I was on Quay Street when the shot went. I ran back.","Nothing. I've never held one.","Running from the pier end toward Cannery Row, past me as I turned back. A small man in a long coat, hat down. He went into the dark by the pawnshop.","Penhale told me the week before that he'd counted the lights and written to the Inspector twice. He said if anything happened to him it'd be because he counted."],"press":{"keys":["trask:2"],"secret":true,"answer":"I wasn't on Quay Street. I was in the net loft with Maeve Trask, and you'll leave her name out of it; her father would kill us both. From the loft window I saw a man walk up the pier with his hands out like he was asking for something, and then the flash, and then he ran. Small, hat down. He turned in at the pawnshop door. Not past it. In.","miss":"I told you what I saw."}},{"id":"trask","name":"Constable Trask","age":38,"job":"Customs House, suspended","color":"#3f5560","look":"Tall, heavy, a moustache he is proud of.","note":"Named in Grady's confession as the customs man paid to look away. Suspended, not charged. Hated Penhale, who reported him.","answers":["In the Customs House, on the cot in the back room, where I've slept since my wife found out what Grady said. I heard the shot and got there second.","My service revolver is a .45, in Dace's safe since he suspended me. I never bought a .38 from Marsh or anyone. Look at me, then look at the man Oduya says he saw, then look at Marsh.","Nobody on the Row when I came down it. The net loft door was open, which it never is, and there was a lamp in it.","Grady was a foreman. Foremen don't run a coast. There's a man from Harrowgate who has the Bell's back room, and Dace won't hear his name from me, because Dace drinks there."],"press":{"keys":[],"miss":"I'm suspended, not stupid. I'd not shoot a man with a gun that has a shop's initials under the grip."}},{"id":"kessler2","name":"Ruth Kessler","age":44,"job":"boatwright","color":"#6b3f3f","look":"Forearms like hawsers; smells of pitch.","note":"Her yard is beside the pier. She found the revolver in the shallows at dawn and brought it in herself.","answers":["In my yard, working late on a hull. The forge was going. I heard the shot over it, just.","I found it at six, in a foot of water off my slip. I know what a filed number means. I took it straight to Dace.","Nobody on the Row. But a lantern went along the pier at half past twelve, walking, not running, toward the Kittiwake. And a second, smaller light behind it, kept low.","Coyle asked me in the spring whether the slip could take a forty-footer at night. I told you that when the merchant died and nobody listened."],"press":{"keys":[],"miss":"I found the gun. That's my part."}},{"id":"maeve","name":"Maeve Trask","age":17,"job":"the constable's daughter","color":"#7a6a2e","look":"Her father's height and her own mind.","note":"Was on Cannery Row that night. Reads her father's papers when he leaves them out, which is often now.","answers":["In the net loft with Ben Oduya. I'll say it if he won't. From the window I saw the flash.","My father's .45 is in Dace's safe. I know because I was with him when he handed it over, and he cried in the street after.","A small man. Not my father. My father is a lot of things.","He brings papers home. One says the Kittiwake's ballast is not iron. He was paid not to read it, and he read it anyway, and now he can't sleep."],"press":{"keys":[],"miss":"Ask my father. Then ask Dace why he drinks at the Bell."}}],"culprit":"marsh","solution":"The gun carries Marsh's own stock mark, and his ledger names a buyer who is nothing but an initial: 'T.', for Trask, who is six feet tall and moustached. Ben Oduya, once he admitted where he really was, watched a small man walk up to Penhale with his hands out, fire, and turn in at the pawnshop door, not past it. Marsh had four years of money in the Kittiwake's ballast and Penhale had the key to the hold.","arrest":"Marsh asks what the revolver will fetch. Nobody laughs."},{"id":"tower","title":"A Quarter Past Six","reward":10,"cold":{"pier":"Solly Marsh has reopened the pawnshop. Constable Trask has resigned and nobody has replaced Penhale on the pier."},"brief":{"victim":"E. Rooke, 51, manager of the Savings Bank","weapon":"His own gold watch chain, from behind","time":"Between six and seven in the evening, Wednesday","place":"The stair inside the clock tower, Clock Square","public":"\"The bank manager found dead in the clock tower.\" No cause given.","facts":["Strangled on the tower stair with his own chain. The mark runs upward: the killer stood on the step above and pulled. That takes height. Rooke was five feet eight.","The clock struck six. The quarter-past chime never sounded; the mechanism jammed at 6:15 and has not struck since.","Lucie Ferrand found him at seven when she came to wind. Rooke's tower key was in his pocket; the Vells' key was on its hook in the shop."]},"questions":["Where were you between six and seven?","What was your business with Rooke?","Did you hear the clock?","What do you know about 'the Committee'?"],"suspects":[{"id":"vell","name":"Auguste Vell","age":74,"job":"clockmaker","color":"#7a6a2e","look":"Bent, small, a watchmaker's glass on a ribbon.","note":"Holds the other tower key. Resented Rooke checking 'his' mechanism nightly. Cannot climb the tower stair without stopping four times.","answers":["In my shop, with my daughter, from five until Lucie came screaming across the square at seven.","He had the bank's tower key and no business with it. He'd go up at six and put his hands on my mechanism, and I'd hear from the shop how he handled the escapement.","Six, yes. Then nothing. I said to Marguerite, he's stopped it, the fool. I meant Rooke.","Old money left this square a long time ago. What's left is Haldane's and the bank's, and Rooke told me last week that the bank's is not the bank's."],"press":{"keys":[],"miss":"I can't climb that stair without stopping four times. Ask my knees."}},{"id":"lucie","name":"Lucie Ferrand","age":16,"job":"the clockmaker's granddaughter","color":"#5a3f5e","look":"Small, quick, oil on her fingers.","note":"Winds the clock at seven each evening. Found the body. Had argued with Rooke that morning about his 'interfering'.","answers":["At my school books at Mama's, on Mercer Row, until I went across to wind at seven. Mama was with me. I found him on the stair.","He treated the clock like a bank vault. I told him so on Monday. He told me I was a child.","It struck six while I was reading. It didn't strike the quarter. I noticed. I notice everything about that clock.","Rooke told me the ledgers had a name in them that would 'burn the Docks down'. He said it to frighten me off the clock. It didn't."],"press":{"keys":["coyle:2"],"secret":true,"answer":"I went up to have it out with him. He was on the stair oiling the ratchet as if he owned it. I said my piece and he laughed, and then someone was coming up below us, slow, and tall; I saw the top of a hat. I hid on the gallery landing and went down after they'd passed. I heard the quarter not strike from the square. I was on Mercer Row by twenty past. I didn't tell Mama.","miss":"I found him. I'd rather not have."}},{"id":"coyle","name":"Mr Coyle","age":45,"job":"'a corn factor, from up the coast'","color":"#4a4f6b","look":"Very tall, very calm, a heavy gold Albert across his waistcoat.","note":"Arrived Monday; rooms at the Turk's Head. Nobody in the corn trade has heard of him. Had called on Rooke twice about the seized ledgers.","answers":["Dining at the Turk's Head from half past five. The younger Selim served me. I was still at table at seven.","Business. I represent certain interests who had money in the ledgers Inspector Dace took. I asked Rooke whether copies existed. He said no. I believed him.","Six, from the dining room. I also saw the Ferrand girl cross the square to the tower at ten to six with her chin out, if that is of interest, and come back at a run a little after the quarter.","A word merchants use for a group of investors. I represent one. It meets where it likes."],"press":{"keys":["quint:3","lucie:3"],"secret":true,"answer":"The Committee is not up the coast. I carry its post and its money and I am tired of both. It sits behind a bar on Quay Street and pours the Inspector's brandy on its own slate. I will say no more than that, and if you are wise you will write down that I said that much.","miss":"I am a corn factor with a good alibi and a better solicitor."}},{"id":"quint","name":"Jasper Quint","age":30,"job":"formerly Haldane's clerk","color":"#3f5560","look":"Tall, pale, a coat too thin for the season.","note":"Unemployed since Haldane's arrest. Rooke had refused him a loan that morning and, Quint says, laughed while he did it.","answers":["The Weavers' Arms. I went in at five with my last shilling and I was still there when I heard the clock strike seven, and I went home.","He refused me a loan of four pounds and laughed. That is the whole of it. I am not proud of being poor.","Six, and seven. I told you. I heard seven strike and I got up and went home to Weavers' Court.","Haldane called it the Committee when he was drunk. He said the Bell was its counting house. I thought he meant the church bell."],"press":{"keys":["f1","lucie:2","lucie:press","vell:2"],"answer":"It struck seven, I heard... It didn't. No. I went up because he'd laughed, and he was on the stair with his back to me and his chain hanging out of his waistcoat like a rope somebody had left for me. I am a tall man. It was over before the quarter. I went to the Arms after, and I told myself I'd heard seven.","miss":"Pike will tell you I was there."}},{"id":"marguerite","name":"Marguerite Ferrand","age":42,"job":"milliner, Lucie's mother","color":"#6b4a3a","look":"Composed, gloved, older than her face.","note":"Says she was in her Mercer Row shop with Lucie from five. Rooke had refused her a loan too, more politely than he refused Quint.","answers":["In my shop with Lucie until she went across to wind at seven. Until she went to wind, I said. I had a customer and lost the hour.","He was the bank. I wanted to buy my lease and he was slow about it. Nothing more.","Six. After six I noticed nothing; I was with a customer until Lucie came running.","Mr Coyle bought a hat on Tuesday and asked whether my father still kept a key to the tower. I told him my father keeps every key he has ever owned."],"press":{"keys":["coyle:2"],"secret":true,"answer":"Lucie was not with me at six. She went across to the tower with her chin out at ten to six and I let her, because I was her once. She came back white at twenty past and I have lied for her since. She did not do this. She is too small and too honest.","miss":"I sell hats. I don't count hours."}}],"culprit":"quint","solution":"The clock jammed at a quarter past six and has not struck since; Vell heard it stop and Lucie, who notices everything about that clock, said so. Quint said he heard it strike seven. It did not. Lucie, once she admitted she had been on the stair herself, saw a tall man in a hat coming up below her before the quarter. Coyle was at table with a waiter watching him. Old Vell cannot climb the stair. Quint could, and did.","arrest":"Quint asks whether the Arms will keep his tab open. It will not."},{"id":"harbour","title":"A Body in the Harbour","reward":9,"rules":{"questions":10,"presses":3},"brief":{"victim":"A man, about thirty. No papers. Pulled from the water at dawn by Kessler's boys.","weapon":"Unknown. Dr Lisle has not finished.","time":"Unknown","place":"The water off the Net Loft steps, Quay Street","public":"Nothing. The Gazette does not know yet.","facts":[]},"questions":["Where were you on Friday night?","Did you know the dead man?","What did you see or hear at the quay?","Anything else you haven't told me?"],"suspects":[{"id":"ben","name":"Ben Oduya","age":19,"job":"fishmonger's son","color":"#4b5d4a","look":"Tall, restless, avoiding your eye.","note":"The Oduya stall stands at the top of the Net Loft steps. He was, he says, home in bed.","answers":["Closing the stall at eleven, then home to bed.","I've seen him. Sorrow, a cooper's mate who lodges at Pell's. He bought herring on tick and paid when he remembered.","Nothing. I was home.","There's a boathook gone from our stall since Saturday morning. Father blames me for it."],"press":{"keys":["kessler:2"],"secret":true,"answer":"I wasn't home. I was on the Net Loft steps with Maeve Trask till past midnight. A woman in a travelling cloak came down the steps toward the water, and I took Maeve up the loft ladder so she wouldn't see us. Then a shout, a man's, laughing. Then a splash. I didn't look. I should have.","miss":"I was home. Ask my father."}},{"id":"kessler","name":"Ruth Kessler","age":44,"job":"boatwright","color":"#6b3f3f","look":"Forearms like hawsers; salt to the elbow this morning.","note":"Her boys found the body at first light and she brought it in on a hurdle herself.","answers":["Yard, forge, bed by eleven. Same as every night.","Not by name until Lisle said it: Sorrow. A cooper's mate from Pell's. I'd seen him carry casks.","My boys pulled him out at dawn by the Net Loft steps. His watch had stopped at ten past twelve. There was a cut across the scalp like the edge of an oar had done it. Or a hook.","The packet came in Friday at nine with three passengers. One was a woman alone with a small bag, and she asked my boy the way to the Drowned Bell."],"press":{"keys":[],"miss":"I pulled him out. That's my part."}},{"id":"amos","name":"Father Amos","age":58,"job":"priest, St Brendan's","color":"#7a6a2e","look":"Tired, kind, ink on his thumb.","note":"Friday evening is confessions at the chapel. He will not say who came. He will say a little about what they were afraid of.","answers":["In the chapel. Friday is confessions, and I sat until ten.","A young man came to confession on Friday evening. I will not tell you what he confessed. I will tell you he was afraid, and that he said his wife had found him.","Nothing. The chapel is at the top of Gull Lane; the quay is a long way down.","He asked me whether a marriage made in Harrowgate counts in Saltmarsh. I told him God doesn't keep separate books for separate towns."],"press":{"keys":[],"miss":"The seal is the seal, Sergeant."}},{"id":"winn","name":"Clerk Winn","age":45,"job":"telegraphist","color":"#3f5560","look":"Ink on his cuffs; precise to the minute.","note":"Every wire in and out of Saltmarsh crosses his desk, and he reads them all.","answers":["At my desk until ten, then bed. My log says so.","A wire came Thursday for D. Sorrow, care of Pell's rooming house: 'Arriving Friday packet. Don't run again. D.' Paid at the Harrowgate end.","Nothing. I don't go down to the quay.","The same 'D.' sent a wire from my office on Saturday morning to Harrowgate: 'Done. Home Monday.' A woman. She paid in coin and signed the book Vance."],"press":{"keys":[],"miss":"It is all in the book, and the book is never wrong."}},{"id":"dora","name":"Dora Vance","age":30,"job":"'visiting, from Harrowgate'","color":"#5a3f5e","look":"Travelling cloak with a salt-stained hem; a wedding ring turned inward.","note":"Took a room at the Drowned Bell off Friday's packet. Has asked twice when the Monday packet sails.","answers":["Asleep at the Bell. I came off the packet at nine and went straight up to bed.","I don't know him. I don't know anyone here.","Nothing. I was asleep.","I want to go home on Monday. That is all."],"press":{"keys":["winn:1","winn:3","amos:1","ben:press"],"answer":"Daniel Sorrow. Daniel Vance, when he married me, before he ran with my father's savings and changed his name to a sad one. I came to bring him home. He laughed at me on the steps, so I took the hook from the fish stall and I hit him once, and he went into the water still laughing, and then he stopped. I sent my mother a wire. I would like to go home on Monday.","miss":"I don't know anyone here."}}],"culprit":"dora","solution":"The file said nothing, so the people had to. Kessler's watch put the death at ten past twelve and her description of the wound matched the boathook missing from the Oduya stall. Winn's Thursday wire was signed 'D.' and told Sorrow not to run again; his Saturday wire, signed Vance, said 'Done. Home Monday.' Father Amos heard a frightened man say his wife had found him. Ben, once he admitted where he really was, saw a woman in a travelling cloak go down the steps before the splash. Dora Vance said she knew nobody here. She knew her husband.","arrest":"Dora Vance asks whether the Monday packet still sails. It does. She is not on it."},{"id":"bellroom","title":"The Back Room at the Bell","reward":12,"rules":{"questions":10,"presses":3},"cold":{"tower":"Jasper Quint walked. He drinks at the Bell now, on somebody's slate.","pier":"Solly Marsh has reopened the pawnshop and takes his post at the Drowned Bell."},"imports":[{"from":"bell","ev":"kell:3","label":"Marta Kell, the Quaile case: what she said about the gentleman who rents her back room"},{"from":"bell","ev":"lil:3","label":"Lil Marr, the Quaile case: what she said the Harrowgate gent paid her for"},{"from":"light","ev":"winn:3","label":"Clerk Winn, the lighthouse case: what he said about the monthly wires to Mr Coyle"},{"from":"pier","ev":"trask:3","label":"Constable Trask, the pier case: what he said about the Bell's back room and the Inspector"},{"from":"tower","ev":"coyle:press","label":"Mr Coyle, the clock-tower case: what he admitted about where the Committee sits"},{"from":"tower","ev":"quint:3","label":"Jasper Quint, the clock-tower case: what Haldane called the Bell"}],"brief":{"victim":"Julian Coyle, 45, 'a corn factor from Harrowgate'","weapon":"A boning knife from the Bell's own kitchen, once, under the ribs","time":"Between one and two in the morning, Sunday, after the taproom closed","place":"The back room of the Drowned Bell, Quay Street","public":"\"A visitor found dead at the Drowned Bell.\" Nothing else, and the Gazette has been asked to print nothing more.","facts":["The back room locks from both sides. Coyle's key was in the lock on the inside. The landlady holds the only other key.","Coyle's strongbox was open and empty. Under the bed, a page torn from a bank ledger with initials down one side. The last initial on it is 'M.K.'","The knife was washed and put back in the kitchen block. The constable found blood in the rivets of the handle.","Inspector Dace was drinking in the taproom until it closed at one. He says so himself, and asked that it be written down."]},"questions":["Where were you between one and two?","What was Julian Coyle to you?","Who did Coyle answer to?","What was in the strongbox?"],"suspects":[{"id":"kell","name":"Marta Kell","age":52,"job":"landlady of the Drowned Bell","color":"#6b4a3a","look":"Broad, quick, the bar-towel gone from her shoulder for once.","note":"Holds the only other key to the back room. Says Coyle was a lodger and nothing more. Has poured every drink in this story.","answers":["Clearing the taproom till half past one, then my bed above it. The Inspector saw me. He sees me most nights.","A lodger. Paid by the quarter. I never asked his business and he never told it.","How would I know? He came from Harrowgate and went back there. Ask Harrowgate.","His own affairs. I never saw inside it."],"press":{"keys":["imp:light:winn:3","imp:tower:coyle:press","imp:bell:kell:3","imp:pier:trask:3","lil:press"],"answer":"M.K. Yes. I bought this house with their money in '82 and I have counted their money across this bar every quarter since, and signed for their wires, and poured the Inspector blind on their slate. Coyle came to tell me the Committee was finished with Saltmarsh and finished with me, and that the page with my initial on it went to Harrowgate in the morning. Twenty years I have kept this house. I took the knife from my own block and I washed it in my own yard.","miss":"Twenty years behind this bar, and you'd hang me on a lodger's word."}},{"id":"lil","name":"Lil Marr","age":19,"job":"barmaid","color":"#5a3f5e","look":"Small, tired, carrying and showing now.","note":"Cleared the taproom with Marta. Coyle tipped her to watch who drank with whom.","answers":["Clearing glasses till half past one. Then Marta sent me up. I heard her on the stairs after, and then I heard her not on the stairs.","He paid me shillings to tell him who drank with the Inspector. I took them. I'd take them again.","Marta. Everybody took orders from Marta; they just didn't know it. He'd hand her his post and she'd hand him his change.","Money and a book. I saw it open once when I brought his tray. He shut it on my fingers."],"press":{"keys":["kell:0"],"secret":true,"answer":"Marta didn't go to bed at half past one. I heard the back-room door, and the yard pump running a long time after, and in the morning the boning knife was wet in the block when everything else was dry. I've said nothing because she kept me on when I was showing and nobody else in this town would.","miss":"I clear glasses."}},{"id":"dace","name":"Inspector Dace","age":50,"job":"Saltmarsh Constabulary","color":"#3f5560","look":"Grey, careful, brandy still on him.","note":"Drank in the taproom until one, as he does most nights. Suspended Trask; arrested Haldane and Grady; never once arrested anyone at the Bell.","answers":["In my bed at the Customs House by half past one. Alone, which I regret for the first time.","A man I was building a case against, slowly, and drinking in the same room as, faster.","Someone in this town. I had begun to think it was me, the way things went past me.","The Committee's page. Every initial on it is a Saltmarsh name. Mine is not there. I checked before I called you, and I'm not proud of the order I did that in."],"press":{"keys":["trask:2","imp:pier:trask:3"],"secret":true,"answer":"I have drunk at the Bell on the Committee's slate for nine years without paying a penny and told myself it was a landlady's kindness. That is the whole of my corruption and it was enough to blind me to everything else. I did not kill him. I was too drunk to find the back room.","miss":"Careful, Sergeant."}},{"id":"trask","name":"Constable Trask","age":38,"job":"resigned","color":"#4a4f6b","look":"Thinner. The moustache is going grey.","note":"Came to the Bell at midnight to confront Coyle about the ledger and was refused at the back-room door.","answers":["Walking. The pier, the Row, the quay. I haven't slept since Penhale. Nobody saw me, which is how I've been living.","The man who bought me for eleven pounds and a promise. I went to give the eleven back. He laughed at me through the door.","The Bell. It was always the Bell. Dace drank there on their slate and called it a landlady's kindness. Ask him what he paid in nine years.","My name. My name was in that box and I wanted it out. I didn't get in."],"press":{"keys":[],"miss":"I've nothing left to lie for."}},{"id":"steel","name":"Captain Amos Steel","age":50,"job":"master of the Halcyon","color":"#7a6a2e","look":"Beard like a hedge, trimmed for once.","note":"The Halcyon lay at the quay that night. Coyle owed her owners a cargo that went down with the Kittiwake's seizure.","answers":["Aboard, with the watch. Twenty men.","The agent who cost my owners a cargo and near cost me a ship on the rock. I came ashore at eleven to tell him so. He gave me a drink. Kell poured it and didn't charge.","He sent his letters through the landlady and got his answers the same way. A man who answers to a landlady answers to whoever owns her.","Coin, he said. Enough to buy the Halcyon out from under me. He said it to frighten me. It did."],"press":{"keys":[],"miss":"Twenty men and a logbook."}},{"id":"pell","name":"Mrs Pell","age":60,"job":"keeps the rooming house on Rope Walk","color":"#4b5d4a","look":"Stout, upright, a purse on a string.","note":"Coyle rented her back room too, under another name, since the spring. Came to the Bell at midnight for a quarter's rent he owed.","answers":["Home by half past twelve. He paid me at the back-room door, in gold, and shut it in my face. I counted it walking home. It was right.","A lodger under the name Blackwood. The second I've had by that name, and I'm finished with the name.","He got his post at the Bell and his sleep at mine. A man with two beds has one master, and it isn't either landlady.","Gold. He paid me out of it. Sovereigns, from a box with a brass corner."],"press":{"keys":[],"miss":"I keep lodgers, not secrets."}}],"culprit":"kell","solution":"The back room was locked with Coyle's key on the inside and Marta Kell held the only other. Lil heard the door, then the yard pump, and found the boning knife wet in a dry block. The ledger page ends with M.K. Marta Kell bought the Drowned Bell with the Committee's money in 1882 and has been its counting house ever since: signing for Coyle's wires 'care of the Bell', pouring the Inspector's brandy on their slate, and telling you on your very first night that a landlady who asks doesn't keep gentlemen. Coyle came to close the Saltmarsh account. She closed his.","arrest":"Marta Kell asks who will open the Bell in the morning. Lil says she will."}],"decor":[{"id":"pipe","name":"Briar pipe","price":3,"desc":"Never lit at the desk. Chewed, mostly."},{"id":"photo","name":"Framed photograph","price":2,"desc":"Someone you don't discuss."},{"id":"fern","name":"Potted fern","price":3,"desc":"Thrives on lamplight and neglect."},{"id":"lamp","name":"Brass reading lamp","price":4,"desc":"Green shade. The good kind."},{"id":"decanter","name":"Decanter and glass","price":4,"desc":"For after the arrest, not before."},{"id":"ship","name":"Ship in a bottle","price":5,"desc":"The Kittiwake, someone says. It isn't."},{"id":"cat","name":"Office cat","price":6,"desc":"Answers to nothing. Sleeps on the case files."},{"id":"typewriter","name":"Remington typewriter","price":8,"desc":"Reports in triplicate. The Inspector is impressed."}],"hands":[{"id":"caveat","name":"Your own hand","price":0,"font":"'Caveat', cursive","size":"21px","line":"28px","prev":"22px"},{"id":"pencil","name":"Soft pencil","price":3,"font":"'Shadows Into Light', cursive","size":"19px","line":"28px","prev":"20px"},{"id":"typed","name":"Typewriter","price":3,"font":"'Special Elite', monospace","size":"14px","line":"28px","prev":"15px"},{"id":"flourish","name":"Flourished pen","price":3,"font":"'Dancing Script', cursive","size":"21px","line":"28px","prev":"22px"},{"id":"copper","name":"Copperplate","price":4,"font":"'Homemade Apple', cursive","size":"15px","line":"28px","prev":"16px"},{"id":"chalk","name":"Chalk scrawl","price":4,"font":"'Rock Salt', cursive","size":"13px","line":"28px","prev":"14px"}]}
</script>

<script>
(function(){
const D = JSON.parse(document.getElementById('game-data').textContent);
const C = Object.fromEntries(D.cases.map(c=>[c.id,c]));
const R = D.rules;
function rulesOf(c){ return Object.assign({}, R, c && c.rules ? c.rules : {}); }
const KEY='deadletter.v5';
const rid=(n=10)=>Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');

const fresh=()=>({tab:'desk', money:0, solved:{}, inv:{}, caseId:D.cases[0].id, owned:[], hand:'caveat', notebook:'', intro:true, tut:0, music:true, sfx:true, amb:true, easy:true, defaultsV2:true, track:0,
  pid:'p'+rid(10), name:'', made:{}, taken:{}, coop:null, coopApplied:{}, casesTab:'files', editing:null, notes:{}, practice:null, daily:null, dailyPaid:{}, testing:null, hints:{}});
let S=load();
let db=null, room=null, ONLINE=false, BOARD=[], COOP=null, unsubCoop=null, PEERS=[], netNote='', DAILY=null;
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.caseId){ if(!s.pid) s.pid='p'+rid(10); s.made=s.made||{}; s.taken=s.taken||{}; s.coopApplied=s.coopApplied||{}; s.notes=s.notes||{}; if(s.notebook && !s.notes.general){ s.notes.general=s.notebook; } s.dailyPaid=s.dailyPaid||{}; s.hints=s.hints||{}; s.practice=null; s.daily=null; s.testing=null; if(!s.defaultsV2){ s.defaultsV2=true; s.music=true; s.sfx=true; s.amb=true; s.easy=true; } return s; } }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} try{ pushSave(); }catch(e){} }
const $=s=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const idx=id=>D.cases.findIndex(c=>c.id===id);
const isStory=id=>!!C[id];
function draftById(id){ for(const k in S.made){ if(S.made[k].c.id===id) return S.made[k]; } return null; }
function getCase(id){ if(C[id]) return C[id]; if(COOP && COOP.caseId===id && COOP.caseData) return COOP.caseData; if(S.taken[id]) return S.taken[id].c; const d=draftById(id); if(d) return cleanCase(d.c); return null; }
function mode(cid){ if(S.testing && S.testing.cid===cid) return 'test'; if(S.daily && S.daily.cid===cid) return 'daily'; if(S.practice===cid) return 'practice'; return null; }
function invKey(cid){ const m=mode(cid); return m ? cid+'#'+m+(m==='daily'?S.daily.date:'') : cid; }
function solvedView(cid){ return mode(cid) ? null : (S.solved[cid]||null); }
function cur(){ if(COOP && COOP.caseData) return COOP.caseData; return getCase(S.caseId) || (S.caseId=D.cases[0].id, C[S.caseId]); }
function unlocked(id){ if(!isStory(id)) return true; const i=idx(id); return i===0 || !!S.solved[D.cases[i-1].id]; }
function localInv(cid){ const k=invKey(cid); return S.inv[k] || (S.inv[k]={asked:{}, presses:[], revealed:{}, broken:false}); }
function inv(cid){ if(COOP && COOP.caseId===cid) return COOP.inv || {asked:{},presses:[],revealed:{},broken:false}; return localInv(cid); }
function nAsked(cid){ return Object.values(inv(cid).asked||{}).reduce((a,l)=>a+l.length,0); }
function qLeft(cid){ return Math.max(0, rulesOf(getCase(cid)||cur()).questions - nAsked(cid)); }
function pLeft(cid){ return Math.max(0, rulesOf(getCase(cid)||cur()).presses - (inv(cid).presses||[]).length); }
function nextCase(){ if(!isStory(S.caseId) || mode(S.caseId)) return null; const i=idx(S.caseId); return D.cases[i+1]||null; }
function handOf(){ return D.hands.find(x=>x.id===S.hand)||D.hands[0]; }
function sus(c,sid){ return c.suspects.find(x=>x.id===sid); }
function myName(){ return S.name || 'Detective '+S.pid.slice(1,5).toUpperCase(); }
function inCoop(){ return !!(S.coop && COOP); }

/* What's visible right now: answers show once, while the suspect's page is open */
let SESSION={sid:null, seen:[], press:false};
function easy(){ return S.easy===true; }
function noteKey(){ return cur().id; }
function noteBox(){ return `<div class="nbwrap"><div class="eyebrow" style="margin:14px 0 6px">Your notebook · ${esc(cur().title)}</div><textarea class="nb small" data-note="${esc(noteKey())}" placeholder="Write down what matters. Nobody else will.">${esc(S.notes[noteKey()]||'')}</textarea></div>`; }

/* Evidence available to press with: facts, heard statements, reveals */
function carried(c){ // clues heard in earlier cases that this case can use
  return (c.imports||[]).filter(im=>{ const I=S.inv[im.from]; if(!I) return false; const [sid,q]=im.ev.split(':'); if(q==='press') return !!(I.revealed||{})[sid]; return ((I.asked||{})[sid]||[]).includes(+q); }).map(im=>({id:'imp:'+im.from+':'+im.ev, kind:'import', who:'Earlier case', text:im.label, from:im.from}));
}
function evidence(c){
  const I=inv(c.id); const out=[];
  c.brief.facts.forEach((f,i)=>out.push({id:'f'+i, kind:'fact', who:'Case file', text:f}));
  carried(c).forEach(e=>out.push(e));
  c.suspects.forEach(s=>{ ((I.asked||{})[s.id]||[]).slice().sort().forEach(qi=>out.push({id:s.id+':'+qi, kind:'said', who:s.name, text:s.answers[qi]})); if((I.revealed||{})[s.id]) out.push({id:s.id+':press', kind:'press', who:s.name+', pressed', text:s.press.answer}); });
  return out;
}
function evLabel(c,e){ if(e.kind==='fact') return e.who+': '+e.text; if(e.kind==='import') return e.text; const qi=+e.id.split(':')[1]; if(e.kind==='press') return 'What '+e.who.replace(', pressed','')+' admitted when pressed'; return 'What '+e.who+' said to question '+(qi+1)+(easy()?': '+e.text:''); }
function evText(c,id){ const e=evidence(c).find(x=>x.id===id); return e? evLabel(c,e) : id; }

/* ---------- Money ---------- */
const PURSE_CAP=999;
function addMoney(d){ S.money=Math.min(PURSE_CAP, Math.max(0, S.money+d)); save(); pushPlayer(); }

/* ---------- Tutorial ---------- */
const first=D.cases[0].id;
const TUT=[
 {t:"A case file. Read it twice: what the Gazette printed, and what only this office knows. Then tap a suspect.", done:s=>!!s.tutOpened},
 {t:"You get <b>six questions</b> for four people, so choose. And listen: an answer is shown once. Leave the page and it's gone. <b>Write down what matters</b> in the notebook under the interview.", done:s=>nAsked(first)>=2||!!s.solved[first]},
 {t:"When something a suspect said doesn't square with the file, or with what someone else said, <b>press</b> them with it. Two presses a case. The picker names statements but doesn't repeat them: your notebook does. A press can break a killer, or make an honest liar admit what they were hiding.", done:s=>(localInv(first).presses.length>=1)||!!s.solved[first]},
 {t:"Accuse from the suspect's page when you're sure. A wrong arrest goes cold with no pay. A right one pays, and £2 more if you broke them first: the magistrate likes a confession.", done:s=>!!s.solved[first]},
 {t:"That's the job. Cold cases follow you into later files, and so does what people tell you: a name that keeps turning up across the files matters in the end, so keep asking the odd fourth question and keep your old notebook pages. The <b>Cases</b> board keeps the score, and it's where other detectives post cases for stakes, and where co-op rooms open.", done:s=>!!s.tutAck, ack:true}
];
function advanceTut(){ if(S.tut===null||S.tut===undefined) return; while(S.tut<TUT.length && TUT[S.tut].done(S)) S.tut++; if(S.tut>=TUT.length) S.tut=null; }
function coachHTML(){ if(S.intro||S.tut===null||S.tut===undefined) return ''; const st=TUT[S.tut]; if(!st) return ''; return `<div class="coach"><small>The Inspector</small><p>${st.t}</p><div class="row">${st.ack?'<button class="ok" data-act="ack">Understood</button>':''}<button data-act="skiptut">Skip the lesson</button></div></div>`; }

/* ---------- Decor art ---------- */
const ART={
 pipe:`<svg viewBox="0 0 64 40"><path d="M6 12 q26 -6 40 4" fill="none" stroke="#b8925a" stroke-width="3" stroke-linecap="round"/><path d="M42 12 h14 v14 q0 8 -8 8 h-4 q-8 0 -8 -8 z" fill="#3a2a1e" stroke="#b8925a" stroke-width="2"/></svg>`,
 photo:`<svg viewBox="0 0 48 56"><rect x="4" y="4" width="40" height="48" fill="#b8925a"/><rect x="9" y="9" width="30" height="38" fill="#efe6d2"/><ellipse cx="24" cy="26" rx="8" ry="10" fill="#6f675a"/><path d="M8 47 q16 -14 32 0" fill="#4a5561"/></svg>`,
 fern:`<svg viewBox="0 0 56 64"><path d="M14 40 h28 l-4 20 h-20 z" fill="#7a3b2a" stroke="#b8925a" stroke-width="1.5"/><path d="M28 40 q-2 -18 -18 -26 M28 40 q2 -20 18 -30 M28 40 q0 -22 0 -36 M28 40 q-8 -12 -20 -8 M28 40 q8 -14 22 -10" fill="none" stroke="#5f8a5a" stroke-width="3" stroke-linecap="round"/></svg>`,
 lamp:`<svg viewBox="0 0 64 64"><ellipse cx="32" cy="58" rx="16" ry="4" fill="#b8925a"/><rect x="30" y="30" width="4" height="28" fill="#b8925a"/><path d="M8 30 q24 -18 48 0 z" fill="#3b6b3f" stroke="#b8925a" stroke-width="1.5"/><ellipse cx="32" cy="34" rx="18" ry="5" fill="#e8c15a" opacity=".8"/></svg>`,
 decanter:`<svg viewBox="0 0 64 64"><path d="M22 60 h20 q6 0 6 -6 v-14 q0 -10 -10 -14 v-14 h-12 v14 q-10 4 -10 14 v14 q0 6 6 6z" fill="#efe6d2" opacity=".9" stroke="#b8925a" stroke-width="1.5"/><rect x="26" y="8" width="12" height="6" fill="#b8925a"/><path d="M20 44 q12 4 24 0 v10 q0 6 -6 6 h-12 q-6 0 -6 -6z" fill="#8a3a2a" opacity=".8"/><path d="M52 60 h10 v-14 h-10z" fill="#efe6d2" opacity=".9" stroke="#b8925a" stroke-width="1.2"/><path d="M53 52 h8 v8 h-8z" fill="#8a3a2a" opacity=".8"/></svg>`,
 ship:`<svg viewBox="0 0 80 40"><path d="M6 12 h50 q18 0 18 8 t-18 8 h-50 z" fill="#efe6d2" opacity=".85" stroke="#b8925a" stroke-width="1.5"/><rect x="0" y="14" width="8" height="12" fill="#b8925a"/><path d="M22 27 h26 l-3 4 h-20z" fill="#3a2a1e"/><path d="M35 27 v-14 l10 12 z" fill="#efe6d2" stroke="#3a2a1e" stroke-width="1"/><path d="M34 27 v-14 l-9 12 z" fill="#efe6d2" stroke="#3a2a1e" stroke-width="1"/></svg>`,
 cat:`<svg viewBox="0 0 72 48"><ellipse cx="40" cy="36" rx="28" ry="12" fill="#2a2320"/><circle cx="18" cy="26" r="12" fill="#2a2320"/><path d="M8 20 l2 -12 l8 8z M28 20 l-2 -12 l-8 8z" fill="#2a2320"/><circle cx="14" cy="26" r="1.6" fill="#e8c15a"/><circle cx="22" cy="26" r="1.6" fill="#e8c15a"/><path d="M66 36 q8 -14 -2 -20" fill="none" stroke="#2a2320" stroke-width="5" stroke-linecap="round"/></svg>`,
 typewriter:`<svg viewBox="0 0 80 56"><rect x="24" y="2" width="32" height="20" fill="#efe6d2" stroke="#b8925a" stroke-width="1"/><rect x="8" y="22" width="64" height="26" rx="4" fill="#2a2320" stroke="#b8925a" stroke-width="1.5"/><rect x="4" y="46" width="72" height="8" rx="2" fill="#3a2a1e" stroke="#b8925a" stroke-width="1"/>${[0,1,2,3,4,5,6].map(i=>`<circle cx="${18+i*7.5}" cy="32" r="2" fill="#b8925a"/><circle cx="${22+i*7.5}" cy="39" r="2" fill="#b8925a"/>`).join('')}</svg>`
};

/* ---------- Online (claude.ai artifact runtime) ---------- */
async function initNet(){
  try{
    if(!(window.claude && typeof window.claude.use==='function')){ netNote='offline'; return; }
    db=await window.claude.use('db');
    if(!db){ netNote='offline'; render(); return; }
    ONLINE=true; netNote='';
    await syncPlayer();
    db.collection('cases').orderBy('createdAt','desc').limit(60).onSnapshot(snap=>{ BOARD=snap.docs.map(d=>d.data()).filter(Boolean); checkLost(); render(); }, e=>{ netNote='board '+e.code; render(); });
    watchPlayer();
    db.doc('daily/'+todayKey()).onSnapshot(snap=>{ DAILY=snap.exists?snap.data():null; render(); }, e=>{});
    if(S.coop) joinCoop(S.coop.code, true);
    room=await window.claude.use('room');
    if(room){ room.onPeers(ch=>{ PEERS=ch.peers.slice(); renderCoopPeers(); }); pushPresence(); }
    render();
  }catch(e){ netNote='offline'; render(); }
}
async function syncPlayer(){
  const ref=db.doc('players/'+S.pid); const snap=await ref.get();
  if(snap.exists){ const d=snap.data(); if(S.account && d.save) adoptSave(d.save); if(typeof d.money==='number') S.money=d.money; if(d.name && !S.name) S.name=d.name; save(); if(d.name!==myName()) pushPlayer(); }
  else await ref.set({pid:S.pid, name:myName(), money:S.money, save:S.account?saveBlob():null, updatedAt:Date.now()});
}
let pushT; function pushPlayer(){ if(!ONLINE) return; clearTimeout(pushT); pushT=setTimeout(()=>{ db.doc('players/'+S.pid).set({pid:S.pid, name:myName(), money:S.money, updatedAt:Date.now()}).catch(()=>{}); },150); }
function pushPresence(){ if(room) room.presence({name:myName(), coop:S.coop?S.coop.code:null}).catch(()=>{}); }
function boardCase(cid){ return BOARD.find(b=>b.id===cid); }
function checkLost(){ let changed=false; for(const cid in S.taken){ const b=boardCase(cid); if(b && b.status!=='open' && b.solvedBy!==S.pid && !S.solved[cid]){ delete S.taken[cid]; if(S.caseId===cid) S.caseId=D.cases[0].id; changed=true; toast('Someone closed "'+b.title+'" before you.'); } } if(changed) save(); }

/* ----- accounts: username + password, verified in the page, progress kept in the player doc ----- */
const hex=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbkdf(pw, saltHex){ const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']); const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(saltHex),iterations:120000},key,256); return hex(new Uint8Array(bits)); }
const SAVE_KEYS=['money','solved','inv','owned','hand','notebook','notes','easy','taken','made','coopApplied','tut','tutAck','tutOpened','intro','sfx','amb','music','dailyPaid','hints','hintTokens','defaultsV2'];
function saveBlob(){ const o={}; SAVE_KEYS.forEach(k=>{ if(S[k]!==undefined) o[k]=S[k]; }); return o; }
let cloudT; function pushSave(){ if(!ONLINE||!S.account) return; clearTimeout(cloudT); cloudT=setTimeout(()=>{ db.doc('players/'+S.pid).update({save:saveBlob(), money:S.money, name:myName(), savedAt:Date.now()}).catch(()=>{}); },900); }
function adoptSave(blob){ if(!blob) return; SAVE_KEYS.forEach(k=>{ if(blob[k]!==undefined) S[k]=blob[k]; }); if(!blob.defaultsV2){ S.music=true; S.sfx=true; S.amb=true; S.easy=true; } S.defaultsV2=true; S.intro=false; S.caseId=D.cases[0].id; S.coop=null; save(); }
function validUser(u){ return /^[a-z0-9_]{3,16}$/.test(u); }
async function register(u, pw){
  u=String(u||'').trim().toLowerCase(); if(!validUser(u)) return 'Username: 3 to 16 letters, numbers or underscores.'; if(String(pw||'').length<4) return 'Password: at least 4 characters.';
  if(!ONLINE) return 'Accounts need the online version.';
  const ref=db.doc('accounts/'+u); const lock=await ref.acquire({holder:S.pid, ttlMs:8000}); if(!lock.acquired) return 'Try again in a moment.';
  const snap=await ref.get(); if(snap.exists) return 'That name is taken.';
  const salt=hex(crypto.getRandomValues(new Uint8Array(16))); const h=await pbkdf(pw,salt); const pid='p'+rid(10);
  await ref.set({user:u, salt, hash:h, pid, createdAt:Date.now()});
  // carry the guest's progress into the new account
  S.pid=pid; S.account=u; if(!S.name) S.name=u; save();
  await db.doc('players/'+pid).set({pid, name:myName(), money:S.money, save:saveBlob(), updatedAt:Date.now(), savedAt:Date.now()});
  watchPlayer(); pushPresence(); return null;
}
async function login(u, pw){
  u=String(u||'').trim().toLowerCase(); if(!ONLINE) return 'Accounts need the online version.';
  const snap=await db.doc('accounts/'+u).get(); if(!snap.exists) return 'No account by that name.';
  const a=snap.data(); const h=await pbkdf(pw||'',a.salt); if(h!==a.hash) return 'Wrong password.';
  S.pid=a.pid; S.account=u; save();
  const ps=await db.doc('players/'+a.pid).get();
  if(ps.exists){ const d=ps.data(); if(d.save) adoptSave(d.save); if(typeof d.money==='number') S.money=d.money; if(d.name) S.name=d.name; save(); }
  else await db.doc('players/'+a.pid).set({pid:a.pid, name:myName(), money:S.money, save:saveBlob(), updatedAt:Date.now()});
  watchPlayer(); pushPresence(); return null;
}
