/* ----- player cases: publish / take / resolve ----- */
const TEMPLATES={
 poison:{weapon:'Poison in something only the victim ate or drank', publicPh:'"Died suddenly at the table." Leave out the poison.', facts:['Only the victim took the [milk / sugar / soup]; everyone else at the table is fine.','The [cup / jug / bottle] has gone missing since.',''], questions:['Where were you that afternoon?','What did you eat or drink with them?','Who brought the food to the table?']},
 fall:{weapon:'A fall from somewhere high. Or a push.', publicPh:'"Fell from the tower while sightseeing." The police know the door up there was hooked open.', facts:['The door onto the ledge was hooked open from the inside. The victim hated a draught.','The victim never went up there alone; someone was with them.',''], questions:['Where were you when it happened?','Why would they have gone up there?','Who else knew they were going?']},
 stab:{weapon:'A kitchen knife, once', publicPh:'"Found dead in the back room." Leave out the knife.', facts:['The knife came from the house\'s own kitchen and was washed and put back.','The room was locked from inside; only two people had keys.',''], questions:['Where were you between midnight and one?','How did you know the victim?','Who has a key to that room?']}
};
function blankCase(t){
  const sid=()=>'s'+rid(4); const T=TEMPLATES[t];
  const base={id:'pc_'+rid(8), title:'', reward:0, brief:{victim:'', weapon:'', time:'', place:'', public:'', facts:['','','']}, questions:['Where were you when it happened?','How did you know the victim?','What do you make of how they died?'],
    suspects:[0,1,2,3].map(i=>({id:sid(), name:'', age:'', job:'', color:['#6b4a3a','#3f5560','#7a6a2e','#5a3f5e'][i], look:'', note:'', answers:['','',''], press:{keys:[], answer:'', miss:''}})),
    culprit:'', solution:'', arrest:''};
  if(T){ base.brief.weapon=T.weapon; base.brief.facts=T.facts.slice(); base.questions=T.questions.slice(); base.brief.public=''; base._ph=T.publicPh; }
  return base;
}
const ONLINE_URL='https://claude.ai/code/artifact/8675c176-5bc2-43a6-a2c0-0e0dbb18062c';
function caseCode(c){ return 'DETECTIVE1.'+btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/=+$/,''); }
function parseCaseCode(t){ try{ t=String(t||'').trim(); if(!t.startsWith('DETECTIVE1.')) return null; const c=JSON.parse(decodeURIComponent(escape(atob(t.slice(11))))); if(!c||!c.suspects||!c.brief) return null; c.id='pc_'+rid(8); return c; }catch(e){ return null; } }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ try{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); return true; }catch(e2){ return false; } } }
function blank4(c){ const s=c.suspects[3]; return !!s && !String(s.name||'').trim() && !s.answers.some(a=>String(a||'').trim()) && c.culprit!==s.id; }
function validateCase(c){
  const errs=[]; const need=(v,l,path)=>{ if(!String(v||'').trim()) errs.push({label:l, path}); };
  need(c.title,'a name for the case','title'); need(c.brief.victim,'who died','brief.victim'); need(c.brief.weapon,'what killed them','brief.weapon'); need(c.brief.time,'when it happened','brief.time'); need(c.brief.place,'where it happened','brief.place'); need(c.brief.public,'what the newspaper said','brief.public');
  // secret clues are optional: a case with none makes the detective dig everything out of people
  c.questions.forEach((q,i)=>need(q,'question '+(i+1),'questions.'+i));
  c.suspects.forEach((s,i)=>{ if(i===3 && blank4(c)) return; need(s.name,'suspect '+(i+1)+"'s name",'suspects.'+i+'.name'); s.answers.forEach((a,j)=>need(a,(s.name||'suspect '+(i+1))+"'s answer to question "+(j+1),'suspects.'+i+'.answers.'+j)); if(s.press.keys.length) need(s.press.answer,(s.name||'suspect '+(i+1))+(s.id===c.culprit?"'s confession":"'s secret"),'suspects.'+i+'.press.answer'); });
  if(!c.suspects.some(s=>s.id===c.culprit)) errs.push({label:'ticking who the killer is', path:'culprit'});
  return errs;
}
function cleanCase(c){ // trim empty facts, default texts, drop an unused 4th suspect
  const x=JSON.parse(JSON.stringify(c)); delete x._ph; x.brief.facts=x.brief.facts.filter(f=>f.trim()); x.rules={questions:6,presses:2};
  if(blank4(x)){ const gone=x.suspects[3].id; x.suspects=x.suspects.slice(0,3); x.suspects.forEach(s=>{ s.press.keys=s.press.keys.filter(k=>!k.startsWith(gone+':')); if(!s.press.keys.length) s.press.answer=''; }); } x.suspects.forEach(s=>{ s.age=String(s.age||'?'); if(!s.press.miss) s.press.miss='Nothing to say to that.'; if(!s.look) s.look='No description given.'; if(!s.note) s.note=''; if(s.press.keys.length && s.id!==x.culprit) s.press.secret=true; }); if(!x.solution) x.solution='The maker left no explanation. Draw your own.'; if(!x.arrest) x.arrest=''; return x; }
async function publishCase(mid, stake){
  const m=S.made[mid]; if(!m||m.published) return; const errs=validateCase(m.c); if(errs.length){ toast('Missing: '+errs.slice(0,3).map(e=>e.label).join(', ')+(errs.length>3?'…':'')); return; }
  if(!ONLINE){ toast('Publishing needs the online version.'); return; }
  stake=Math.max(0,Math.floor(+stake||0)); if(stake>S.money){ toast('You can\'t cover a £'+stake+' stake.'); return; }
  const c=cleanCase(m.c); const doc={id:c.id, title:c.title, maker:S.pid, makerName:myName(), stake, status:'open', createdAt:Date.now(), caseData:c, solvedBy:null, solvedByName:null, correct:null, solvedAt:null};
  try{ await db.doc('cases/'+c.id).set(doc); }catch(e){ toast('Could not publish: '+(e.code||e.message)); return; }
  m.published=c.id; m.stake=stake; if(stake) addMoney(-stake); save(); SFX.play('stamp'); toast('Posted to the board'+(stake?' with £'+stake+' on it.':'.')); render();
}
async function withdrawCase(mid){
  const m=S.made[mid]; if(!m||!m.published||!ONLINE) return; const ref=db.doc('cases/'+m.published);
  const lock=await ref.acquire({holder:S.pid, ttlMs:8000}); if(!lock.acquired){ toast('Someone is closing it right now.'); return; }
  const snap=await ref.get(); if(!snap.exists||snap.data().status!=='open'){ toast('Too late; it has been closed.'); return; }
  await ref.update({status:'withdrawn'}); if(m.stake) addMoney(m.stake); m.published=null; save(); toast('Withdrawn. Stake returned.'); render();
}
function takeCase(cid){
  const b=boardCase(cid); if(!b||b.status!=='open') return toast('Not open.'); if(b.maker===S.pid) return toast('That one is yours.'); if(S.taken[cid]) return;
  if(b.stake>S.money) return toast('You need £'+b.stake+' in the purse to take this on.');
  S.taken[cid]={c:b.caseData, stake:b.stake, maker:b.maker, makerName:b.makerName, title:b.title, takenAt:Date.now()}; S.caseId=cid; S.tab='desk'; save(); SFX.play('paper'); render(); window.scrollTo(0,0);
}
async function resolvePlayerCase(c, sid){
  const t=S.taken[c.id]; if(!t) return; const I=localInv(c.id);
  if(!ONLINE){ toast('You need to be online to close a board case.'); return; }
  if(t.stake>S.money){ toast('You can\'t cover the £'+t.stake+' stake any more.'); return; }
  const ref=db.doc('cases/'+c.id);
  const lock=await ref.acquire({holder:S.pid, ttlMs:8000}); if(!lock.acquired){ toast('Someone else is closing this case. Try again in a moment.'); return; }
  const snap=await ref.get(); const d=snap.exists?snap.data():null;
  if(!d||d.status!=='open'){ delete S.taken[c.id]; S.caseId=D.cases[0].id; save(); closeSheet(); render(); toast(d&&d.status==='solved'?'Too late. '+(d.solvedByName||'Someone')+' closed it first.':'The maker withdrew this case.'); return; }
  const correct=sid===c.culprit;
  try{ await ref.update({status:'solved', solvedBy:S.pid, solvedByName:myName(), correct, solvedAt:Date.now()}); }catch(e){ toast('Could not close: '+(e.code||e.message)); return; }
  if(t.stake){ if(correct) addMoney(t.stake); else { addMoney(-t.stake); await credit(t.maker, 2*t.stake, 'your case "'+String(c.title).slice(0,24)+'"'); } }
  S.solved[c.id]={guess:sid, correct, pay:correct?t.stake:0, wager:t.stake, broken:correct&&I.broken, asked:nAsked(c.id), player:true};
  t.done=true; save();
  showVerdict(c, sid, correct, correct?t.stake:0, false, t.stake && !correct ? 'You lose your £'+t.stake+' to '+esc(t.makerName)+'.' : (t.stake&&correct?'£'+t.stake+' from '+esc(t.makerName)+"'s stake.":''));
}

/* ----- co-op ----- */
function coopRef(code){ return db.doc('coop/'+code); }
async function createCoop(){
  if(!ONLINE) return toast('Co-op needs the online version.');
  const c=cur(); if(S.taken[c.id] && S.taken[c.id].stake>0) return toast('Co-op works on story cases and free board cases, not wagers.');
  const code=rid(4).toUpperCase().replace(/[^A-Z0-9]/g,'X'); const doc={code, host:S.pid, hostName:myName(), caseId:c.id, kind:isStory(c.id)?'story':'player', caseData:c, members:{[S.pid]:myName()}, inv:{asked:{},presses:[],revealed:{},broken:false}, proposal:null, result:null, createdAt:Date.now()};
  await coopRef(code).set(doc); S.coop={code}; save(); joinCoop(code,true); pushPresence(); toast('Room '+code+' open.');
}
async function joinCoop(code, resume){
  if(!ONLINE) return toast('Co-op needs the online version.'); code=String(code||'').trim().toUpperCase(); if(!code) return;
  const ref=coopRef(code); const snap=await ref.get(); if(!snap.exists){ toast('No room '+code+'.'); if(resume){ S.coop=null; save(); } return; }
  const d=snap.data(); if(d.result && !resume){ toast('That room has already made its arrest.'); return; }
  if(Date.now()-(d.createdAt||0) > 12*3600*1000){ toast('That room has gone cold.'); if(resume){ S.coop=null; save(); } return; }
  if(!d.members[S.pid]){ const members={...d.members,[S.pid]:myName()}; await ref.update({members}); }
  S.coop={code}; save(); if(unsubCoop) unsubCoop();
  unsubCoop=ref.onSnapshot(s=>{ if(!s.exists){ leaveCoop(true); return; } COOP=s.data(); onCoopUpdate(); render(); }, e=>{ toast('Room lost: '+e.code); leaveCoop(true); });
  pushPresence(); S.tab='desk'; render();
}
async function leaveCoop(silent){
  const code=S.coop&&S.coop.code; if(unsubCoop){ unsubCoop(); unsubCoop=null; }
  if(code && ONLINE && COOP && COOP.members && COOP.members[S.pid]){ try{ const members={...COOP.members}; delete members[S.pid]; if(Object.keys(members).length) await coopRef(code).update({members}); else await coopRef(code).delete(); }catch(e){} }
  S.coop=null; COOP=null; save(); pushPresence(); if(!silent) toast('Left the room.'); render();
}
async function coopUpdateInv(mut){ if(!COOP) return; const I=JSON.parse(JSON.stringify(COOP.inv||{asked:{},presses:[],revealed:{},broken:false})); mut(I); COOP.inv=I; try{ await coopRef(S.coop.code).update({inv:I}); }catch(e){ toast('Could not sync: '+(e.code||e.message)); } }
async function coopPropose(sid){ if(!COOP||COOP.result) return; await coopRef(S.coop.code).update({proposal:{sid, by:S.pid, byName:myName(), votes:{[S.pid]:true}}}); }
async function coopVote(yes){ if(!COOP||!COOP.proposal) return; const p={...COOP.proposal, votes:{...COOP.proposal.votes}}; if(yes){ p.votes[S.pid]=true; await coopRef(S.coop.code).update({proposal:p}); } else await coopRef(S.coop.code).update({proposal:null}); }
async function onCoopUpdate(){
  const d=COOP; if(!d) return;
  // proposer finalises when every member has agreed
  if(d.proposal && !d.result && d.proposal.by===S.pid){ const members=Object.keys(d.members||{}); if(members.every(m=>d.proposal.votes[m])){ const c=d.caseData; const correct=d.proposal.sid===c.culprit; try{ await coopRef(S.coop.code).update({result:{sid:d.proposal.sid, correct, by:S.pid, at:Date.now()}, proposal:null}); }catch(e){} if(d.kind==='player' && db){ try{ const ref=db.doc('cases/'+c.id); const snap=await ref.get(); if(snap.exists&&snap.data().status==='open') await ref.update({status:'solved', solvedBy:S.pid, solvedByName:Object.values(d.members).join(' & '), correct, solvedAt:Date.now()}); }catch(e){} } } }
  if(d.result && !S.coopApplied[d.code]){ S.coopApplied[d.code]=true; const c=d.caseData; const r=d.result; const already=!!S.solved[c.id];
    const broken=r.correct && (d.inv&&d.inv.broken); const pay=(!already && r.correct && isStory(c.id)) ? c.reward+(broken?R.breakBonus:0) : 0;
    if(!already){ S.solved[c.id]={guess:r.sid, correct:r.correct, pay, broken, asked:nAsked(c.id), coop:d.code}; if(S.taken[c.id]) S.taken[c.id].done=true; }
    if(pay) addMoney(pay); save(); showVerdict(c, r.sid, r.correct, pay, broken, already?'You had already closed this file yourself; no second pay.':'Shared with '+esc(Object.values(d.members).filter(n=>n!==myName()).join(', ')||'nobody')+'.'); }
}

function hintsFor(c){
  const cul=sus(c,c.culprit); const keys=cul.press.keys||[]; const list=[];

        return `<div class="casebtn"><span><b>${esc(b.title)}</b><i>by ${esc(b.makerName)} · ${b.stake?'£'+b.stake+' stake':'no stake'}</i></span><span class="st">${mine?'<span class="chip">Yours</span>':taken?`<button class="btn ghost" data-act="opencase" data-id="${b.id}">Open</button>`:`<button class="btn${can?'':' ghost'}" data-act="take" data-id="${b.id}" ${can?'':'disabled'}>${can?'Take on':'Need £'+b.stake}</button>`}</span></div>`; }).join('')+`</div>` : `<p class="empty">Nothing posted yet. Make one.</p>`;
      if(closed.length) h+=`<div class="eyebrow" style="margin-top:18px">Recently closed</div><div class="caselist">`+closed.map(b=>`<div class="casebtn"><span><b>${esc(b.title)}</b><i>by ${esc(b.makerName)} · ${b.correct?'solved':'botched'} by ${esc(b.solvedByName||'?')}${b.stake?' · £'+b.stake:''}${(b.fair||b.unfair)?' · '+(b.fair||0)+' fair, '+(b.unfair||0)+' not':''}</i></span></div>`).join('')+`</div>`;
      h+=`<p class="hintline" style="margin-top:14px">Take a case on and it goes to Mine. Solve it first and the stake is yours; get it wrong and the maker takes yours. Another detective can close it before you.</p>`;

        return `<button class="casebtn${cid===S.caseId?' cur':''}" data-act="opencase" data-id="${cid}"><span><b>${esc(t.title)}</b><i>by ${esc(t.makerName)} · ${t.stake?'£'+t.stake:'free'}</i></span>${st}</button>`; }).join('')+`</div>` : `<p class="empty">You haven't taken any board cases on.</p>`;
    h+=`<div class="eyebrow" style="margin-top:18px">Made by you</div>`;

  } else if(S.casesTab==='daily'){
    if(!ONLINE) h+=offlineNoteCard();

function field(path, label, val, opts={}){ const id='f_'+path.replace(/\W/g,'_'); return `<label class="fld"><span>${esc(label)}</span>${opts.area?`<textarea data-path="${path}" rows="${opts.rows||2}" placeholder="${esc(opts.ph||'')}">${esc(val)}</textarea>`:`<input data-path="${path}" value="${esc(val)}" placeholder="${esc(opts.ph||'')}" ${opts.type?'type="'+opts.type+'"':''}>`}</label>`; }
function editorHTML(){
  const mid=S.editing; const m=mid&&S.made[mid];
  if(!m){ return `<div class="card-note"><h2>Make your own mystery</h2><p>You decide who died, how, and who did it. You write four suspects and what each one says. Then other detectives try to solve it.</p><p><b>How to make a good one:</b></p><p>1. Pick the killer first.<br>2. Give the killer one slip-up: they mention something only the police know, or they say something a clue proves is a lie.<br>3. Give one innocent person a small secret too, so it isn't too easy.</p><p>You can put money on your case. If a detective gets it right, they win that much from you. If they get it wrong, you win that much from them. Or make it free.</p><p><b>Start from:</b></p><div class="row"><button class="btn" data-act="newdraft">A blank page</button><button class="btn ghost" data-act="newdraft" data-t="poison">A poisoning</button><button class="btn ghost" data-act="newdraft" data-t="fall">A fall</button><button class="btn ghost" data-act="newdraft" data-t="stab">A stabbing</button></div><div class="row" style="margin-top:8px"><button class="btn ghost" data-act="pastecode">Paste a case code</button>${Object.keys(S.made).length?'<button class="btn ghost" data-act="ctab" data-ctab="mine">My saved cases</button>':''}</div>${ONLINE?'':`<p style="margin-top:10px">You're on the offline copy: you can write cases here, but posting them needs the <a href="${ONLINE_URL}" target="_blank" rel="noopener" style="color:var(--lamp)">online version</a>. Copy a case code from here and paste it there.</p>`}</div>`; }
  const c=m.c; const errs=validateCase(c);
  const evOpts=(forSid)=>{ const o=[['','— nothing, they never crack —']]; c.brief.facts.forEach((f,i)=>{ if(f.trim()) o.push(['f'+i,'Secret clue '+(i+1)+': '+f.slice(0,40)]); }); c.suspects.forEach(s=>{ if(s.id===forSid) return; s.answers.forEach((a,j)=>{ if(a.trim()) o.push([s.id+':'+j,'What '+(s.name||'a suspect')+' said to Q'+(j+1)+': '+a.slice(0,36)]); }); if(s.press.keys.length&&s.press.answer) o.push([s.id+':press','What '+(s.name||'a suspect')+' admitted: '+s.press.answer.slice(0,30)]); }); return o; };
  let h=`<div class="editor">`;
  if(errs.length) h+=`<p class="hintline" style="margin-top:0">Still to fill in (tap one to jump to it): ${errs.slice(0,6).map(e=>`<button class="goto" data-act="goto" data-path="${esc(e.path)}">${esc(e.label)}</button>`).join(', ')}${errs.length>6?', and '+(errs.length-6)+' more':''}</p>`;
  h+=`<div class="eyebrow">1 · The crime</div>`;
  h+=field('title','Name of the case',c.title,{ph:'The Body in the Bell Tower'});
  h+=field('brief.victim','Who died? (name, age, what they did)',c.brief.victim,{ph:'Mr Fry, 50, the baker'})+field('brief.weapon','What killed them?',c.brief.weapon,{ph:'A rolling pin'})+field('brief.time','When did it happen?',c.brief.time,{ph:'Between nine and ten on Friday night'})+field('brief.place','Where did it happen?',c.brief.place,{ph:'The bakery kitchen'});
  h+=field('brief.public','What the newspaper told everyone',c.brief.public,{area:true,ph:c._ph||'"The baker was found dead in his kitchen." Leave the weapon out: only the police and the killer know it.'});
  h+=`<p class="tip">Secret clues are things only the police know. If a suspect mentions one, or says something a clue proves wrong, the detective can catch them.</p>`;
  c.brief.facts.forEach((f,i)=>{ h+=field('brief.facts.'+i,'Secret clue '+(i+1)+' (you can leave this empty)',f,{area:true,ph:i?'':'He was hit from behind with a rolling pin. The back door was locked from inside. Leave all three empty for a case where the detective starts with nothing.'}); });
  h+=`<div class="eyebrow" style="margin-top:14px">2 · Three questions</div><p class="tip">The detective can ask every suspect these same three questions.</p>`;

    const killer=c.culprit===s.id;
    h+=`<div class="eyebrow" style="margin-top:14px">${i===0?'3 · ':''}Suspect ${i+1}${i===3?' (optional)':''} <label class="cul"><input type="radio" name="culprit" data-path="culprit" value="${s.id}" ${killer?'checked':''}> this is the killer</label></div>`;
    if(i===0) h+=`<p class="tip">Three or four suspects. Tick the one who really did it. Only one can be the killer.</p>`;
    if(i===3) h+=`<p class="tip">Three suspects are enough. Leave this one blank if you don't need a fourth.</p>`;
    h+=field('suspects.'+i+'.name','Name',s.name,{ph:'Mrs Crumb'})+field('suspects.'+i+'.age','Age',s.age,{ph:'40'})+field('suspects.'+i+'.job','Their job, or how they knew the victim',s.job,{ph:'His wife / the shop boy / a customer'})+field('suspects.'+i+'.look','What they look like',s.look,{ph:'Tall, nervous, flour on her sleeves'})+field('suspects.'+i+'.note','What the police already know about them',s.note,{area:true,ph:'Owed him money. Was seen nearby that night.'});
    s.answers.forEach((a,j)=>{ h+=field('suspects.'+i+'.answers.'+j,'Their answer to question '+(j+1)+(c.questions[j]?': "'+c.questions[j].slice(0,40)+'"':''),a,{area:true,ph:j===0?'I was at home in bed.':''}); });
    h+=`<label class="fld"><span>${killer?'What catches the killer out?':'What proves this person is hiding something? (leave it if they are just honest)'}</span><select data-path="suspects.${i}.press.keys">${evOpts(s.id).map(([v,l])=>`<option value="${esc(v)}" ${s.press.keys[0]===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
    h+=`<p class="tip">${killer?'Pick the secret clue or the other statement that shows this person lied. When the detective shows it to them, they confess.':'If you pick something here, the detective can make this person admit a small secret that is NOT the murder. It makes the case trickier.'}</p>`;
    h+=field('suspects.'+i+'.press.answer',killer?'The confession (what they say when they are caught)':'The secret they admit instead (not murder!)',s.press.answer,{area:true,ph:killer?'All right! He laughed at me, so I hit him.':'Fine. I was stealing buns, not killing anyone.'})+field('suspects.'+i+'.press.miss','What they say if the detective shows them the wrong clue',s.press.miss,{ph:'That has nothing to do with me.'});
  });
  h+=`<div class="eyebrow" style="margin-top:14px">4 · The ending</div>`+field('solution','Explain how a clever detective could have worked it out (shown after the arrest)',c.solution,{area:true,rows:3,ph:'Mrs Crumb said she never went in the kitchen, but she knew about the rolling pin, and the newspaper never mentioned it.'})+field('arrest','One last sentence for the ending (you can skip this)',c.arrest,{ph:'She cried all the way to the cells.'});
  h+=`<div class="eyebrow" style="margin-top:14px">5 · Post your case</div><label class="fld"><span>Money on it? Type 0 for free · you have £${S.money}</span><input id="stake" type="number" min="0" max="${S.money}" value="${m.stake||0}"></label><p class="tip">If a detective gets it right, they win this much from you. If they get it wrong, you win this much from them. The money comes out of your purse when you post, and comes back if you take the case down.</p>`;
  h+= errs.length? `<p class="hintline">Still to fill in (tap one to jump to it): ${errs.slice(0,6).map(e=>`<button class="goto" data-act="goto" data-path="${esc(e.path)}">${esc(e.label)}</button>`).join(', ')}${errs.length>6?', and '+(errs.length-6)+' more':''}</p>` : `<p class="hintline">All done. Post it when you're happy with it.</p>`;
  if(!ONLINE) h+=`<div class="card-note" style="margin:0 0 12px"><h2>This copy can't post</h2><p>You're on the offline version of the game, so there is no board to post to. Your case is saved on this device.</p><p>To post it: tap <b>Copy case code</b>, open the online version, go to Cases → Make → <b>Paste a case code</b>, and post it there.</p><div class="row"><button class="btn" data-act="copycode" data-id="${mid}">Copy case code</button><a class="btn ghost" href="${ONLINE_URL}" target="_blank" rel="noopener">Open the online version</a></div></div>`;
  if(!errs.length && !m.tested) h+=`<p class="tip">Before you post it, play it once yourself as the detective. That catches clues that don't line up.</p>`;
  h+=`<div class="row" style="margin-top:8px"><button class="btn${m.tested?' ghost':''}" data-act="testcase" data-id="${mid}" ${errs.length?'disabled':''}>${m.tested?'Test it again':'Test it'}</button>${ONLINE?`<button class="btn" data-act="publish" data-id="${mid}" ${errs.length||!m.tested?'disabled':''}>Post to the board</button>`:''}<button class="btn ghost" data-act="closeeditor">Save and close</button>${ONLINE?`<button class="btn ghost" data-act="copycode" data-id="${mid}">Copy case code</button>`:''}</div>${ONLINE&&!errs.length&&!m.tested?'<p class="hintline">Posting unlocks after one test play.</p>':''}<p class="hintline" style="margin-top:8px">Everything saves as you type. A case code lets you move a case to another device or share it with a friend.</p></div>`;
  return h;
}
function setPath(obj, path, val){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; } o[parts[parts.length-1]]=val; }

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- Music ---------- */
const TRACKS=[['Theme I','audio/theme-1.m4a'],['Theme II','audio/theme-2.m4a']];
const audio=new Audio(); audio.volume=.8; audio.preload='none';
let musicWanted = S.music!==false; // on by default; starts at the first tap, since phones need one
function updateMusicUI(){
  if(!TRACKS.length){ $('#musicBtn').hidden=true; document.querySelectorAll('.musicbar').forEach(x=>x.hidden=true); return; }
  const playing=!audio.paused && !audio.ended && audio.src;
  const b=$('#musicBtn'); b.classList.toggle('on', !!playing); b.title = playing ? 'Music: '+TRACKS[S.track||0][0]+' (tap to pause)' : 'Music off (tap to play)';
  document.querySelectorAll('.musicbar b').forEach(x=>x.textContent = playing ? TRACKS[S.track||0][0] : 'off');
  document.querySelectorAll('.musicbar [data-act="music"]').forEach(x=>x.textContent = playing ? 'Pause' : 'Play');
}
function playTrack(i){ if(!TRACKS.length) return; S.track=((i%TRACKS.length)+TRACKS.length)%TRACKS.length; audio.src=TRACKS[S.track][1]; audio.play().then(()=>{ S.music=true; musicWanted=true; save(); updateMusicUI(); }).catch(()=>updateMusicUI()); }
audio.addEventListener('ended',()=>playTrack((S.track||0)+1)); audio.addEventListener('pause',updateMusicUI); audio.addEventListener('play',updateMusicUI);
function toggleMusic(){ if(!audio.paused && audio.src){ audio.pause(); S.music=false; musicWanted=false; save(); } else playTrack(S.track||0); }

/* ---------- Sound effects (synthesised) ---------- */
const SFX=(()=>{
  let ctx=null, master=null, amb=null, ambNodes=null, tickTimer=null, noiseBuf=null;
  const on=()=>S.sfx!==false;
  function get(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC(); master=ctx.createGain(); master.gain.value=.6; master.connect(ctx.destination); amb=ctx.createGain(); amb.gain.value=0; amb.connect(ctx.destination); } if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function noise(){ const c=get(); if(!noiseBuf){ const n=c.sampleRate*2, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; noiseBuf=b; } return noiseBuf; }
  function burst({dur=.2,type='bandpass',f0=1000,f1=null,q=1,g=.3,at=0,attack=.005}){ const c=get(); if(!c) return; const src=c.createBufferSource(); src.buffer=noise(); src.loop=true; const fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q; const t=c.currentTime+at; fl.frequency.setValueAtTime(f0,t); if(f1) fl.frequency.exponentialRampToValueAtTime(f1,t+dur); const gn=c.createGain(); gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+attack); gn.gain.exponentialRampToValueAtTime(.0005,t+dur); src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t); src.stop(t+dur+.05); }
  function tone({f=440,f1=null,dur=.3,g=.3,type='sine',at=0}){ const c=get(); if(!c) return; const o=c.createOscillator(); o.type=type; const t=c.currentTime+at; o.frequency.setValueAtTime(f,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); const gn=c.createGain(); gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+.004); gn.gain.exponentialRampToValueAtTime(.0005,t+dur); o.connect(gn); gn.connect(master); o.start(t); o.stop(t+dur+.05); }
  const fx={
    paper(){ burst({dur:.28,f0:1400,f1:500,q:.8,g:.22,attack:.03}); },
    scratch(){ [0,.07,.15].forEach(at=>burst({dur:.05,type:'highpass',f0:2200,g:.12,at})); },
    page(){ burst({dur:.16,f0:3000,f1:1200,q:.7,g:.16,attack:.01}); },
    stamp(){ tone({f:95,f1:45,dur:.22,g:.7}); burst({dur:.05,type:'lowpass',f0:700,g:.45}); },
    clank(){ [1250,1870,2630,3390].forEach((f,i)=>tone({f:f*(1+(Math.random()-.5)*.01),dur:.55-i*.08,g:.12,type:'triangle'})); burst({dur:.08,type:'highpass',f0:1500,g:.2}); tone({f:140,f1:70,dur:.25,g:.3,at:.02}); },
    coin(){ tone({f:4200,dur:.14,g:.16}); tone({f:5700,dur:.12,g:.1}); tone({f:4600,dur:.16,g:.14,at:.1}); tone({f:6100,dur:.14,g:.08,at:.1}); },
    drawer(){ burst({dur:.32,type:'lowpass',f0:500,f1:150,g:.35,attack:.02}); tone({f:70,f1:40,dur:.14,g:.4,at:.28}); },
    knock(){ tone({f:180,f1:120,dur:.13,g:.4}); burst({dur:.03,type:'lowpass',f0:1200,g:.3}); }
  };
  function play(name){ if(!on()) return; try{ if(!get()) return; fx[name]&&fx[name](); }catch(e){} }
  function ambience(want){
    try{ const c=get(); if(!c) return;
      if(want && !ambNodes){
        const src=c.createBufferSource(); src.buffer=noise(); src.loop=true; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; const rain=c.createGain(); rain.gain.value=.05;
        const lfo=c.createOscillator(); lfo.frequency.value=.08; const lfoG=c.createGain(); lfoG.gain.value=.02; lfo.connect(lfoG); lfoG.connect(rain.gain);
        src.connect(lp); lp.connect(rain); rain.connect(amb); src.start(); lfo.start();
        let tock=false;
        tickTimer=setInterval(()=>{ if(c.state!=='running') return; const t=c.currentTime+.02; const s2=c.createBufferSource(); s2.buffer=noise(); const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=tock?2600:3400; f.Q.value=6; const g=c.createGain(); g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0005,t+.03); s2.connect(f); f.connect(g); g.connect(amb); s2.start(t); s2.stop(t+.05); tock=!tock; },1000);
        ambNodes={src,lfo}; amb.gain.setTargetAtTime(1,c.currentTime,.8);
      } else if(!want && ambNodes){ amb.gain.setTargetAtTime(0,c.currentTime,.4); clearInterval(tickTimer); const n=ambNodes; ambNodes=null; setTimeout(()=>{ try{ n.src.stop(); n.lfo.stop(); }catch(e){} },1500); }
    }catch(e){}
  }
  return {play, ambience, unlock:()=>{ try{ get(); }catch(e){} }};
})();
function updateSoundUI(){ const b=$('#sndBtn'); if(!b) return; const any=(S.sfx!==false)||S.amb===true; b.classList.toggle('off',!any); b.classList.toggle('on',S.amb===true); }
function openSound(){
  const row=(k,label,sub,val)=>`<div class="setrow"><span><b>${label}</b><i>${sub}</i></span><button class="sw${val?' on':''}" data-act="toggle" data-k="${k}">${val?'On':'Off'}</button></div>`;
  let h=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Settings</h3><p class="sub">Sound and game</p>`;
  h+=row('sfx','Effects','Paper, pen, stamp, coins, the cell door.',S.sfx!==false);
  h+=row('amb','Rain and the clock','A quiet room under everything.',S.amb===true);
  h+=`<div class="setrow"><span><b>Answers stay on the page</b><i>Easier. Off means answers show once and your notebook is all you have.</i></span><button class="sw${easy()?' on':''}" data-act="easy">${easy()?'On':'Off'}</button></div>`;
  if(TRACKS.length) h+=row('music','Music',TRACKS.map(t=>t[0]).join(', '),!audio.paused&&!!audio.src);
  h+=`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="closesheet">Back to the desk</button></div>`;
  $('#sheet').innerHTML=h; $('#sheet').classList.add('open'); $('#scrim').classList.add('on');
}
function askSheet({title, sub, body, input, area, value, placeholder, okLabel, danger, onOk}){
  let h=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body?`<p>${body}</p>`:''}`;
  if(input) h+=`<label class="fld">${area?`<textarea id="ask_in" rows="4" placeholder="${esc(placeholder||'')}">${esc(value||'')}</textarea>`:`<input id="ask_in" value="${esc(value||'')}" placeholder="${esc(placeholder||'')}" autocapitalize="none">`}</label>`;
  h+=`<p class="hintline" id="ask_msg" style="min-height:1.2em"></p><div class="row"><button class="btn${danger?' danger':''}" data-act="askok">${okLabel||'OK'}</button><button class="btn ghost" data-act="closesheet">Cancel</button></div>`;
  $('#sheet').innerHTML=h; $('#sheet').classList.add('open'); $('#scrim').classList.add('on'); $('#sheet').scrollTop=0;
  askSheet.onOk=onOk; if(input) setTimeout(()=>{ const el=$('#ask_in'); if(el){ el.focus(); if(!area) el.select(); } },250);
}
function showCode(code){
  $('#sheet').innerHTML=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Case code</h3><p class="sub">Copy all of this</p><p>Tap Copy. If that doesn't work on your phone, press and hold inside the box, choose Select all, then Copy.</p><label class="fld"><textarea id="code_out" rows="5" readonly>${esc(code)}</textarea></label><p class="hintline" id="code_msg" style="min-height:1.2em"></p><div class="row"><button class="btn" data-act="copyout">Copy</button><button class="btn ghost" data-act="closesheet">Done</button></div>`;
  $('#sheet').classList.add('open'); $('#scrim').classList.add('on'); $('#sheet').scrollTop=0; setTimeout(()=>{ const el=$('#code_out'); if(el){ el.focus(); el.select(); } },250);
}
function openCoopMenu(){
  let h=`<button class="close" data-act="closesheet" aria-label="Close">×</button><h3>Co-op room</h3><p class="sub">Work a case together</p>`;
  if(!ONLINE) h+=`<p>Co-op needs the game opened through its claude.ai link, so the room can be shared.</p>`;
  else h+=`<p>Open a room on the case you have on the desk and give the code to another detective. You share one budget of questions and presses, see each other's work as it happens, and must all agree before the warrant is signed. Story cases pay everyone; free board cases work too; wagers don't.</p><div class="row"><button class="btn" data-act="coopcreate">Open a room on “${esc(cur().title)}”</button></div><p class="sub" style="margin-top:16px">Or join one</p><div class="row"><input id="joincode" class="code-in" placeholder="CODE" maxlength="4" autocapitalize="characters"><button class="btn ghost" data-act="coopjoin">Join</button></div>`;
  h+=`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="closesheet">Back</button></div>`;
  $('#sheet').innerHTML=h; $('#sheet').classList.add('open'); $('#scrim').classList.add('on');
}

/* ---------- Events ---------- */
let ambStarted=false;
document.addEventListener('click',e=>{
  if(!ambStarted && S.amb){ ambStarted=true; SFX.unlock(); SFX.ambience(true); }
  if(musicWanted && !audio.src && !e.target.closest('[data-act="music"]')) playTrack(S.track||0);
  const tab=e.target.closest('nav.tabs button'); if(tab){ S.tab=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const ct=e.target.closest('[data-ctab]'); if(ct && !e.target.closest('[data-act]')){ S.casesTab=ct.dataset.ctab; render(); return; }
  if(e.target.id==='scrim'){ closeSheet(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(act==='intro'){ S.intro=false; SFX.unlock(); SFX.play('paper'); render(); if(S.amb) SFX.ambience(true); }
  else if(act==='sound'){ openSound(); }
  else if(act==='toggle'){ const k=a.dataset.k; if(k==='sfx'){ S.sfx=!(S.sfx!==false); if(S.sfx) SFX.play('knock'); } else if(k==='amb'){ S.amb=!S.amb; SFX.ambience(!!S.amb); } else if(k==='music'){ toggleMusic(); } save(); updateSoundUI(); setTimeout(openSound,k==='music'?150:0); }
  else if(act==='tab'){ S.tab=a.dataset.tab; render(); window.scrollTo(0,0); }
  else if(act==='ctab'){ S.casesTab=a.dataset.ctab; S.tab='cases'; render(); }
  else if(act==='notepage'){ S.notePage=a.dataset.p; render(); }
  else if(act==='easy'){ S.easy=!S.easy; save(); render(); setTimeout(openSound,0); }
  else if(act==='suspect'){ SFX.play('paper'); openSuspect(a.dataset.id,false); }
  else if(act==='ask'){ doAsk(a.dataset.id, +a.dataset.q); }
  else if(act==='pressmenu'){ pressMenu(a.dataset.id); }
  else if(act==='press'){ doPress(a.dataset.id, a.dataset.ev); }
  else if(act==='accuse'){ confirmAccuse(a.dataset.id); }
  else if(act==='arrest'){ arrest(a.dataset.id); }
  else if(act==='cooppropose'){ coopPropose(a.dataset.id); closeSheet(); }
  else if(act==='coopvote'){ coopVote(a.dataset.v==='1'); }
  else if(act==='coopmenu'){ openCoopMenu(); }
  else if(act==='coopcreate'){ closeSheet(); createCoop(); }
  else if(act==='coopjoin'){ const v=$('#joincode')&&$('#joincode').value; closeSheet(); joinCoop(v,false); }
  else if(act==='coopleave'){ leaveCoop(false); }
  else if(act==='rename'){ askSheet({title:'Your name', sub:'Shown on the board and in rooms', input:true, value:S.name||'', placeholder:myName(), okLabel:'Save', onOk:(n)=>{ S.name=String(n||'').trim().slice(0,24); save(); pushPlayer(); pushPresence(); if(inCoop()&&COOP.members[S.pid]!==myName()){ const members={...COOP.members,[S.pid]:myName()}; coopRef(S.coop.code).update({members}).catch(()=>{}); } closeSheet(); render(); }}); }
  else if(act==='account'){ openAccount(); }
  else if(act==='showpw'){ const i=$('#acc_p'); if(i){ const show=i.type==='password'; i.type=show?'text':'password'; a.textContent=show?'Hide':'Show'; i.focus(); } }
  else if(act==='login'){ accountAction('login'); }
  else if(act==='register'){ accountAction('register'); }
  else if(act==='signout'){ askSheet({title:'Sign out?', body:'This device goes back to a fresh guest. Your purse and cases stay with the account and come back when you sign in.', okLabel:'Sign out', danger:true, onOk:()=>{ closeSheet(); signOut(); }}); }
  else if(act==='closesheet'){ closeSheet(); }
  else if(act==='opencase'){ if(inCoop()){ toast('Leave the co-op room first.'); return; } if(unlocked(a.dataset.id) && getCase(a.dataset.id)){ SFX.play('paper'); S.caseId=a.dataset.id; S.tab='desk'; closeSheet(); render(); window.scrollTo(0,0); } }
  else if(act==='take'){ takeCase(a.dataset.id); }
  else if(act==='newdraft'){ const c=blankCase(a.dataset.t); const mid='m'+rid(6); S.made[mid]={c, stake:0, published:null, tested:false, createdAt:Date.now()}; S.editing=mid; save(); render(); window.scrollTo(0,0); }
  else if(act==='testcase'){ const mid=a.dataset.id; const m=S.made[mid]; if(!m||validateCase(m.c).length) return; S.testing={mid, cid:m.c.id}; delete S.inv[m.c.id+'#test']; S.caseId=m.c.id; S.tab='desk'; save(); SFX.play('paper'); render(); window.scrollTo(0,0); }
  else if(act==='endtest'){ const mid=S.testing&&S.testing.mid; S.testing=null; S.caseId=D.cases[0].id; S.tab='cases'; S.casesTab='make'; S.editing=mid; save(); render(); }
  else if(act==='practice'){ S.practice=a.dataset.id; delete S.inv[a.dataset.id+'#practice']; S.caseId=a.dataset.id; S.tab='desk'; closeSheet(); save(); render(); window.scrollTo(0,0); }
  else if(act==='endpractice'){ const cid=S.practice; S.practice=null; delete S.inv[cid+'#practice']; save(); render(); }
  else if(act==='playdaily'){ const date=todayKey(); const cid=dailyCaseId(date); S.daily={cid,date}; delete S.inv[cid+'#daily'+date]; S.caseId=cid; S.tab='desk'; save(); render(); window.scrollTo(0,0); }
  else if(act==='enddaily'){ const d=S.daily; S.daily=null; if(d) delete S.inv[d.cid+'#daily'+d.date]; save(); render(); }
  else if(act==='hints'){ openHints(); }
  else if(act==='buyhintpack'){ if(S.money<1) return; addMoney(-1); S.hintTokens=(S.hintTokens||0)+2; SFX.play('coin'); save(); openHints(); render(); }
  else if(act==='usehint'){ const c=cur(); const list=hintsFor(c); const used=hintsUsed(c); if(!list[used]||(S.hintTokens||0)<1) return; S.hintTokens-=1; S.hints[invKey(c.id)]=used+1; SFX.play('page'); save(); openHints(); render(); }
  else if(act==='rate'){ const cid=a.dataset.id; if(!ONLINE||S.rated&&S.rated[cid]) return; S.rated=S.rated||{}; S.rated[cid]=true; save(); const f=a.dataset.v; db.doc('cases/'+cid).get().then(sn=>{ if(!sn.exists) return; const d=sn.data(); const u={}; u[f]=(d[f]||0)+1; return db.doc('cases/'+cid).update(u); }).then(()=>toast('Thanks. The maker will see it.')).catch(()=>{}); a.parentElement.innerHTML='<span class="chip">Thanks</span>'; }
  else if(act==='dismissoffline'){ S.offlineNoteSeen=true; save(); render(); }
  else if(act==='edit'){ S.editing=a.dataset.id; S.casesTab='make'; render(); window.scrollTo(0,0); }
  else if(act==='deldraft'){ const id=a.dataset.id; askSheet({title:'Delete this case?', body:'It goes for good. Copy its case code first if you might want it back.', okLabel:'Delete', danger:true, onOk:()=>{ delete S.made[id]; if(S.editing===id) S.editing=null; save(); closeSheet(); render(); }}); }
  else if(act==='goto'){ const path=a.dataset.path; const el=document.querySelector(`.editor [data-path="${path}"]`); if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); const box=el.closest('.fld')||el.closest('.eyebrow')||el; box.classList.add('flash'); setTimeout(()=>box.classList.remove('flash'),1600); setTimeout(()=>{ try{ el.focus({preventScroll:true}); }catch(e){} },350); } }
  else if(act==='copycode'){ const m=S.made[a.dataset.id]; if(!m) return; showCode(caseCode(m.c)); }
  else if(act==='copyout'){ const el=$('#code_out'); el.focus(); el.select(); copyText(el.value).then(ok=>{ const msg=$('#code_msg'); if(msg) msg.textContent= ok?'Copied. Now paste it in the online version under Cases → Make.':'Copying was blocked. Press and hold in the box, Select all, then Copy.'; }); }
  else if(act==='pastecode'){ askSheet({title:'Paste a case code', sub:'From the offline copy or a friend', input:true, area:true, placeholder:'DETECTIVE1.…', okLabel:'Load the case', onOk:(t)=>{ const c=parseCaseCode(t); if(!c){ return 'That is not a case code. It starts with DETECTIVE1.'; } const mid='m'+rid(6); S.made[mid]={c, stake:0, published:null, createdAt:Date.now()}; S.editing=mid; S.casesTab='make'; save(); SFX.play('paper'); toast('Case loaded. Check it over and post it.'); closeSheet(); render(); window.scrollTo(0,0); }}); }
  else if(act==='askok'){ const el=$('#ask_in'); const v=el?el.value:''; const err=askSheet.onOk && askSheet.onOk(v); if(err){ const msg=$('#ask_msg'); if(msg) msg.textContent=err; } }
  else if(act==='closeeditor'){ S.editing=null; S.casesTab='mine'; save(); render(); }
  else if(act==='publish'){ publishCase(a.dataset.id, $('#stake')&&$('#stake').value); }
  else if(act==='withdraw'){ withdrawCase(a.dataset.id); }
  else if(act==='buy'){ const d=D.decor.find(x=>x.id===a.dataset.id); if(d && S.money>=d.price && !S.owned.includes(d.id)){ addMoney(-d.price); S.owned.push(d.id); SFX.play('coin'); setTimeout(()=>SFX.play('knock'),220); toast(d.name+' bought.'); render(); } }
  else if(act==='buyhand'){ const x=D.hands.find(y=>y.id===a.dataset.id); if(x && S.money>=x.price && !S.owned.includes('hand:'+x.id)){ addMoney(-x.price); S.owned.push('hand:'+x.id); S.hand=x.id; SFX.play('coin'); setTimeout(()=>SFX.play('page'),200); toast(x.name+' bought and in use.'); render(); } }
  else if(act==='usehand'){ S.hand=a.dataset.id; SFX.play('page'); render(); }
  else if(act==='music'){ toggleMusic(); }
  else if(act==='nexttrack'){ playTrack((S.track||0)+1); }
  else if(act==='ack'){ S.tutAck=true; render(); }
  else if(act==='skiptut'){ S.tut=null; render(); }
  else if(act==='reset'){ askSheet({title:'Start over?', body:'Back to the first case. Purse, desk and notebook go too. Your name and account stay.', okLabel:'Start over', danger:true, onOk:()=>{ const keep={pid:S.pid,name:S.name,account:S.account,sfx:S.sfx,amb:S.amb}; S=Object.assign(fresh(),keep); save(); pushPlayer(); closeSheet(); render(); }}); }
});
document.addEventListener('input',e=>{
  if(e.target.dataset && e.target.dataset.note!==undefined){ S.notes[e.target.dataset.note]=e.target.value; save(); return; }
  const p=e.target.dataset && e.target.dataset.path; if(p && S.editing && S.made[S.editing]){
    const c=S.made[S.editing].c; let v=e.target.value;
    if(p.endsWith('press.keys')) v = v? [v] : [];
    setPath(c,p,v); S.made[S.editing].tested=false; save();
    if(e.target.tagName==='SELECT' || e.target.type==='radio') render();
  }
});
document.addEventListener('change',e=>{ const p=e.target.dataset && e.target.dataset.path; if(p && (e.target.type==='radio'||e.target.tagName==='SELECT') && S.editing){ const c=S.made[S.editing].c; let v=e.target.value; if(p.endsWith('press.keys')) v=v?[v]:[]; setPath(c,p,v); save(); render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
render();
initNet();
})();
</script>
